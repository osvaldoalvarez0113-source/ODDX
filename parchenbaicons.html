<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parche · iconos color NBA</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#070B12;color:#F1F5FB;padding:20px;line-height:1.6}
button{background:#3B82F6;color:#020509;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px}
button:disabled{opacity:.5}
a{color:#60A5FA}
</style>
</head>
<body>
<h2>Parche: iconos a color — NBA</h2>
<p>Sube este archivo al repo ODDX (junto a nba.html) y ábrelo desde ahí. Le agrega un icono de color a cada título de sección (Ratings, Ganador, Hándicap, Total de puntos) — antes eran solo texto plano.</p>
<button id="ir">Aplicar parche</button>
<div id="out"></div>

<script>
var MARCA_INICIO='<!--OVAPATCH:ICONOS:BEGIN-->';
var MARCA_FIN='<!--OVAPATCH:ICONOS:END-->';

var PARCHE = MARCA_INICIO + '\n<style>\nh3{display:flex;align-items:center;gap:6px}\n<' + '/style>\n<script>\n' +
'(function(){\n' +
' try{\n' +
'  var IC={\n' +
'   marcador:"<rect x=\\"2\\" y=\\"4.6\\" width=\\"20\\" height=\\"14.8\\" rx=\\"2.4\\" fill=\\"#22303E\\"/><rect x=\\"2\\" y=\\"4.6\\" width=\\"20\\" height=\\"14.8\\" rx=\\"2.4\\" fill=\\"none\\" stroke=\\"#3A4D5F\\" stroke-width=\\"1\\"/><path d=\\"M5.4 8.4h4v3h-4zM5.4 12.6h4v3h-4z\\" fill=\\"#F0B849\\"/><path d=\\"M14.6 8.4h4v3h-4zM14.6 12.6h4v3h-4z\\" fill=\\"#4F8FD6\\"/>",\n' +
'   balanza:"<path d=\\"M11.1 3.4h1.8v16.8h-1.8z\\" fill=\\"#93A8BA\\"/><path d=\\"M6.4 20.2h11.2v1.7H6.4zM3.4 7.7h17.2v1.7H3.4z\\" fill=\\"#93A8BA\\"/><circle cx=\\"12\\" cy=\\"4.2\\" r=\\"1.5\\" fill=\\"#C7D3DE\\"/><path d=\\"M3.6 9.6 1.3 14.5a3 3 0 0 0 5.6 0z\\" fill=\\"#F0B849\\"/><path d=\\"M20.4 9.6l2.3 4.9a3 3 0 0 1-5.6 0z\\" fill=\\"#4F8FD6\\"/>",\n' +
'   trofeo:"<path d=\\"M8 3.4h8v5.2a4 4 0 0 1-8 0z\\" fill=\\"#F0B849\\"/><path d=\\"M8 5.4H5.4v1.5a3.1 3.1 0 0 0 2.9 3.1M16 5.4h2.6v1.5a3.1 3.1 0 0 1-2.9 3.1\\" fill=\\"none\\" stroke=\\"#F0B849\\" stroke-width=\\"1.5\\"/><path d=\\"M10.6 13.4h2.8v3.4h-2.8zM8.6 19.4h6.8v1.8H8.6z\\" fill=\\"#C99A3A\\"/>",\n' +
'   llama:"<path d=\\"M12 2.2c3.1 4.5 5.3 6.6 5.3 10.1A5.3 5.3 0 0 1 12 17.6a5.3 5.3 0 0 1-5.3-5.3c0-2.1 1-3.5 2.3-4.5.2 1.3 1.1 2.6 2.2 2.6 0-3.4-1.1-5.6.8-8.2z\\" fill=\\"#E8763C\\"/><path d=\\"M12 9.8c1.4 2 2.3 3 2.3 4.4A2.3 2.3 0 0 1 12 16.5a2.3 2.3 0 0 1-2.3-2.3c0-1.1.6-2 1.3-2.6.1.6.5 1.2 1 1.2 0-1.5-.5-2.5 0-3z\\" fill=\\"#F5CE6B\\"/>",\n' +
'   libreta:"<path d=\\"M5.4 3.6h11.4a2.2 2.2 0 0 1 2.2 2.2v14.6H7.6a2.2 2.2 0 0 1-2.2-2.2z\\" fill=\\"#E9E3D6\\"/><path d=\\"M5.4 16.6h13.6v3.8H7.6a2.2 2.2 0 0 1-2.2-2.2z\\" fill=\\"#C9C0AD\\"/><path d=\\"M8.4 7.4h7.6M8.4 10.4h7.6M8.4 13.4h5\\" stroke=\\"#8A8271\\" stroke-width=\\"1.3\\" stroke-linecap=\\"round\\"/>",\n' +
'   pelota:"<circle cx=\\"12\\" cy=\\"12\\" r=\\"9.1\\" fill=\\"#F4F1EA\\"/><path d=\\"M6.4 5.6c2.6 4.1 2.6 8.7 0 12.8M17.6 5.6c-2.6 4.1-2.6 8.7 0 12.8\\" fill=\\"none\\" stroke=\\"#4F8FD6\\" stroke-width=\\"1.5\\" stroke-linecap=\\"round\\"/>",\n' +
'   engrane:"<circle cx=\\"12\\" cy=\\"12\\" r=\\"8.4\\" fill=\\"#3A4D5F\\"/><path d=\\"M12 2.4l1.5 2.2h-3zM12 21.6l-1.5-2.2h3zM2.4 12l2.2-1.5v3zM21.6 12l-2.2 1.5v-3zM5.2 5.2l2.6.5-2.1 2.1zM18.8 18.8l-2.6-.5 2.1-2.1zM18.8 5.2l-.5 2.6-2.1-2.1zM5.2 18.8l.5-2.6 2.1 2.1z\\" fill=\\"#3A4D5F\\"/><circle cx=\\"12\\" cy=\\"12\\" r=\\"3.4\\" fill=\\"#0A1119\\"/>"\n' +
'  };\n' +
'  var MAPA=[\n' +
'   [/ratings/i,"engrane"],\n' +
'   [/^ganador$/i,"trofeo"],\n' +
'   [/h[aá]ndicap/i,"balanza"],\n' +
'   [/total de puntos/i,"marcador"]\n' +
'  ];\n' +
'  function procesar(){\n' +
'   document.querySelectorAll("h3:not([data-ova])").forEach(function(h){\n' +
'    var t=(h.textContent||"").trim();\n' +
'    for(var i=0;i<MAPA.length;i++){\n' +
'     if(MAPA[i][0].test(t)){\n' +
'      var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");\n' +
'      svg.setAttribute("viewBox","0 0 24 24"); svg.setAttribute("width","16"); svg.setAttribute("height","16");\n' +
'      svg.style.flex="0 0 auto";\n' +
'      svg.innerHTML=IC[MAPA[i][1]];\n' +
'      h.insertBefore(svg,h.firstChild);\n' +
'      break;\n' +
'     }\n' +
'    }\n' +
'    h.setAttribute("data-ova","1");\n' +
'   });\n' +
'  }\n' +
'  var pend=false;\n' +
'  if(window.MutationObserver){\n' +
'   new MutationObserver(function(){ if(pend) return; pend=true; requestAnimationFrame(function(){ pend=false; procesar(); }); }).observe(document.body,{childList:true,subtree:true});\n' +
'  }\n' +
'  procesar();\n' +
' }catch(e){}\n' +
'})();\n' +
'<' + '/script>\n' + MARCA_FIN;

document.getElementById('ir').addEventListener('click', function(){
  var btn=this, out=document.getElementById('out');
  btn.disabled=true; out.innerHTML='<p>Bajando nba.html…</p>';
  fetch('nba.html?v='+Date.now()).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status+' — ¿este archivo está en la misma carpeta que nba.html en el repo?');
    return r.text();
  }).then(function(html){
    if(html.indexOf(MARCA_INICIO)>-1){
      out.innerHTML='<p>Este parche ya estaba aplicado. No hice nada.</p>';
      btn.disabled=false;
      return;
    }
    var nuevo = html.replace('</body>', PARCHE + '\n</body>');
    var blob = new Blob([nuevo], {type:'text/html'});
    var url = URL.createObjectURL(blob);
    out.innerHTML = '<p>Listo. <a href="'+url+'" download="nba.html">Descarga el nba.html nuevo aquí</a> y súbelo al repo encima del viejo.</p>';
    btn.disabled=false;
  }).catch(function(e){
    out.innerHTML='<p style="color:#F87171">Error: '+e.message+'</p>';
    btn.disabled=false;
  });
});
</script>
</body>
</html>
