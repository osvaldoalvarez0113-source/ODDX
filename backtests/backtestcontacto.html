<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtest contacto</title>
<style>
  body{background:#0e0e0e;color:#eee;font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;line-height:1.4}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#aaa;font-size:13px;margin-bottom:14px}
  button{background:#c9a94b;color:#111;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;margin:0 8px 8px 0}
  button:disabled{opacity:.4}
  #log{font-size:13px;color:#bbb;margin:10px 0;min-height:20px}
  .card{background:#181818;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin:12px 0}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  td,th{padding:6px 4px;text-align:right;border-bottom:1px solid #262626}
  td:first-child,th:first-child{text-align:left}
  .ok{color:#6fd08c}.bad{color:#ff7a7a}
  .v{font-size:15px;font-weight:700;margin-top:8px}
</style>
</head>
<body>
<h1>Backtest contacto <span style="font-size:12px;color:#c9a94b">v1</span></h1>
<div class="sub">¿La calidad de contacto (xwOBA, hard-hit, suerte) predice el juego de hoy MÁS ALLÁ de lo que ya dicen las carreras por juego? Cada juego usa solo datos anteriores a su fecha.</div>

<button id="b25">Correr 2025</button>
<button id="b26">Correr 2026</button>
<button id="bclr" style="background:#333;color:#eee">Borrar guardado</button>
<div id="log"></div>
<div id="out"></div>
<div id="verd"></div>

<script>
(function(){
  var API='https://statsapi.mlb.com/api/v1';
  var SAV='https://baseballsavant.mlb.com/statcast_search/csv';
  var KEY='backtestcontacto_v1_';
  var logEl=document.getElementById('log'),outEl=document.getElementById('out'),verdEl=document.getElementById('verd');
  var running=false;
  var PREDS=[['xwoba','xwOBA (diferencia)'],['hh','Hard-hit % (diferencia)'],['luck','Suerte: xwOBA − wOBA']];

  function log(t){logEl.textContent=t;}
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  async function getText(url){
    for(var i=0;i<4;i++){
      try{
        var r=await fetch(url);
        if(!r.ok) throw new Error('HTTP '+r.status);
        return await r.text();
      }catch(e){
        if(i===3) throw e;
        await sleep(500*(i+1));
      }
    }
  }
  async function getJSON(url){return JSON.parse(await getText(url));}

  function addDays(iso,n){return new Date(new Date(iso+'T00:00:00Z').getTime()+n*86400000).toISOString().slice(0,10);}

  async function getGames(season){
    var a=season+'-03-15',b=season+'-09-30',out=[],s=a,k=0;
    while(s<=b){
      var e=addDays(s,13);if(e>b)e=b;
      k++;log('Calendario '+season+': tramo '+k);
      var d=await getJSON(API+'/schedule?sportId=1&gameType=R&startDate='+s+'&endDate='+e);
      (d.dates||[]).forEach(function(day){
        (day.games||[]).forEach(function(g){
          if(!g.status||g.status.abstractGameState!=='Final') return;
          var h=g.teams.home,aw=g.teams.away;
          if(h.score==null||aw.score==null||h.score===aw.score) return;
          out.push({pk:g.gamePk,date:day.date,hid:h.team.id,aid:aw.team.id,hs:h.score,as:aw.score});
        });
      });
      s=addDays(e,1);
    }
    var seen={};
    return out.filter(function(g){if(seen[g.pk])return false;seen[g.pk]=1;return true;});
  }

  function parseCSV(t){
    var rows=[],row=[],f='',q=false,i,c;
    for(i=0;i<t.length;i++){
      c=t[i];
      if(q){
        if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; }
        else f+=c;
      }else{
        if(c==='"') q=true;
        else if(c===','){row.push(f);f='';}
        else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
        else if(c!=='\r') f+=c;
      }
    }
    if(f.length||row.length){row.push(f);rows.push(row);}
    return rows;
  }

  async function getSnapshot(season,S){
    var url=SAV+'?all=true&hfGT=R%7C&hfSea='+season+'%7C&player_type=batter&game_date_gt='+season+'-03-15&game_date_lt='+S+'&group_by=team&min_pitches=0&min_results=0&min_pas=0';
    var rows=parseCSV(await getText(url));
    var h=rows[0],ix={};
    h.forEach(function(n,i){ix[n]=i;});
    ['player_id','pa','xwoba','woba','hardhit_percent'].forEach(function(n){if(ix[n]==null)throw new Error('falta columna '+n);});
    var map={};
    for(var i=1;i<rows.length;i++){
      var r=rows[i];if(r.length<h.length-2) continue;
      var id=parseInt(r[ix.player_id],10);
      var o={pa:parseFloat(r[ix.pa]),xw:parseFloat(r[ix.xwoba]),w:parseFloat(r[ix.woba]),hh:parseFloat(r[ix.hardhit_percent])};
      if(isNaN(id)||isNaN(o.xw)||isNaN(o.w)||isNaN(o.hh)) continue;
      map[id]=o;
    }
    return map;
  }

  function rgUpTo(games,S){
    var t={};
    games.forEach(function(g){
      if(g.date>S) return;
      var h=t[g.hid]||(t[g.hid]={r:0,n:0}),a=t[g.aid]||(t[g.aid]={r:0,n:0});
      h.r+=g.hs;h.n++;a.r+=g.as;a.n++;
    });
    return t;
  }

  function pearson(x,y){
    var n=x.length,sx=0,sy=0,i;
    for(i=0;i<n;i++){sx+=x[i];sy+=y[i];}
    var mx=sx/n,my=sy/n,sxy=0,sxx=0,syy=0;
    for(i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sxx+=(x[i]-mx)*(x[i]-mx);syy+=(y[i]-my)*(y[i]-my);}
    return sxy/Math.sqrt(sxx*syy);
  }

  function analyze(rows){
    var n=rows.length,rd=rows.map(function(r){return r.rd;});
    var rg=rows.map(function(r){return r.rg;});
    var rRG=pearson(rg,rd);
    var res={n:n,se:1/Math.sqrt(n),rg:rRG,preds:{}};
    PREDS.forEach(function(p){
      var x=rows.map(function(r){return r[p[0]];});
      var rx=pearson(x,rd),rxz=pearson(x,rg);
      var part=(rx-rxz*rRG)/Math.sqrt((1-rxz*rxz)*(1-rRG*rRG));
      res.preds[p[0]]={r:rx,part:part,corrRG:rxz};
    });
    return res;
  }

  function fmt(x,d){return x==null||isNaN(x)?'–':x.toFixed(d);}

  function render(){
    var html='',res={};
    [2025,2026].forEach(function(s){
      var raw=null;try{raw=localStorage.getItem(KEY+s);}catch(e){}
      if(!raw) return;
      var a=JSON.parse(raw);res[s]=a;
      var t2=2*a.se;
      html+='<div class="card"><b>'+s+'</b> · '+a.n+' juegos medidos · ruido ±'+fmt(t2,3)
        +'<table><tr><th>Señal</th><th>r cruda</th><th>r sin R/G</th></tr>'
        +'<tr><td>R/G (control)</td><td>'+fmt(a.rg,3)+'</td><td>–</td></tr>';
      PREDS.forEach(function(p){
        var q=a.preds[p[0]],ok=Math.abs(q.part)>=t2;
        html+='<tr><td>'+p[1]+'</td><td>'+fmt(q.r,3)+'</td><td class="'+(ok?'ok':'bad')+'"><b>'+fmt(q.part,3)+'</b></td></tr>';
      });
      html+='</table></div>';
    });
    outEl.innerHTML=html;
    var v='';
    if(res[2025]&&res[2026]){
      PREDS.forEach(function(p){
        var a=res[2025].preds[p[0]].part,b=res[2026].preds[p[0]].part;
        var same=(a>0)===(b>0),both=Math.abs(a)>=2*res[2025].se&&Math.abs(b)>=2*res[2026].se;
        v+='<div class="v '+(same&&both?'ok':'bad')+'">'+p[1]+': '+(same&&both?'se repite, vale probarlo en la fórmula':'no se repite, descartado')+'</div>';
      });
      v+='<div class="sub" style="margin-top:8px">"r sin R/G" es lo que aporta la señal después de quitarle lo que ya dicen las carreras por juego. Solo cuenta si pasa el ruido en las dos temporadas y con el mismo signo.</div>';
    }else v='<div class="sub">Corre las dos temporadas para el veredicto.</div>';
    verdEl.innerHTML=v;
  }

  async function run(season){
    if(running) return;
    running=true;
    document.getElementById('b25').disabled=true;document.getElementById('b26').disabled=true;
    try{
      var games=await getGames(season);
      log('Juegos finales: '+games.length+'. Bajando cortes de Savant…');
      var snaps=[],S=season+'-04-22',last=season+'-09-28';
      while(S<=last){snaps.push(S);S=addDays(S,7);}
      var data=[];
      for(var i=0;i<snaps.length;i++){
        log('Savant '+season+': corte '+(i+1)+'/'+snaps.length+' ('+snaps[i]+')');
        var m=await getSnapshot(season,snaps[i]);
        data.push({S:snaps[i],sav:m,rg:rgUpTo(games,snaps[i])});
        await sleep(300);
      }
      var rows=[];
      games.forEach(function(g){
        var snap=null;
        for(var i=data.length-1;i>=0;i--){if(data[i].S<g.date){snap=data[i];break;}}
        if(!snap) return;
        var h=snap.sav[g.hid],a=snap.sav[g.aid],rh=snap.rg[g.hid],ra=snap.rg[g.aid];
        if(!h||!a||!rh||!ra) return;
        if(h.pa<400||a.pa<400||rh.n<15||ra.n<15) return;
        rows.push({
          rd:g.hs-g.as,
          rg:rh.r/rh.n-ra.r/ra.n,
          xwoba:h.xw-a.xw,
          hh:h.hh-a.hh,
          luck:(h.xw-h.w)-(a.xw-a.w)
        });
      });
      if(rows.length<200) throw new Error('muy pocos juegos utilizables ('+rows.length+')');
      var res=analyze(rows);
      try{localStorage.setItem(KEY+season,JSON.stringify(res));}catch(e){}
      log('Listo '+season+': '+rows.length+' juegos medidos.');
      render();
    }catch(e){log('Falló: '+e.message);}
    running=false;
    document.getElementById('b25').disabled=false;document.getElementById('b26').disabled=false;
  }

  document.getElementById('b25').onclick=function(){run(2025);};
  document.getElementById('b26').onclick=function(){run(2026);};
  document.getElementById('bclr').onclick=function(){
    try{localStorage.removeItem(KEY+2025);localStorage.removeItem(KEY+2026);}catch(e){}
    render();log('Borrado.');
  };
  render();
})();
</script>
</body>
</html>
