<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtest bases</title>
<style>
  body{background:#0e0e0e;color:#eee;font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;line-height:1.4}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#aaa;font-size:13px;margin-bottom:14px}
  button{background:#c9a94b;color:#111;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;margin:0 8px 8px 0}
  button:disabled{opacity:.4}
  #log{font-size:13px;color:#bbb;margin:10px 0;min-height:20px}
  .card{background:#181818;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  td,th{padding:6px 4px;text-align:right;border-bottom:1px solid #262626}
  td:first-child,th:first-child{text-align:left}
  .ok{color:#6fd08c}.bad{color:#ff7a7a}.mid{color:#e6c35c}
  .v{font-size:15px;font-weight:700;margin-top:8px}
</style>
</head>
<body>
<h1>Backtest bases <span style="font-size:12px;color:#c9a94b">v1</span></h1>
<div class="sub">Tres señales, cada una medida por separado contra las carreras por juego: OBP (llegar a base), robos netos (éxitos menos el costo de los atrapados) y carreras por corredor (cuántos de los que llegan se anotan). Cada juego usa solo datos anteriores a su fecha.</div>

<button id="b25">Bajar 2025</button>
<button id="b26">Bajar 2026</button>
<button id="bclr" style="background:#333;color:#eee">Borrar guardado</button>
<div id="log"></div>
<div id="out"></div>
<div id="verd"></div>

<script>
(function(){
  var API='https://statsapi.mlb.com/api/v1';
  var KEY='backtestbases_v1_';
  var PTS_PER_RUN=6;
  var SIGS=[
    {name:'OBP (llegar a base)',idx:2},
    {name:'Robos netos',idx:3},
    {name:'Carreras por corredor',idx:4}
  ];
  var logEl=document.getElementById('log'),outEl=document.getElementById('out'),verdEl=document.getElementById('verd');
  var running=false;

  function log(t){logEl.textContent=t;}
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  async function getJSON(url){
    for(var i=0;i<4;i++){
      try{var r=await fetch(url);if(!r.ok) throw new Error('HTTP '+r.status);return await r.json();}
      catch(e){if(i===3) throw e;await sleep(500*(i+1));}
    }
  }
  function addDays(iso,n){return new Date(new Date(iso+'T00:00:00Z').getTime()+n*86400000).toISOString().slice(0,10);}

  async function getGames(season){
    var a=season+'-03-15',b=season+'-09-30',out=[],s=a,k=0;
    while(s<=b){
      var e=addDays(s,13);if(e>b)e=b;
      k++;log('Calendario '+season+': tramo '+k);
      var d=await getJSON(API+'/schedule?sportId=1&gameType=R&startDate='+s+'&endDate='+e);
      (d.dates||[]).forEach(function(day){
        (day.games||[]).forEach(function(g){
          if(!g.status||g.status.abstractGameState!=='Final') return;
          var h=g.teams.home,aw=g.teams.away;
          if(h.score==null||aw.score==null||h.score===aw.score) return;
          out.push({pk:g.gamePk,date:day.date,hid:h.team.id,aid:aw.team.id,hs:h.score,as:aw.score});
        });
      });
      s=addDays(e,1);
    }
    var seen={};
    return out.filter(function(g){if(seen[g.pk])return false;seen[g.pk]=1;return true;});
  }

  // bateo acumulado por equipo hasta S: OBP, robos netos (carreras) y carreras por corredor
  async function getBatSnap(season,S){
    var url=API+'/teams/stats?stats=byDateRange&startDate='+season+'-03-15&endDate='+S+
            '&group=hitting&season='+season+'&sportIds=1&gameType=R';
    var d=await getJSON(url);
    var sp=(d.stats&&d.stats[0]&&d.stats[0].splits)||[],map={};
    sp.forEach(function(s){
      if(!s.team||s.team.id==null) return;
      var st=s.stat||{};
      var h=+(st.hits||0),bb=+(st.baseOnBalls||0),hbp=+(st.hitByPitch||0),r=+(st.runs||0);
      var sb=+(st.stolenBases||0),cs=+(st.caughtStealing||0);
      var obp=parseFloat(st.obp);
      var corr=h+bb+hbp;
      if(!isFinite(obp)||corr<=0) return;
      map[s.team.id]={obp:obp,robosRuns:sb*0.2-cs*0.4,rpc:r/corr};
    });
    return map;
  }

  function rgUpTo(games,S){
    var t={};
    games.forEach(function(g){
      if(g.date>S) return;
      var h=t[g.hid]||(t[g.hid]={r:0,n:0}),a=t[g.aid]||(t[g.aid]={r:0,n:0});
      h.r+=g.hs;h.n++;a.r+=g.as;a.n++;
    });
    return t;
  }

  // ---------- estadística ----------
  function solve(A,b){
    var n=b.length,i,j,k;
    var M=A.map(function(r,i){return r.concat([b[i]]);});
    for(i=0;i<n;i++){
      var p=i;
      for(j=i+1;j<n;j++) if(Math.abs(M[j][i])>Math.abs(M[p][i])) p=j;
      var tmp=M[i];M[i]=M[p];M[p]=tmp;
      for(j=i+1;j<n;j++){
        var f=M[j][i]/M[i][i];
        for(k=i;k<=n;k++) M[j][k]-=f*M[i][k];
      }
    }
    var x=new Array(n);
    for(i=n-1;i>=0;i--){
      var s=M[i][n];
      for(j=i+1;j<n;j++) s-=M[i][j]*x[j];
      x[i]=s/M[i][i];
    }
    return x;
  }
  function fit(X,y){
    var k=X[0].length,A=[],b=[],i,j,r;
    for(i=0;i<k;i++){A.push(new Array(k).fill(0));b.push(0);}
    for(r=0;r<X.length;r++){
      for(i=0;i<k;i++){
        b[i]+=X[r][i]*y[r];
        for(j=0;j<k;j++) A[i][j]+=X[r][i]*X[r][j];
      }
    }
    return solve(A,b);
  }
  function dot(a,b){var s=0;for(var i=0;i<a.length;i++)s+=a[i]*b[i];return s;}
  // fila: [rd, rg, obp, robos, rpc]
  function mkA(rows){return rows.map(function(r){return [1,r[1]];});}
  function mkB(rows,idx){return rows.map(function(r){return [1,r[1],r[idx]];});}
  function crossfit(train,test){
    var y=train.map(function(r){return r[0];});
    var bA=fit(mkA(train),y),XA=mkA(test);
    var eA=test.map(function(r,i){return r[0]-dot(bA,XA[i]);});
    var sa=0,i;
    for(i=0;i<eA.length;i++) sa+=eA[i]*eA[i];
    return SIGS.map(function(sg){
      var bB=fit(mkB(train,sg.idx),y),XB=mkB(test,sg.idx),d=[],sb=0;
      for(i=0;i<test.length;i++){
        var eb=test[i][0]-dot(bB,XB[i]);
        d.push(eA[i]*eA[i]-eb*eb);sb+=eb*eb;
      }
      var n=d.length,m=0;
      for(i=0;i<n;i++)m+=d[i];m/=n;
      var v=0;for(i=0;i<n;i++)v+=(d[i]-m)*(d[i]-m);
      return {b:bB[2],impr:(sa-sb)/sa,t:m/(Math.sqrt(v/(n-1))/Math.sqrt(n))};
    });
  }
  function sdOf(a){var m=0,i;for(i=0;i<a.length;i++)m+=a[i];m/=a.length;var v=0;for(i=0;i<a.length;i++)v+=(a[i]-m)*(a[i]-m);return Math.sqrt(v/(a.length-1));}

  function fmt(x,d){return x==null||isNaN(x)?'–':x.toFixed(d);}
  function load(s){try{var r=localStorage.getItem(KEY+s);return r?JSON.parse(r):null;}catch(e){return null;}}

  function render(){
    var R={2025:load(2025),2026:load(2026)},html='',v='';
    [2025,2026].forEach(function(s){
      if(!R[s]) return;
      html+='<div class="card"><b>'+s+'</b> · '+R[s].length+' juegos guardados</div>';
    });
    if(R[2025]&&R[2026]){
      var pairs=[[2025,2026],[2026,2025]],res=[];
      pairs.forEach(function(p){
        var c=crossfit(R[p[0]],R[p[1]]);res.push(c);
        html+='<div class="card"><b>Ajustar '+p[0]+' → medir '+p[1]+'</b> · '+R[p[1]].length+' juegos'
          +'<table><tr><th>Señal</th><th>Mejora vs solo R/G</th><th>t</th></tr>';
        c.forEach(function(x,k){
          var ok=x.impr>0&&x.t>=2,mid=x.impr>0&&x.t>=1.3&&x.t<2,cl=ok?'ok':(mid?'mid':'bad');
          html+='<tr><td>'+SIGS[k].name+'</td><td class="'+cl+'"><b>'+fmt(x.impr*100,2)+'%</b></td><td class="'+cl+'">'+fmt(x.t,2)+'</td></tr>';
        });
        html+='</table></div>';
      });
      var all=R[2025].concat(R[2026]);
      html+='<div class="card"><b>Tamaño real de cada señal</b><table><tr><th>Señal</th><th>1 desviación mueve</th></tr>';
      SIGS.forEach(function(sg,k){
        var sd=sdOf(all.map(function(r){return r[sg.idx];}));
        var avg=(res[0][k].b+res[1][k].b)/2,runs=Math.abs(avg)*sd,pts=runs*PTS_PER_RUN;
        html+='<tr><td>'+sg.name+'</td><td>'+fmt(runs,2)+' carreras · '+fmt(pts,1)+' pts</td></tr>';
      });
      html+='</table><div class="sub" style="margin-top:6px">Puntos en la escala de OVA (6 por carrera), con el peso promedio de las dos temporadas.</div></div>';
      SIGS.forEach(function(sg,k){
        var a=res[0][k],b=res[1][k];
        var sameSign=(a.b>0)===(b.b>0);
        var both=a.impr>0&&b.impr>0;
        var strong=both&&a.t>=2&&b.t>=2&&sameSign;
        var mid=both&&sameSign&&!strong;
        v+='<div class="v '+(strong?'ok':(mid?'mid':'bad'))+'">'+sg.name+': '+
          (strong?'pasa en las dos direcciones. Falta ver que pese al menos 1 punto.':(mid?'mejora en las dos pero sin confianza firme. Dudosa.':'no aguanta la prueba cruzada: descartada.'))+'</div>';
      });
    }else v='<div class="sub">Baja las dos temporadas para la prueba cruzada.</div>';
    outEl.innerHTML=html;verdEl.innerHTML=v;
  }

  async function run(season){
    if(running) return;
    running=true;
    document.getElementById('b25').disabled=true;document.getElementById('b26').disabled=true;
    try{
      var games=await getGames(season);
      log('Juegos finales: '+games.length+'. Bajando cortes semanales…');
      var snaps=[],S=season+'-04-22',last=season+'-09-28';
      while(S<=last){snaps.push(S);S=addDays(S,7);}
      var data=[];
      for(var i=0;i<snaps.length;i++){
        log('Bateo '+season+': corte '+(i+1)+'/'+snaps.length+' ('+snaps[i]+')');
        data.push({S:snaps[i],bat:await getBatSnap(season,snaps[i]),rg:rgUpTo(games,snaps[i])});
        await sleep(250);
      }
      var rows=[];
      games.forEach(function(g){
        var snap=null;
        for(var i=data.length-1;i>=0;i--){if(data[i].S<g.date){snap=data[i];break;}}
        if(!snap) return;
        var bh=snap.bat[g.hid],ba=snap.bat[g.aid],rh=snap.rg[g.hid],ra=snap.rg[g.aid];
        if(!bh||!ba||!rh||!ra) return;
        if(rh.n<15||ra.n<15) return;
        rows.push([
          g.hs-g.as,
          +(rh.r/rh.n-ra.r/ra.n).toFixed(4),
          +(bh.obp-ba.obp).toFixed(5),
          +(bh.robosRuns/rh.n-ba.robosRuns/ra.n).toFixed(5),
          +(bh.rpc-ba.rpc).toFixed(5)
        ]);
      });
      if(rows.length<200) throw new Error('muy pocos juegos utilizables ('+rows.length+')');
      try{localStorage.setItem(KEY+season,JSON.stringify(rows));}catch(e){}
      log('Listo '+season+': '+rows.length+' juegos medidos.');
      render();
    }catch(e){log('Falló: '+e.message);}
    running=false;
    document.getElementById('b25').disabled=false;document.getElementById('b26').disabled=false;
  }

  document.getElementById('b25').onclick=function(){run(2025);};
  document.getElementById('b26').onclick=function(){run(2026);};
  document.getElementById('bclr').onclick=function(){
    try{localStorage.removeItem(KEY+2025);localStorage.removeItem(KEY+2026);}catch(e){}
    render();log('Borrado.');
  };
  render();
})();
</script>
</body>
</html>
