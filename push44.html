(function(root){

 bs[i].setAttribute('aria-pressed', bs[i].getAttribute('data-sk')===cur?'true':'false');\n }\n function apply(id){\n  var s=find(id), d=document.documentElement;\n  if(s.id==='noche') d.removeAttribute('data-skin');\n  else { d.setAttribute('data-skin',s.id); if(window.__ovaFont) window.__ovaFont(s.id); }\n  try{ localStorage.setItem('ova_skin',s.id); }catch(e){}\n  var c=s.bg; if(c.indexOf('#')!==0) c={neon:'#0E0B1F',campo:'#05130A',cristal:'#0A0C1C'}[s.id]||'#070B12';\n  meta().setAttribute('content',c);\n  marcar();\n }\n function mount(box){\n  if(!box) return;\n  var g=document.createElement('div'); g.className='ovaSkins';\n  var h='';\n  for(var i=0;i<SK.length;i++){\n   var s=SK[i];\n   h+='<button type=\"button\" class=\"ovaSk\" data-sk=\"'+s.id+'\" aria-pressed=\"false\">'+\n    '<span class=\"pv\" style=\"background:'+s.bg+'\"><i style=\"background:'+s.acc+'\"><\/i><i style=\"background:'+s.hot+'\"><\/i>'+\n    '<em style=\"background:'+s.card+';border:2px solid '+s.acc+'\"><\/em><\/span>'+\n    '<span class=\"tx\"><b>'+s.n+'<\/b><span>'+s.d+'<\/span><\/span><\/button>';\n  }\n  g.innerHTML=h;\n  g.addEventListener('click',function(e){\n   var b=e.target.closest?e.target.closest('.ovaSk'):null;\n   if(b) apply(b.getAttribute('data-sk'));\n  });\n  box.appendChild(g);\n  marcar();\n }\n window.OVASkins={list:SK,apply:apply,get:get,mount:mount,marcar:marcar};\n apply(get());\n})();\n\n<\/script>\n<script>\n/* OVA MLB · v44: arco de probabilidad, combo del mismo juego, selector de tema. */\n(function(){\n var VER='v44';\n function $q(s,r){ return (r||document).querySelector(s); }\n function $$(s,r){ return [].slice.call((r||document).querySelectorAll(s)); }\n function fmtAm(p){ return (typeof american==='function') ? american(p) : String(Math.round(p)); }\n\n /* ---------- 1. arco de probabilidad en el Veredicto ---------- */\n function arcHtml(pA,pH,fav){\n  var gap=1.2, la=Math.max(0.1,pA-gap), lh=Math.max(0.1,pH-gap);\n  var d='M 12 78 A 63 63 0 0 1 138 78';\n  return '<svg viewBox=\"0 0 150 86\" width=\"150\" height=\"86\" aria-hidden=\"true\">'+\n   '<path class=\"sg '+(fav==='a'?'fv':'ot')+'\" d=\"'+d+'\" pathLength=\"100\" data-len=\"'+la.toFixed(2)+'\" data-start=\"0.6\" '+\n     'style=\"stroke-dasharray:0 100;stroke-dashoffset:-0.6\"/>'+\n   '<path class=\"sg '+(fav==='h'?'fv':'ot')+'\" d=\"'+d+'\" pathLength=\"100\" data-len=\"'+lh.toFixed(2)+'\" data-start=\"'+(pA+0.6).toFixed(2)+'\" '+\n     'style=\"stroke-dasharray:0 100;stroke-dashoffset:-'+(pA+0.6).toFixed(2)+'\"/><\/svg>';\n }\n function animar(root){\n  var ps=$$('path.sg',root);\n  var go=function(){ ps.forEach(function(p){ p.style.strokeDasharray=p.getAttribute('data-len')+' 100'; }); };\n  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches){ go(); return; }\n  requestAnimationFrame(function(){ requestAnimationFrame(go); });\n }\n function hero(el){\n  var c=el._calc, d=el._d;\n  if(!c||!d||!d.a||!d.h) return;\n  var body=$q('.body',el), tab=body&&$q('.tab[data-t=\"v\"]',body);\n  if(!tab) return;\n  var old=$q('.ovaHero',tab); if(old) old.parentNode.removeChild(old);\n  var pA=+c.pA, pH=+c.pH, fav=pH>=pA?'h':'a';\n  var vc=+c.vc, gris=(typeof CORTE_GRIS==='number')?CORTE_GRIS:0.5;\n  var cap = vc<gris ? 'Muy parejo: ventaja de solo <b>'+vc.toFixed(2)+'<\/b> carreras'\n                    : '<b>'+(typeof esc==='function'?esc(c.gana):c.gana)+'<\/b> favorito · ventaja de <b>'+vc.toFixed(2)+'<\/b> carreras';\n  var side=function(id,ab,p,f){\n   return '<div class=\"side'+(f?' fav':'')+'\">'+(typeof escudo==='function'?escudo(id,46):'')+\n     '<span class=\"ab\">'+ab+'<\/span><span class=\"pc\">'+p.toFixed(1)+'%<\/span><\/div>';\n  };\n  var div=document.createElement('div');\n  div.className='ovaHero mlb';\n  div.innerHTML='<div class=\"row3\">'+side(d.a.team.id,c.nomA,pA,fav==='a')+\n   '<div class=\"gz\">'+arcHtml(pA,pH,fav)+'<div class=\"cx\"><small>cuota justa<\/small><b>'+fmtAm(Math.max(pA,pH))+'<\/b><\/div><\/div>'+\n   side(d.h.team.id,c.nomH,pH,fav==='h')+'<\/div><div class=\"cap\">'+cap+'<\/div>';\n  tab.insertBefore(div,tab.firstChild);\n  animar(div);\n }\n if(typeof pintar==='function'){\n  var _p=pintar;\n  pintar=function(el){ _p(el); try{ hero(el); }catch(e){} };\n }\n\n /* ---------- 2. combo del mismo juego (matematica pura, sin DOM) ---------- */\n var MAXX=25;\n function cellW(side,x,y){ /* x = carreras de la visita, y = del local; el empate se reparte 50/50 como hace la app */\n  if(side==='A') return x>y?1:(x===y?0.5:0);\n  return y>x?1:(x===y?0.5:0);\n }\n function legOk(leg,x,y){\n  if(leg.k==='tt'){ var r=leg.t==='A'?x:y; return leg.d==='o' ? r>leg.L : r<leg.L; }\n  if(leg.k==='tot'){ var t=x+y; return leg.d==='o' ? t>leg.L : t<leg.L; }\n  return true;\n }\n /* legs: [{k:'ml',s:'A'|'H'},{k:'tt',t:'A'|'H',d:'o'|'u',L},{k:'tot',d:'o'|'u',L}]\n    Con un ganador entre las patas, la probabilidad del ganador se ancla al numero CALIBRADO de la\n    app (pStar) y la parte de carreras sale de la distribucion condicionada a que ese equipo gane. */\n function joint(lamA,lamH,pStarA,legs){\n  var A=[],H=[],i,j;\n  for(i=0;i<=MAXX;i++){ A.push(pmf(i,lamA)); H.push(pmf(i,lamH)); }\n  var mass=0; for(i=0;i<=MAXX;i++) for(j=0;j<=MAXX;j++) mass+=A[i]*H[j];\n  var ml=null, others=[];\n  legs.forEach(function(l){ if(l.k==='ml') ml=l; else others.push(l); });\n  var w0=0, raw=0, marg=others.map(function(){ return 0; });\n  for(i=0;i<=MAXX;i++) for(j=0;j<=MAXX;j++){\n   var m=A[i]*H[j]/mass, s=ml?cellW(ml.s,i,j):1, ok=true;\n   for(var k=0;k<others.length;k++){ if(legOk(others[k],i,j)) marg[k]+=m; else ok=false; }\n   if(ml) w0+=m*s;\n   if(ok) raw+=m*s;\n  }\n  var pMl=null, out;\n  if(ml){\n   pMl = ml.s==='A' ? pStarA : 1-pStarA;\n   out = w0>0 ? pMl*(raw/w0) : 0;\n  } else out=raw;\n  var indep = ml?pMl:1; marg.forEach(function(v){ indep*=v; });\n  return {joint:out, indep:indep, pMl:pMl, marg:marg, w0:w0};\n }\n\n /* ---------- 3. pantalla Combo ---------- */\n var MK=[['','— sin usar —'],['ml','Ganador'],['ttA','Carreras de %A'],['ttH','Carreras de %H'],['tot','Total del juego']];\n function games(){ return $$('#slate .game'); }\n function names(g){ var e=g&&g._eq; return e?{a:e.a.ab,h:e.h.ab}:{a:'Visita',h:'Local'}; }\n function sideOpts(mk,n){\n  if(mk==='ml') return [['A',n.a+' gana'],['H',n.h+' gana']];\n  if(mk==='ttA'||mk==='ttH'||mk==='tot') return [['o','Más de (Over)'],['u','Menos de (Under)']];\n  return [];\n }\n function opt(v,t,sel){ return '<option value=\"'+v+'\"'+(sel?' selected':'')+'>'+t+'<\/option>'; }\n function legHtml(i){\n  return '<div class=\"leg\" data-i=\"'+i+'\"><div class=\"t\">Pata '+(i+1)+(i<2?'':' (opcional)')+'<\/div>'+\n   '<select class=\"cm\" aria-label=\"Mercado pata '+(i+1)+'\"><\/select>'+\n   '<select class=\"cs\" aria-label=\"Lado pata '+(i+1)+'\"><\/select>'+\n   '<input type=\"text\" inputmode=\"decimal\" class=\"cl\" placeholder=\"línea, ej. 3.5\" style=\"grid-column:1/-1;display:none\" aria-label=\"Línea pata '+(i+1)+'\"><\/div>';\n }\n function relabel(pane){\n  var g=games()[+$q('#cmb_juego',pane).value], n=names(g);\n  $$('.leg',pane).forEach(function(L,i){\n   var cm=$q('.cm',L), cur=cm.value||(i===0?'ml':(i===1?'ttA':''));\n   cm.innerHTML=MK.map(function(m){ return opt(m[0],m[1].replace('%A',n.a).replace('%H',n.h),m[0]===cur); }).join('');\n   sides(L,n);\n  });\n }\n function sides(L,n){\n  var mk=$q('.cm',L).value, cs=$q('.cs',L), cur=cs.value;\n  var os=sideOpts(mk,n);\n  cs.innerHTML=os.map(function(o,k){ return opt(o[0],o[1],o[0]===cur||(!cur&&k===0)); }).join('');\n  cs.style.display=os.length?'':'none';\n  $q('.cl',L).style.display=(mk==='ttA'||mk==='ttH'||mk==='tot')?'':'none';\n }\n function fmtP(p){ return (p*100).toFixed(1)+'%'; }\n function readGame(g){\n  var body=$q('.body',g), cmp=body&&$q('.row.cmp',body), tts=body?$$('.row[data-tt]',body):[];\n  if(!cmp||tts.length<2) return null;\n  return {pA:+cmp.dataset.pa, pH:+cmp.dataset.ph, na:cmp.dataset.na, nh:cmp.dataset.nh,\n          cap:cmp.dataset.cap==='1', lamA:+tts[0].dataset.tt, lamH:+tts[1].dataset.tt};\n }\n function legsFrom(pane,n){\n  var legs=[], names=[], err=null;\n  $$('.leg',pane).forEach(function(L){\n   var mk=$q('.cm',L).value; if(!mk) return;\n   var sd=$q('.cs',L).value, raw=($q('.cl',L).value||'').replace(',','.').trim(), lv=parseFloat(raw);\n   if(mk==='ml'){ legs.push({k:'ml',s:sd}); names.push((sd==='A'?n.a:n.h)+' gana'); return; }\n   if(!isFinite(lv)){ err='Falta la línea de una pata (por ejemplo 3.5).'; return; }\n   if(Math.abs(lv*2-Math.round(lv*2))>1e-9 || Math.abs(lv-Math.floor(lv)-0.5)>1e-9){ err='Usa líneas terminadas en .5 (como 3.5), que es como las pone Kalshi.'; return; }\n   var dtx=sd==='o'?'más de ':'menos de ';\n   if(mk==='tot'){ legs.push({k:'tot',d:sd,L:lv}); names.push('Total '+dtx+lv); }\n   else { var t=mk==='ttA'?'A':'H'; legs.push({k:'tt',t:t,d:sd,L:lv}); names.push((t==='A'?n.a:n.h)+' '+dtx+lv+' carreras'); }\n  });\n  var nml=legs.filter(function(l){ return l.k==='ml'; }).length;\n  if(!err&&legs.length<2) err='Escoge al menos 2 patas para armar el combo.';\n  if(!err&&nml>1) err='Solo puede haber un ganador por combo.';\n  return {legs:legs,names:names,err:err};\n }\n function amFromPay(stake,pay){\n  var b=pay/stake-1;\n  return b>=1 ? '+'+Math.round(b*100) : '-'+Math.round(100/b);\n }\n function resultado(pane,g,info,lg,box){\n  var r=joint(info.lamA,info.lamH,info.pA/100,lg.legs);\n  var stake=parseFloat(($q('#cmb_stake',pane).value||'').replace(',','.')), pay=parseFloat(($q('#cmb_pay',pane).value||'').replace(',','.'));\n  var p=r.joint, n=names(g);\n  var hasPay=isFinite(stake)&&stake>0&&isFinite(pay)&&pay>stake;\n  var be=hasPay?stake/pay:null, edge=null, ev=null, klass='';\n  if(hasPay){ edge=(p-be)*100; ev=p*(pay/stake)-1; klass=edge>0?'good':'bad'; }\n  var out='<div class=\"cmpg\"><div><b>'+fmtP(p)+'<\/b><span>Modelo, con las patas relacionadas<\/span><\/div>'+\n    '<div><b>'+fmtP(r.indep)+'<\/b><span>Multiplicando como si f age.getItem('ova_skin')||'noche'; }catch(e){ return 'noche'; } }\n function find(id){ for(var i=0;i<SK.length;i++) if(SK[i].id===id) return SK[i]; return SK[0]; }\n function marcar(){\n  var cur=get();\n  var bs=document.querySelectorAll('.ovaSk');\n  for(var i=0;i<bs.length;i++) bs[i].setAttribute('aria-pressed', bs[i].getAttribute('data-sk')===cur?'true':'false');\n }\n function apply(id){\n  var s=find(id), d=document.documentElement;\n  if(s.id==='noche') d.removeAttribute('data-skin');\n  else { d.setAttribute('data-skin',s.id); if(window.__ovaFont) window.__ovaFont(s.id); }\n  try{ localStorage.setItem('ova_skin',s.id); }catch(e){}\n  var c=s.bg; if(c.indexOf('#')!==0) c={neon:'#0E0B1F',campo:'#05130A',cristal:'#0A0C1C'}[s.id]||'#070B12';\n  meta().setAttribute('content',c);\n  marcar();\n }\n function mount(box){\n  if(!box) return;\n  var g=document.createElement('div'); g.className='ovaSkins';\n  var h='';\n  for(var i=0;i<SK.length;i++){\n   var s=SK[i];\n   h+='<button type=\"button\" class=\"ovaSk\" data-sk=\"'+s.id+'\" aria-pressed=\"false\">'+\n    '<span class=\"pv\" style=\"background:'+s.bg+'\"><i style=\"background:'+s.acc+'\"><\/i><i style=\"background:'+s.hot+'\"><\/i>'+\n    '<em style=\"background:'+s.card+';border:2px solid '+s.acc+'\"><\/em><\/span>'+\n    '<span class=\"tx\"><b>'+s.n+'<\/b><span>'+s.d+'<\/span><\/span><\/button>';\n  }\n  g.innerHTML=h;\n  g.addEventListener('click',function(e){\n   var b=e.target.closest?e.target.closest('.ovaSk'):null;\n   if(b) apply(b.getAttribute('data-sk'));\n  });\n  box.appendChild(g);\n  marcar();\n }\n window.OVASkins={list:SK,apply:apply,get:get,mount:mount,marcar:marcar};\n apply(get());\n})();\n\n<\/script>\n<script>\n/* OVA Fútbol · v8: anillo de probabilidad, doble oportunidad, selector de tema. */\n(function(){\n var VER='v8';\n function $q(s,r){ return (r||document).querySelector(s); }\n function pct(x){ return (x*100).toFixed(1)+'%'; }\n function am(p){\n  var v=(typeof cuotaJustaAmericana==='function')?cuotaJustaAmericana(p):null;\n  if(v===null||v===undefined) return '—';\n  return (v>0?'+':'')+v;\n }\n function escT(s){ return String(s==null?'':s).replace(/[<>&\"]/g,function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','\"':'&quot;'}[c]; }); }\n\n /* Probabilidades derivadas del 1X2 (sin constantes nuevas): doble oportunidad y empate no apuesta. */\n function derivadas(pL,pD,pV){\n  return {\n   x1:pL+pD, x2:pD+pV, x12:pL+pV,\n   dnbL: (pL+pV)>0?pL/(pL+pV):0, dnbV:(pL+pV)>0?pV/(pL+pV):0\n  };\n }\n function ring(pL,pD,pV){\n  var g=1.4, segs=[[pL,'fv',0],[pD,'dr',pL],[pV,'aw',pL+pD]], h='';\n  var d='M 50 8 A 42 42 0 1 1 49.99 8';\n  segs.forEach(function(s){\n   var len=Math.max(0.1,s[0]*100-g), st=s[2]*100+g/2;\n   h+='<path class=\"sg '+s[1]+'\" d=\"'+d+'\" pathLength=\"100\" data-len=\"'+len.toFixed(2)+'\" style=\"stroke-dasharray:0 100;stroke-dashoffset:-'+st.toFixed(2)+'\"/>';\n  });\n  return '<svg viewBox=\"0 0 100 100\" width=\"112\" height=\"112\" aria-hidden=\"true\">'+h+'<\/svg>';\n }\n function animar(root){\n  var ps=[].slice.call(root.querySelectorAll('path.sg'));\n  var go=function(){ ps.forEach(function(p){ p.style.strokeDasharray=p.getAttribute('data-len')+' 100'; }); };\n  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches){ go(); return; }\n  requestAnimationFrame(function(){ requestAnimationFrame(go); });\n }\n function heroFut(bodyEl,p,eL,eV){\n  var pane=$q('.pane',bodyEl); if(!pane||$q('.ovaHero',pane)) return;\n  var r=calcular(eL,eV);\n  var pL=r.pL, pD=r.pD, pV=r.pV;\n  var side=function(img,nom,x,fav){\n   return '<div class=\"side'+(fav?' fav':'')+'\"><img class=\"cr\" src=\"'+escT(img)+'\" alt=\"\" onerror=\"this.style.display=\\'none\\'\">'+\n     '<span class=\"ab\">'+escT(nom)+'<\/span><span class=\"pc\">'+pct(x)+'<\/span><\/div>';\n  };\n  var mx=Math.max(pL,pD,pV);\n  var hero=document.createElement('div'); hero.className='ovaHero fut';\n  hero.innerHTML='<div class=\"row3\">'+side(p.escudoLocal,p.local,pL,pL===mx)+\n   '<div class=\"gz\">'+ring(pL,pD,pV)+'<div class=\"cx\"><small>xG<\/small><b>'+r.lamL.toFixed(1)+'–'+r.lamV.toFixed(1)+'<\/b><\/div><\/div>'+\n   side(p.escudoVisita,p.visita,pV,pV===mx)+'<\/div>'+\n   '<div class=\"cap\">Empate <b>'+pct(pD)+'<\/b> · cuota justa del favorito <b>'+am(mx)+'<\/b><\/div>';\n  pane.insertBefore(hero,pane.firstChild);\n  animar(hero);\n\n  var d=derivadas(pL,pD,pV);\n  var row=function(t,x){ return '<div class=\"linea\"><span>'+t+'<\/span><b>'+pct(x)+' · '+am(x)+'<\/b><\/div>'; };\n  var box=document.createElement('div'); box.className='ovaDO';\n  box.innerHTML='<h3>Doble oportunidad y empate no apuesta<\/h3><div class=\"lineas\">'+\n   row(escT(p.local)+' o empate (1X)',d.x1)+row(escT(p.visita)+' o empate (X2)',d.x2)+\n   row(escT(p.local)+' o '+escT(p.visita)+' (12, sin empate)',d.x12)+\n   row('Empate no apuesta · '+escT(p.local),d.dnbL)+row('Empate no apuesta · '+escT(p.visita),d.dnbV)+'<\/div>'+\n   '<div class=\"nota\">Salen del mismo 1X2 de arriba (el mercado donde el modelo sí le ganó a la frecuencia de la liga), sin ninguna constante nueva. La cifra de la derecha es la cuota justa: solo hay valor si la casa paga <b>más<\/b>. En empate no apuesta, si empatan te devuelven el dinero.<\/div>';\n  var nota=pane.querySelector('.nota:last-child'); pane.appendChild(box);\n }\n if(typeof pintarGameBody==='function'){\n  var _pg=pintarGameBody;\n  pintarGameBody=function(bodyEl,p,eL,eV){ _pg(bodyEl,p,eL,eV); try{ heroFut(bodyEl,p,eL,eV); }catch(e){ if(window.console) console.error('ova hero',e); } };\n }\n\n function mountTema(){\n  var top=$q('header .top'); if(!top||$q('#ovaSkBtn')||!window.OVASkins) return;\n  var b=document.createElement('button'); b.id='ovaSkBtn'; b.className='btnChico'; b.setAttribute('aria-label','Cambiar tema'); b.textContent='🎨';\n  top.appendChild(b);\n  var sh=document.createElement('div'); sh.className='ovaSheet'; sh.id='ovaSheet';\n  sh.innerHTML='<div class=\"card\"><h2>Apariencia<\/h2><p>Toca un tema para verlo al instante. Se guarda y lo comparte la app de MLB.<\/p><\/div>';\n  document.body.appendChild(sh);\n  OVASkins.mount($q('.card',sh));\n  b.addEventListener('click',function(){ sh.classList.add('on'); OVASkins.marcar(); });\n  sh.addEventListener('click',function(e){ if(e.target===sh) sh.classList.remove('on'); });\n }\n function ver(){\n  try{ VERSION=VER; }catch(e){}\n  [].slice.call(document.querySelectorAll('.ver')).forEach(function(e){ e.textContent=VER; });\n }\n function init(){ try{ mountTema(); }catch(e){} ver(); }\n window.OVAFUT={derivadas:derivadas,init:init};\n if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();\n})();\n\n<\/script>"}, "hub": {"head": "<style id=\"ova-skins\">\n/* ===== OVA · temas v44 =====\n   El tema por defecto (Noche) NO lleva atributo data-skin y queda como antes, salvo\n   los retoques marcados 0 y 0b (un desborde real y tres textos con poco contraste).\n   Cada tema nuevo define TODOS sus colores como variables; las reglas de la seccion 1\n   solo se activan cuando hay data-skin. */\n:root{\n --x-chip:#04140C;\n --x-herobg:linear-gradient(180deg,var(--bg2),var(--bg1));\n --x-fixed:none;\n}\nhtml[data-app=fut] .forma span{color:var(--x-chip)}\nbody::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--x-fixed)}\n\n\n/* ---------- 0. arreglo de desborde horizontal (todos los temas, tambien Noche) ----------\n   El brillo de arriba de la tarjeta abierta medía 160% del ancho y se salia de la pantalla\n   (medido: la pagina pasaba de 390 a 485 px de ancho al abrir un juego). Ahora se queda adentro. */\nhtml[data-app=mlb] .game.open .body::before{left:0;width:100%;transform:none}\n\n\n/* ---------- 0b. legibilidad de Noche (tres textos que median bajo 4.5 en la auditoria) ---------- */\nhtml[data-app=mlb]:not([data-skin]) .tb.on{background:#2D6CDF}\nhtml[data-app=mlb]:not([data-skin]) .out.no{color:#7C92AA}\nhtml[da ;--x-onhead:#FFC27A;\n --x-fixed:radial-gradient(60% 40% at 12% 8%,rgba(142,150,255,.42),transparent 62%),radial-gradient(55% 38% at 92% 18%,rgba(255,110,190,.26),transparent 60%),radial-gradient(60% 42% at 50% 100%,rgba(45,212,191,.26),transparent 62%);\n}\nhtml[data-skin=cristal] .brand,html[data-skin=cristal] header h1{letter-spacing:2px;font-weight:800}\nhtml[data-skin=cristal] .match{font-weight:800}\nhtml[data-skin=cristal] .game,html[data-skin=cristal] .ajustes,html[data-skin=cristal] .pk,html[data-skin=cristal] .vacio,\nhtml[data-skin=cristal] .cuotasbox,html[data-skin=cristal] .ovaHero{border-color:rgba(255,255,255,.20)}\nhtml[data-skin=cristal] .game.open{border-color:rgba(183,188,255,.65)}\nhtml[data-skin=cristal] .navbar,html[data-skin=cristal] .tabbar,html[data-skin=cristal] .topbar,html[data-skin=cristal] header{\n -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}\nhtml[data-skin=cristal] .ovaHero{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}\nhtml[data-skin=cristal] .tb.on,html[data-skin=cristal] .diaBtn.on{box-shadow:0 6px 18px -6px rgba(142,150,255,.75)}\nhtml[data-skin=cristal] .ovaSheet .card{background:#141737;-webkit-backdrop-filter:none;backdrop-filter:none}\nhtml[data-skin=cristal] .ovaSk .tx{background:rgba(255,255,255,.08)}\nhtml[data-skin=cristal] .teq.on{color:#fff;border-color:var(--acc2)}\n\n/* ---------- ajustes finos de fútbol (3 columnas de KPI y encabezado de una sola línea) ---------- */\nhtml[data-app=fut][data-skin] header h1{letter-spacing:2px}\nhtml[data-app=fut][data-skin] .kpi b{font-size:19px}\nhtml[data-app=fut][data-skin] .marcadores b{font-size:15px}\n.ovaDO .linea{gap:10px}\n.ovaDO .linea b{white-space:nowrap}\n\n/* ---------- Hub (pantalla de inicio) ---------- */\nhtml[data-app=hub][data-skin] body{font-family:var(--body)}\nhtml[data-app=hub][data-skin] h1,html[data-app=hub][data-skin] .txt b{font-family:var(--cond)}\nhtml[data-app=hub][data-skin] .card{box-shadow:var(--x-shadow);-webkit-backdrop-filter:var(--x-blur);backdrop-filter:var(--x-blur)}\nhtml[data-app=hub][data-skin] .badge{background:var(--bg2)}\nhtml[data-app=hub] .ovaApar{padding-top:0}\n\n<\/style>\n<script>\n(function(){\n var d=document.documentElement;\n d.setAttribute('data-app','hub');\n var F={\n  oro:'family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700',\n  neon:'family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700',\n  dia:'family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700',\n  campo:'family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700',\n  cristal:'family=Manrope:wght@400;500;600;700;800'\n };\n window.__ovaFont=function(id){\n  if(!F[id]||document.getElementById('ovaFont-'+id)) return;\n  var l=document.createElement('link');\n  l.id='ovaFont-'+id; l.rel='stylesheet';\n  l.href='https://fonts.googleapis.com/css2?'+F[id]+'&display=swap';\n  document.head.appendChild(l);\n };\n try{\n  var s=localStorage.getItem('ova_skin');\n  if(s&&F[s]){ d.setAttribute('data-skin',s); window.__ovaFont(s); }\n }catch(e){}\n})();\n\n<\/script>", "body": "<script>\n/* OVA · administrador de temas (v44). Se guarda en localStorage 'ova_skin' y lo comparten\n   las paginas del mismo sitio (MLB, futbol). Noche = sin atributo = como siempre. */\n(function(){\n if(window.OVASkins) return;\n var SK=[\n  {id:'noche',n:'Noche de estadio',d:'Azul medianoche y ámbar',bg:'#070B12',card:'#0D1420',acc:'#3B82F6',hot:'#FBBF24'},\n  {id:'oro',n:'Oro negro',d:'Negro cálido, dorado, serif',bg:'#0A0908',card:'#1B1812',acc:'#C9A24A',hot:'#F0CE6B'},\n  {id:'neon',n:'Neón',d:'Cian y magenta sobre violeta',bg:'linear-gradient(135deg,#0E0B1F,#1F1A44)',card:'#161231',acc:'#19E3FF',hot:'#FF4FD0'},\n  {id:'dia',n:'Día de juego',d:'Claro, se lee con sol',bg:'#EAF0F7',card:'#FFFFFF',acc:'#1D4ED8',hot:'#B45309'},\n  {id:'campo',n:'Campo',d:'Verde césped y tiza',bg:'linear-gradient(135deg,#05130A,#10301D)',card:'#10301D',acc:'#3DDC84',hot:'#F2EA6B'},\n  {id:'cristal',n:'Cristal',d:'Vidrio esmerilado, aurora',bg:'linear-gradient(135deg,#3B3F9E,#0A0C1C 55%,#0F6F66)',card:'rgba(255,255,255,.18)',acc:'#8E96FF',hot:'#FFC27A'}\n ];\n function meta(){\n  var m=document.querySelector('meta[name=theme-color]');\n  if(!m){ m=document.createElement('meta'); m.name='theme-color'; document.head.appendChild(m); }\n  return m;\n }\n function get(){ try{ return localStorage.getItem('ova_skin')||'noche'; }catch(e){ return 'noche'; } }\n function find(id){ for(var i=0;i<SK.length;i++) if(SK[i].id===id) return SK[i]; return SK[0]; }\n function marcar(){\n  var cur=get();\n  var bs=document.querySelectorAll('.ovaSk');\n  for(var i=0;i<bs.length;i++) bs[i].setAttribute('aria-pressed', bs[i].getAttribute('data-sk')===cur?'true':'false');\n }\n function apply(id){\n  var s=find(id), d=document.documentElement;\n  if(s.id==='noche') d.removeAttribute('data-skin');\n  else { d.setAttribute('data-skin',s.id); if(window.__ovaFont) window.__ovaFont(s.id); }\n  try{ localStorage.setItem('ova_skin',s.id); }catch(e){}\n  var c=s.bg; if(c.indexOf('#')!==0) c={neon:'#0E0B1F',campo:'#05130A',cristal:'#0A0C1C'}[s.id]||'#070B12';\n  meta().setAttribute('content',c);\n  marcar();\n }\n function mount(box){\n  if(!box) return;\n  var g=document.createElement('div'); g.className='ovaSkins';\n  var h='';\n  for(var i=0;i<SK.length;i++){\n   var s=SK[i];\n   h+='<button type=\"button\" class=\"ovaSk\" data-sk=\"'+s.id+'\" aria-pressed=\"false\">'+\n    '<span class=\"pv\" style=\"background:'+s.bg+'\"><i style=\"background:'+s.acc+'\"><\/i><i style=\"background:'+s.hot+'\"><\/i>'+\n    '<em style=\"background:'+s.card+';border:2px solid '+s.acc+'\"><\/em><\/span>'+\n    '<span class=\"tx\"><b>'+s.n+'<\/b><span>'+s.d+'<\/span><\/span><\/button>';\n  }\n  g.innerHTML=h;\n  g.addEventListener('click',function(e){\n   var b=e.target.closest?e.target.closest('.ovaSk'):null;\n   if(b) apply(b.getAttribute('data-sk'));\n  });\n  box.appendChild(g);\n  marcar();\n }\n window.OVASkins={list:SK,apply:apply,get:get,mount:mount,marcar:marcar};\n apply(get());\n})();\n\n<\/script>\n<script>\n/* OVA Hub · temas v44 */\n(function(){\n function init(){\n  var g=document.querySelector('.grid'); if(!g||document.querySelector('.ovaApar')||!window.OVASkins) return;\n  var box=document.createElement('div'); box.className='ovaApar';\n  box.style.cssText='width:100%;max-width:420px;margin-top:30px';\n  box.innerHTML='<h2>Apariencia<\/h2><p>Toca un tema para verlo al instante. Vale para MLB y fútbol también.<\/p>';\n  g.parentNode.insertBefore(box,g.nextSibling);\n  OVASkins.mount(box);\n }\n if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();\n})();\n\n<\/script>"}};
var $=function(i){return document.getElementById(i);};
var LOG=$('log');
function say(t,c){ var s=document.createElement('span'); if(c) s.className=c; s.textContent=t+'\n'; LOG.appendChild(s); }
function limpiar(){ LOG.textContent=''; }
try{ var t0=localStorage.getItem('ova_gh_token'); if(t0) $('tok').value=t0; }catch(e){}
function b64dec(b64){ var bin=atob(b64.replace(/\s/g,'')), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder('utf-8').decode(u); }
function b64enc(str){ var u=new TextEncoder().encode(str), s='', N=0x8000; for(var i=0;i<u.length;i+=N) s+=String.fromCharCode.apply(null,u.subarray(i,i+N)); return btoa(s); }
function gh(path,opt){
  opt=opt||{}; var h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+$('tok').value.trim()};
  if(opt.body) h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+$('repo').value.trim()+'/contents/'+path+(opt.q||''),{method:opt.method||'GET',headers:h,body:opt.body,cache:'no-store'}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok) throw new Error('GitHub dijo '+r.status+(j&&j.message?' — '+j.message:'')); return j; });
  });
}
function bajar(path){ return gh(path,{q:'?t='+Date.now()}).then(function(j){ if(!j.content) throw new Error(path+': GitHub no devolvió el contenido (¿archivo muy grande?)'); return {sha:j.sha,texto:b64dec(j.content)}; }); }
var JOBS=[
 {id:'fmlb',app:'mlb',marca:['function detalle(','function pintar(','function actualizarRanking('],nombre:'MLB'},
 {id:'ffut',app:'fut',marca:['function calcular(','function pintarGameBody(','function cargarLiga('],nombre:'Fútbol'},
 {id:'fhub',app:'hub',marca:['¿Qué deporte hoy?','href="futbol.html"'],nombre:'Inicio (hub)'}
];
function preparar(job){
  var path=$(job.id).value.trim();
  say('· '+job.nombre+' ('+path+'): bajando…');
  return bajar(path).then(function(f){
    job.path=path; job.sha=f.sha; job.orig=f.texto;
    var falta=job.marca.filter(function(m){ return f.texto.indexOf(m)<0; });
    if(falta.length) throw new Error(path+' no parece el archivo de '+job.nombre+' (le falta '+falta[0]+'). No toqué nada.');
    job.nuevo=OVAPatch.aplicar(f.texto,PACKS[job.app]);
    var p=OVAPatch.verificar(job.nuevo,job.marca);
    if(p.length) throw new Error(job.nombre+': la revisión falló → '+p.join(' | '));
    if(job.nuevo.length<=f.texto.length) throw new Error(job.nombre+': el resultado no creció; algo raro.');
    say('  ✓ '+job.nombre+' revisado: '+f.texto.length.toLocaleString()+' → '+job.nuevo.length.toLocaleString()+' caracteres, todos los scripts compilan','ok');
  });
}
function subir(job,texto,msg){
  return gh(job.path,{method:'PUT',body:JSON.stringify({message:msg,content:b64enc(texto),sha:job.sha})}).then(function(r){ job.sha=r.content&&r.content.sha; });
}
$('go').onclick=function(){
  var b=$('go'); if(!$('tok').value.trim()){ limpiar(); say('Falta el token.','mal'); return; }
  try{ localStorage.setItem('ova_gh_token',$('tok').value.trim()); }catch(e){}
  b.disabled=true; limpiar(); say('Paso 1 de 2: bajar y revisar (todavía no se sube nada)');
  var MSG={mlb:'v44: temas, arco de probabilidad y combo del mismo juego (MLB)',fut:'v8: temas, anillo de probabilidad y doble oportunidad (fútbol)',hub:'Temas en el inicio (hub)'};
  var cad=Promise.resolve();
  JOBS.forEach(function(j){ cad=cad.then(function(){ return preparar(j); }); });
  cad.then(function(){
    say('\nPaso 2 de 2: todo salió bien, subiendo…');
    try{ JOBS.forEach(function(j){ localStorage.setItem('ova_bak_'+j.id,j.orig); }); }catch(e){ say('  (no pude guardar la copia de respaldo en el teléfono; GitHub igual guarda el historial)','av'); }
    var up=Promise.resolve();
    JOBS.forEach(function(j){ up=up.then(function(){ return subir(j,j.nuevo,MSG[j.app]); }).then(function(){ say('  ✓ '+j.path+' subido','ok'); }); });
    return up;
  }).then(function(){
    say('\n✔ Listo. Espera 1 o 2 minutos a que GitHub Pages lo publique y abre:\n  …/ODDX/'+JOBS[2].path+'  (el inicio)\n  …/ODDX/'+JOBS[0].path+'?v=44\n  …/ODDX/'+JOBS[1].path+'?v=8\nEl tema se cambia en Ajustes → Apariencia (MLB) o con el botón 🎨 (fútbol).','ok');
  }).catch(function(e){ say('\n✗ '+e.message,'mal'); say('No se subió nada que estuviera mal.','av'); }).then(function(){ b.disabled=false; });
};
$('undo').onclick=function(){
  var b=$('undo'); b.disabled=true; limpiar(); say('Volviendo a la versión anterior…');
  var hechos=JOBS.map(function(j){ return {j:j,bak:(function(){ try{ return localStorage.getItem('ova_bak_'+j.id); }catch(e){ return null; } })()}; });
  if(hechos.some(function(h){ return !h.bak; })){ say('No tengo la copia guardada en este teléfono. Usa el historial de GitHub (Commits → Revert).','mal'); b.disabled=false; return; }
  var chain=Promise.resolve();
  hechos.forEach(function(h){ chain=chain.then(function(){ h.j.path=$(h.j.id).value.trim(); return gh(h.j.path,{q:'?t='+Date.now()}).then(function(f){ h.j.sha=f.sha; return subir(h.j,h.bak,'Volver a la versión anterior al parche v44'); }).then(function(){ say('  ✓ '+h.j.path+' restaurado','ok'); }); }); });
  chain.then(function(){ say('\n✔ Restaurado.','ok'); }).catch(function(e){ say('✗ '+e.message,'mal'); }).then(function(){ b.disabled=false; });
};
