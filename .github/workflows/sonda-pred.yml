name: Sonda mercado de prediccion

# Mira la forma real de los datos de Polymarket (publicos, sin llave) y deja una muestra en la rama "resultados-pred".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sonda_pred.js
      - .github/workflows/sonda-pred.yml

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sondear
        run: node scripts/sonda_pred.js
      - name: Guardar muestra
        if: always()
        continue-on-error: true
        run: |
          [ -d salida_pred ] || exit 0
          cd salida_pred && git init -q -b resultados-pred && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add -A && git commit -q -m "sonda pred" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resultados-pred
