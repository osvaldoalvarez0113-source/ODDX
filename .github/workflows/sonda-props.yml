name: Sonda props de ESPN (solo mira)
on:
  push:
    branches: [sonda-props]
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/auditoria/sonda_props.js
