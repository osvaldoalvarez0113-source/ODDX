name: Selecciones y copas nacionales

# Arma hist-selecciones.json (4 años de partidos de selecciones en todos los torneos de ESPN + próximos 21 días),
# fuerza-nacional.json y hist-nac-*.json (copas nacionales con la fuerza de 1.ª, 2.ª y copas juntas).
# Lo lee la app de fútbol (torneos.js y selecciones.js). Gratis: solo ESPN.
on:
  workflow_dispatch:
    inputs:
      completo:
        description: "Bajar los 4 años completos de selecciones otra vez (1 = sí)"
        required: false
        default: "0"
  schedule:
    - cron: "23 4,10,16,22 * * *"
  push:
    branches: [main]
    paths:
      - scripts/torneos_datos.js
      - .github/workflows/torneos.yml

permissions:
  contents: write

concurrency:
  group: torneos
  cancel-in-progress: false

jobs:
  torneos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bajar partidos, ajustar y medir
        env:
          TORNEOS_COMPLETO: ${{ github.event.inputs.completo }}
        run: node scripts/torneos_datos.js
      - name: Guardar en la app
        run: |
          git config user.name "escaner-ova"
          git config user.email "escaner-ova@users.noreply.github.com"
          git add hist-selecciones.json fuerza-nacional.json hist-nac-*.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "torneos: selecciones y copas $(date -u +%F)"
          git pull --rebase -q
          git push -q origin HEAD
