name: Experimento NBA (solo ganador)

on:
  workflow_dispatch:
  push:
    branches: [experimento-nba-ganador]

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr el experimento
        run: node scripts/experimento_nba_ganador.js 2>&1 | tee salida_nba_ganador.txt
      - name: Guardar el resultado en la rama resultados-nba-ganador
        if: always()
        run: |
          mkdir -p /tmp/res
          cp -f salida_nba_ganador.txt resultado_nba_ganador.txt resultado_nba_ganador.json /tmp/res/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan resultados-nba-ganador
          git rm -rf . >/dev/null 2>&1 || true
          cp -f /tmp/res/* . 2>/dev/null || true
          git add -A
          git commit -m "Resultado del experimento NBA (ausencias)" || true
          git push -f origin resultados-nba-ganador
