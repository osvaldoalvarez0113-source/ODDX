name: Medir mejoras (clima MLB, ritmo NBA, árbitros)

# Solo mide (scripts/medicion/mejoras_nov.js): MLB viento y temperatura con las líneas de cierre 2023-2026, ritmo de la NBA y
# árbitros de NBA y NHL. Guarda lo bajado de ESPN en la rama datos-resumenes y el informe en resultados-mejoras. No toca la app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/medicion/mejoras_nov.js"
      - ".github/workflows/medir-mejoras.yml"

permissions:
  contents: write

concurrency:
  group: medir-mejoras
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Traer datos
        run: |
          traer() { git fetch -q --depth 1 origin "$1" && git show "FETCH_HEAD:$2" > "$2" && echo "ok $2" || echo "FALTA $2"; }
          traer cierres cierres-mlb.json
          traer resultados-nba-6t filas_nba.json
          traer datos-nhl-nfl datos-nhl.json
          traer datos-resumenes resumenes.json || true
      - name: Medir
        run: node scripts/medicion/mejoras_nov.js 2>&1 | tee salida_mejoras.txt
      - name: Guardar lo bajado (datos-resumenes) y el informe (resultados-mejoras)
        if: always()
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if [ -s resumenes.json ]; then mkdir -p /tmp/rs && cp resumenes.json /tmp/rs/ && cd /tmp/rs && git init -q -b datos-resumenes && git config user.name "medir-ova" && git config user.email "medir-ova@users.noreply.github.com" && git add -A && git commit -q -m "resúmenes ESPN" && git push -q -f "$URL" datos-resumenes; cd "$GITHUB_WORKSPACE"; fi
          mkdir -p /tmp/res && cp -f resultado_mejoras.* salida_mejoras.txt /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q -b resultados-mejoras && git config user.name "medir-ova" && git config user.email "medir-ova@users.noreply.github.com" && git add -A && git commit -q -m "mejoras" && git push -q -f "$URL" resultados-mejoras
