name: Sonda OddsPapi (futbol y basquet)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sondear
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: node scripts/sonda.js
      - name: Guardar informe
        if: always()
        continue-on-error: true
        run: |
          [ -f sonda.md ] || exit 0
          mkdir -p /tmp/inf && cp sonda.md /tmp/inf/sonda.md && cd /tmp/inf
          git init -q -b sonda && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add sonda.md && git commit -q -m "sonda"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda
