name: Investigador de patrones

# Cada lunes prueba cientos de situaciones (solas y en pareja) en NBA, NHL y NFL contra el precio de cierre, con reglas fijas
# (Holm, las dos mitades del archivo y la temporada en curso). Vigila tambien las senales que ya estan en la app.
# Solo avisa por ntfy si algo NUEVO pasa o si una senal de la app se dano. Guarda el informe en la rama «investigador». No toca la app.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * 1"
  push:
    branches: [main]
    paths:
      - scripts/medicion/investigador.py
      - scripts/medicion/sorpresas.py
      - .github/workflows/investigador.yml

permissions:
  contents: write

concurrency:
  group: investigador
  cancel-in-progress: true

jobs:
  investigador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traer los datos de las otras ramas
        run: |
          mkdir -p /tmp/inv
          get() { git fetch -q --depth=1 origin "$1" && git show "FETCH_HEAD:$2" > "/tmp/inv/$3" || echo "falta $1:$2"; }
          get datos-nba-box nba-box.json.gz nba-box.json.gz
          get resultados-nba-6t filas_nba.json filas_nba.json
          get datos-nhl-nfl datos-nhl.json datos-nhl.json
          get datos-nhl-nfl datos-nfl.json datos-nfl.json
          for d in nba nhl nfl; do get cierres cierres-$d.json cierres-$d.json; done
          get investigador investigador.json previo.json || true
          ls -la /tmp/inv
      - name: Investigar
        run: python3 -I scripts/medicion/investigador.py /tmp/inv /tmp/inv/previo.json
      - name: Avisar si hay algo nuevo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -s /tmp/inv/aviso.txt ] && [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Investigador: algo nuevo" -H "Tags: mag" --data-binary @/tmp/inv/aviso.txt "https://ntfy.sh/$NTFY_TOPIC" >/dev/null && echo "aviso enviado"
          else
            echo "sin novedades: no avisa"
          fi
      - name: Guardar informe
        run: |
          mkdir -p /tmp/res && cp /tmp/inv/investigador.json /tmp/inv/investigador.md /tmp/res/
          cd /tmp/res && git init -q -b investigador && git config user.name "investigador-ova" && git config user.email "investigador-ova@users.noreply.github.com"
          git add -A && git commit -q -m "investigador $(date -u +%F)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" investigador
