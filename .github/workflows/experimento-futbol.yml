name: Experimento de futbol (local/visita, Elo, mercado, descanso)

on:
  workflow_dispatch:
  push:
    branches: [experimento-futbol]

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr el experimento
        run: node scripts/experimento_futbol.js 2>&1 | tee salida_futbol2.txt
      - name: Guardar el resultado en la rama resultados-futbol2
        if: always()
        run: |
          mkdir -p /tmp/res
          cp -f salida_futbol2.txt resultado_futbol2.txt resultado_futbol2.json /tmp/res/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan resultados-futbol2
          git rm -rf . >/dev/null 2>&1 || true
          cp -f /tmp/res/* . 2>/dev/null || true
          git add -A
          git commit -m "Resultado del experimento de futbol" || true
          git push -f origin resultados-futbol2
