name: Valor vs Pinnacle

# Tres corridas al dia (hora UTC). El script vive en scripts/valor.js (antes estaba pegado dentro de este archivo y se
# reescribia solo en cada corrida, junto con pinnacle.js e index.html). Ahora solo se guarda pinnacle-datos.json.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"
    - cron: "30 18 * * *"
    - cron: "30 21 * * *"

permissions:
  contents: write

# Una corrida a la vez: si dos coinciden, la segunda espera en vez de pelear por el push.
concurrency:
  group: valor-pinnacle
  cancel-in-progress: false

jobs:
  escaner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: valor-${{ github.run_id }}
          restore-keys: valor-
      - name: Avisar si los avisos van a un tema publico
        env:
          TEMA: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$TEMA" ]; then
            echo "::warning::No existe el secreto NTFY_TOPIC: los avisos van al tema PUBLICO 'my-bets' en ntfy.sh (cualquiera puede leerlos y escribirles). Crea el secreto con un nombre largo y aleatorio."
          fi
      - name: Revisar el mercado
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'my-bets' }}
          NOTIFY_ALWAYS: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/valor.js
      - name: Guardar los datos en la app
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f pinnacle-datos.json ]; then echo "Sin pinnacle-datos.json: nada que guardar"; exit 0; fi
          git config user.name "escaner-ova"
          git config user.email "escaner-ova@users.noreply.github.com"
          git add pinnacle-datos.json
          if git diff --cached --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -q -m "mercado: datos del escaner"
          git pull --rebase -q || true
          if git push -q origin HEAD; then
            echo "Datos guardados en la app (pinnacle-datos.json)"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Datos guardados en la app OVA (pinnacle-datos.json)._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pude subir pinnacle-datos.json"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**No pude guardar pinnacle-datos.json en el repo.** Revisa Settings > Actions > General > Workflow permissions: Read and write." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Guardar el informe del escaner (para poder leer el diagnostico)
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f resultado.md ]; then echo "Sin resultado.md"; exit 0; fi
          mkdir -p /tmp/inf && cp resultado.md /tmp/inf/escaner.md
          cd /tmp/inf
          git init -q -b escaner
          git config user.name "escaner-ova"
          git config user.email "escaner-ova@users.noreply.github.com"
          git add escaner.md
          git commit -q -m "informe del escaner"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" escaner
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: valor-${{ github.run_id }}
