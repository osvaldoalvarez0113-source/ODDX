name: Sonda MLB en ESPN (para la pestaña Jugadores)

# Solo mira la estructura de ESPN para MLB en juegos ya jugados. Guarda en la rama "sonda-mlb". No toca la app.
on:
  push:
    branches: [bajar-xg]

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sonda
        run: node sonda_mlb.js
      - name: Guardar
        if: always()
        run: |
          mkdir -p /tmp/res && cp -f sonda_mlb.txt /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q -b sonda-mlb && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add -A && git commit -q -m "sonda mlb" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-mlb
