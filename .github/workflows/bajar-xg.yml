name: Bajar ClubElo (fútbol, para medir)

# Solo baja datos para una medición: xG por partido de las 5 ligas desde 2018-19. Guarda en la rama "datos-xg-futbol".
on:
  push:
    branches: [bajar-xg]

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probar ClubElo
        run: |
          for u in http://api.clubelo.com/2024-08-01 https://api.clubelo.com/2024-08-01 http://clubelo.com/; do
            echo "== $u"; curl -sS -m 40 --retry 2 -o /tmp/p.txt -w "%{http_code}\n" "$u" || true; head -c 200 /tmp/p.txt || true; echo
          done 2>&1 | tee bajar_clubelo.txt
      - name: Bajar ClubElo
        continue-on-error: true
        run: node bajar_clubelo.js
      - name: Guardar
        if: always()
        run: |
          mkdir -p /tmp/res && cp -f clubelo.json bajar_clubelo.txt /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q -b datos-xg-futbol && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add -A && git commit -q -m "ClubElo" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos-xg-futbol
