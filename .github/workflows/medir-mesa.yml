name: Medir las reglas de la Mesa (futbol)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr el modelo de futbol partido por partido
        run: node scripts/medicion/medir_mesa_futbol.js 2>&1 | tee salida_mesa.txt
      - name: Guardar el resultado en la rama resultados-mesa
        if: always()
        run: |
          mkdir -p /tmp/res
          cp -f salida_mesa.txt resultado_mesa_futbol.txt filas_futbol.json /tmp/res/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan resultados-mesa
          git rm -rf . >/dev/null 2>&1 || true
          cp -f /tmp/res/* . 2>/dev/null || true
          git add -A
          git commit -m "Filas de futbol para medir la Mesa" || true
          git push -f origin resultados-mesa
