name: Sonda de fuentes oficiales

on:
  workflow_dispatch:
  push:
    branches: [sonda-oficial]

permissions:
  contents: write

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr la sonda
        run: node scripts/sonda_oficial.js
      - name: Guardar el resultado en la rama resultados-oficial
        if: always()
        run: |
          mkdir -p /tmp/res
          cp -f resultado_oficial.txt /tmp/res/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan resultados-oficial
          git rm -rf . >/dev/null 2>&1 || true
          cp -f /tmp/res/* . 2>/dev/null || true
          git add -A
          git commit -m "Resultado del experimento de futbol" || true
          git push -f origin resultados-oficial
