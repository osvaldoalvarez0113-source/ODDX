name: Video de picks

# APAGADO A PROPÓSITO: no tiene horario ni se dispara con cambios. Solo corre cuando Osvaldo lo pide (botón «Run workflow»
# o que Claude lo dispare). Arma un video vertical con los picks más fuertes de hoy y el récord de la liga
# (scripts/video.js + video/plantilla.html) y lo guarda en la rama «video» como ova-hoy.mp4. No toca la app.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hacer el video
        run: |
          npm i --no-save --no-audit --no-fund puppeteer-core@23 >/dev/null
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          mkdir -p /tmp/liga && cd /tmp/liga && git init -q -b liga && git fetch -q --depth 1 "$URL" liga && git checkout -q -B liga FETCH_HEAD
          cd "$GITHUB_WORKSPACE" && CHROME="$(which google-chrome || which chromium)" node scripts/video.js /tmp/liga /tmp/ova-hoy.mp4
      - name: Guardar en la rama video
        run: |
          [ -f /tmp/ova-hoy.mp4 ] || exit 0
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          mkdir -p /tmp/v && cd /tmp/v && git init -q -b video
          cp /tmp/ova-hoy.mp4 . && cp ova-hoy.mp4 "ova-$(date -u +%F).mp4"
          git config user.name "video-ova" && git config user.email "video-ova@users.noreply.github.com"
          git add -A && git commit -q -m "video $(date -u +%FT%TZ)"
          git push -q -f "$URL" HEAD:video
