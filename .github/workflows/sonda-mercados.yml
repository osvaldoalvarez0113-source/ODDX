name: Sonda mercados OddsPapi (NFL y NHL)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sonda_mercados.js
      - .github/workflows/sonda-mercados.yml
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sondear
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: node scripts/sonda_mercados.js
      - name: Guardar
        if: always()
        continue-on-error: true
        run: |
          [ -d muestras-mercados ] || exit 0
          mkdir -p /tmp/inf && cp -r muestras-mercados/. /tmp/inf/ && cd /tmp/inf
          git init -q -b sonda-mercados && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add -A && git commit -q -m "mercados" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-mercados
