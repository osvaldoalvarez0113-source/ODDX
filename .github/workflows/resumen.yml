name: Resumen de la manana

# Un solo aviso por ntfy cada manana (8:41 a. m. de Chicago) con los juegos donde coinciden el mercado, el Modelo OVA y la ficha
# de TIGRE (sin bajas que pesan), los que hay que evitar, la senal «La racha engana» de la NBA y las bajas que pesan.
# Solo lee (TIGRE, la liga, lesionados y cierres): no toca la app ni los otros robots.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 14 * * *"

permissions:
  contents: read

concurrency:
  group: resumen
  cancel-in-progress: true

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Armar y mandar el resumen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/resumen.js
