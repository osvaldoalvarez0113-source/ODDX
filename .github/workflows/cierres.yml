name: Archivo de cierres

# Todos los días guarda el marcador final y la línea de cierre de ESPN de cada juego de NBA, NHL, NFL y MLB
# (scripts/cierres.js) en la rama «cierres». La usa la historia de la liga (📊 en las apps) y sirve para medir lo que sea
# sin volver a bajar nada. MLB se completa desde 2023 en varias vueltas (como mucho 4,000 líneas por día). No toca la app.
on:
  workflow_dispatch:
  schedule:
    - cron: "53 10 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/cierres.js"
      - ".github/workflows/cierres.yml"

permissions:
  contents: write

concurrency:
  group: cierres
  cancel-in-progress: false

jobs:
  cierres:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Traer lo ya guardado
        run: |
          mkdir -p /tmp/cierres
          (git fetch -q --depth 1 origin cierres && cd /tmp/cierres && for f in nba nhl nfl mlb; do git -C "$GITHUB_WORKSPACE" show "FETCH_HEAD:cierres-$f.json" > "cierres-$f.json" 2>/dev/null || rm -f "cierres-$f.json"; done) || echo "primera vez"
          ls -la /tmp/cierres
      - name: Bajar lo nuevo
        run: node scripts/cierres.js /tmp/cierres
      - name: Guardar en la rama cierres
        if: always()
        run: |
          cd /tmp/cierres
          ls cierres-*.json >/dev/null 2>&1 || exit 0
          printf '# Archivo de cierres\n\nMarcador final y línea de cierre de ESPN por juego (scripts/cierres.js). Un archivo por deporte.\n' > LEEME.md
          git init -q -b cierres && git config user.name "cierres-ova" && git config user.email "cierres-ova@users.noreply.github.com"
          git add -A && git commit -q -m "cierres $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cierres
