name: Sonda mercados chicos (temporal)
on:
  push:
    branches: [tenis-dev]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Catalogo de Kalshi (deportes)
        run: |
          mkdir -p /tmp/s && cd /tmp/s
          node -e '
          const API="https://api.elections.kalshi.com/trade-api/v2";
          (async()=>{
            const r=await fetch(API+"/series?category=Sports&limit=1000",{headers:{accept:"application/json"}}); const j=await r.json();
            const ss=(j.series||[]); require("fs").writeFileSync("series.json",JSON.stringify(ss.map(s=>({t:s.ticker,n:s.title,f:s.frequency,tags:s.tags}))));
            console.log("series deportes:",ss.length);
            const out=[];
            for(const s of ss){ const e=await fetch(API+"/events?series_ticker="+s.ticker+"&status=open&with_nested_markets=true&limit=200").then(x=>x.json()).catch(()=>({}));
              const ev=e.events||[]; if(!ev.length) continue; let mk=0,vol=0,oi=0; ev.forEach(x=>(x.markets||[]).forEach(m=>{mk++;vol+=+(m.volume||m.volume_fp||0);oi+=+(m.open_interest||m.open_interest_fp||0);}));
              out.push({t:s.ticker,n:s.title,ev:ev.length,mk,vol,oi}); await new Promise(r=>setTimeout(r,120)); }
            out.sort((a,b)=>b.vol-a.vol); require("fs").writeFileSync("abiertas.json",JSON.stringify(out,null,0)); console.log("con eventos abiertos:",out.length);
          })();'
      - name: Guardar
        run: |
          cd /tmp/s && git init -q -b resultados-tenis-sonda && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add -A && git commit -q -m sonda && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resultados-tenis-sonda
