name: Medir mercados chicos (temporal)
on:
  push:
    branches: [tenis-dev]
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Medir
        run: node scripts/medicion/mercados_chicos.js
      - name: Guardar
        if: always()
        run: |
          mkdir -p /tmp/r && cp resultado_chicos.md /tmp/r/ 2>/dev/null || echo "sin resultado" > /tmp/r/resultado_chicos.md
          cd /tmp/r && git init -q -b resultados-chicos && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add -A && git commit -q -m "mercados chicos" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resultados-chicos
