name: Archivo de partidos MLB

# Una vez al dia (en temporada) guarda hist-mlb.json en la app: marcadores de la temporada actual y la anterior,
# para «Cómo vienen jugando», la memoria por equipo y las Observaciones del Veredicto de MLB.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 9 * 2-11 *"
  push:
    branches: [main]
    paths:
      - scripts/archivo_mlb.js
      - .github/workflows/archivo-mlb.yml

permissions:
  contents: write

concurrency:
  group: archivo-mlb
  cancel-in-progress: false

jobs:
  archivo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bajar la temporada de la API oficial de la MLB
        run: node scripts/archivo_mlb.js
      - name: Guardar el archivo en la app
        run: |
          git config user.name "escaner-ova"
          git config user.email "escaner-ova@users.noreply.github.com"
          git add -f hist-mlb.json
          if git diff --cached --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -q -m "archivo: partidos MLB"
          git pull --rebase -q || true
          git push -q origin HEAD
