name: Sonda NHL y NFL (ESPN y Pinnacle)

# Mira una vez como vienen los datos reales de hockey y futbol americano (ESPN y OddsPapi) y deja el informe en la rama "sonda-nhl-nfl".
# No cambia la app. Corre al subir estos archivos o a mano.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sonda_nhl_nfl.js
      - .github/workflows/sonda-nhl-nfl.yml

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sondear
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: node scripts/sonda_nhl_nfl.js
      - name: Guardar informe
        if: always()
        continue-on-error: true
        run: |
          [ -f sonda-nhl-nfl.md ] || exit 0
          mkdir -p /tmp/inf && cp sonda-nhl-nfl.md /tmp/inf/ && cd /tmp/inf
          git init -q -b sonda-nhl-nfl && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add sonda-nhl-nfl.md && git commit -q -m "sonda nhl nfl"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-nhl-nfl
