name: Tenis (datos, ratings y medicion)

# Una vez al dia baja de ESPN los partidos nuevos de ATP y WTA, recalcula los ratings (Elo general + superficie),
# repite la medicion y guarda ratings-tenis.json en la app. El historial completo vive en la rama "datos-tenis".
# No usa OddsPapi.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches: [main]
    paths:
      - scripts/tenis_datos.js
      - modelo-tenis.js
      - .github/workflows/tenis.yml

permissions:
  contents: write

concurrency:
  group: tenis-datos
  cancel-in-progress: false

jobs:
  tenis:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recuperar partidos ya bajados
        continue-on-error: true
        run: (git fetch -q origin datos-tenis && git show FETCH_HEAD:partidos-tenis.json > partidos-tenis.json) || echo "sin cache todavia"
      - name: Bajar lo nuevo, recalcular y medir
        run: node scripts/tenis_datos.js
      - name: Guardar el historial (rama datos-tenis)
        continue-on-error: true
        run: |
          mkdir -p /tmp/dat && cp -f partidos-tenis.json /tmp/dat/ && cp -f ratings-tenis.json /tmp/dat/
          cd /tmp/dat && git init -q -b datos-tenis && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add -A && git commit -q -m "datos tenis" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos-tenis
      - name: Guardar los ratings en la app
        run: |
          git config user.name "escaner-ova"
          git config user.email "escaner-ova@users.noreply.github.com"
          git add -f ratings-tenis.json
          if git diff --cached --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -q -m "tenis: ratings y medicion al dia"
          git pull --rebase -q || true
          git push -q origin HEAD
