name: Backtest contra el mercado

on:
  workflow_dispatch:
    inputs:
      dias:
        description: Dias hacia atras (45) o escribe S2025 / S2024 para una temporada completa
        default: "45"

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr el backtest
        env:
          DIAS: ${{ github.event.inputs.dias }}
        run: node scripts/correr_mercado.js "$DIAS"
