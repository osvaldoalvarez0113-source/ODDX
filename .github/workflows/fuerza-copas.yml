name: Fuerza de copas europeas

# Actualiza fuerza-copas.json con los partidos terminados de Champions, Europa y Conference (ESPN). Gratis: no usa OddsPapi.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"
    - cron: "37 23 * * 2,3,4"
  push:
    branches: [main]
    paths:
      - scripts/fuerza_copas.js
      - .github/workflows/fuerza-copas.yml

permissions:
  contents: write

concurrency:
  group: fuerza-copas
  cancel-in-progress: false

jobs:
  fuerza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bajar partidos y ajustar
        run: node scripts/fuerza_copas.js
      - name: Guardar en la app
        run: |
          git config user.name "escaner-ova"
          git config user.email "escaner-ova@users.noreply.github.com"
          git add hist-copas.json fuerza-copas.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "copas: fuerza de equipos $(date -u +%F)"
          git pull --rebase -q
          git push -q origin HEAD
