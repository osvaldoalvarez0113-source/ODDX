name: Fabrica de ideas

# Los domingos prueba cientos de versiones de las constantes de cada modelo (scripts/fabrica.js) contra todas las temporadas
# del archivo. La que pase la regla (mejora en cada temporada y z alto) entra a la liga como «Modelo OVA afinado».
# Guarda fabrica.json en la rama «liga». No toca la app.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 8 * * 0"
  push:
    branches: [main]
    paths:
      - "scripts/fabrica.js"
      - ".github/workflows/fabrica.yml"

permissions:
  contents: write

jobs:
  fabrica:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr la fabrica
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          mkdir -p /tmp/liga && cd /tmp/liga && git init -q -b liga && git fetch -q --depth 1 "$URL" liga && git checkout -q -B liga FETCH_HEAD
          cd "$GITHUB_WORKSPACE" && node scripts/fabrica.js /tmp/liga
      - name: Guardar en la rama liga
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cd /tmp/liga
          git config user.name "fabrica-ova" && git config user.email "fabrica-ova@users.noreply.github.com"
          git add fabrica.json && git commit -q -m "fabrica $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4; do git push -q "$URL" HEAD:liga && exit 0; sleep 5; git pull -q --rebase "$URL" liga || true; done; exit 1
