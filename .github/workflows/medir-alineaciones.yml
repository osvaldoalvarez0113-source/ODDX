name: Medir alineaciones en futbol (solo mide)

# ¿Saber cuántos titulares de siempre faltan le sube aciertos al modelo? scripts/medicion/fut_alineaciones.js
# El cache de alineaciones queda en la rama datos-alineaciones; el resultado en resultados-alineaciones. No toca main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/medicion/fut_alineaciones.js
      - .github/workflows/medir-alineaciones.yml

permissions:
  contents: write

concurrency:
  group: medir-alineaciones
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Traer el cache (si existe)
        run: |
          if git ls-remote --exit-code --heads origin datos-alineaciones >/dev/null 2>&1; then
            git fetch --depth=1 origin datos-alineaciones && git show FETCH_HEAD:alineaciones_cache.json > /tmp/alineaciones_cache.json || true
          fi
      - name: Bajar y medir
        run: node scripts/medicion/fut_alineaciones.js /tmp/alineaciones_cache.json 2>&1 | tee salida_alineaciones.txt
      - name: Guardar cache y resultado
        if: always()
        run: |
          mkdir -p /tmp/res && cp -f salida_alineaciones.txt resultado_alineaciones.json /tmp/res/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for rama in datos-alineaciones resultados-alineaciones; do
            git checkout -q --orphan $rama-tmp && git rm -rfq . >/dev/null 2>&1 || true
            if [ $rama = datos-alineaciones ]; then cp -f /tmp/alineaciones_cache.json . 2>/dev/null || true; else cp -f /tmp/res/* . 2>/dev/null || true; fi
            git add -A && git commit -qm "$rama" || true
            git push -qf origin HEAD:$rama || true
            git checkout -q -f main 2>/dev/null || git checkout -q -f -
          done
