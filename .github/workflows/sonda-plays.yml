name: Sonda de pases de ESPN (cancha en vivo)

on:
  workflow_dispatch:
  push:
    branches: [experimento-plays-fut]

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr la sonda
        run: node scripts/sonda_plays.js 2>&1 | tee salida_plays.txt
      - name: Guardar el resultado en la rama resultados-plays
        if: always()
        run: |
          mkdir -p /tmp/res
          cp -f salida_plays.txt resultado_plays.txt /tmp/res/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan resultados-plays
          git rm -rf . >/dev/null 2>&1 || true
          cp -f /tmp/res/* . 2>/dev/null || true
          git add -A
          git commit -m "Resultado de la sonda de pases" || true
          git push -f origin resultados-plays
