name: Liga de modelos

# Guarda lo que dice cada competidor ANTES de cada juego, califica con ESPN, asciende al titular y arma el mapa de confianza
# (scripts/liga.js). No gasta llamadas de OddsPapi. Todo queda en la rama "liga": liga-registro.json y liga.json (lo leen las apps).
on:
  workflow_dispatch:
  schedule:
    - cron: "35 */2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/liga.js"
      - ".github/workflows/liga.yml"

permissions:
  contents: write

concurrency:
  group: liga
  cancel-in-progress: false

jobs:
  liga:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr la liga
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          mkdir -p /tmp/liga /tmp/pred
          (cd /tmp/liga && git init -q -b liga && git fetch -q --depth 1 "$URL" liga && git checkout -q -B liga FETCH_HEAD ) || echo "primera corrida"
          (cd /tmp/pred && git init -q -b pred && git fetch -q --depth 1 "$URL" pred && git checkout -q FETCH_HEAD -- . ) || echo "sin Polymarket"
          node scripts/liga.js /tmp/liga /tmp/pred
      - name: Guardar en la rama liga
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cd /tmp/liga
          git config user.name "liga-ova" && git config user.email "liga-ova@users.noreply.github.com"
          git add -A && git commit -q -m "liga $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git push -q "$URL" HEAD:liga && exit 0; sleep 5; done; exit 1
