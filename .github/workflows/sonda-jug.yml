name: Sonda jugadores NBA
on:
  push:
    branches: [sonda-jugadores]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/sonda_jug.js
      - name: Guardar
        if: always()
        run: |
          [ -f sonda_jug.md ] || exit 0
          mkdir -p /tmp/inf && cp sonda_jug.md /tmp/inf/ && cd /tmp/inf
          git init -q -b sonda-jug-res && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add . && git commit -q -m "sonda" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-jug-res
