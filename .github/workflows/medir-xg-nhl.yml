name: Medir xG de MoneyPuck en NHL

# Baja el archivo público de MoneyPuck.com (juego por juego, todos los equipos; uso no comercial, con crédito) y mide si la
# calidad del tiro (goles esperados) le sirve más al modelo de NHL que contar tiros. Solo mide: no toca la app ni guarda el archivo.
# Informe en la rama "resultados-xg".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/medicion/xg_nhl.js
      - .github/workflows/medir-xg-nhl.yml

permissions:
  contents: write

concurrency:
  group: medir-xg-nhl
  cancel-in-progress: true

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bajar datos de MoneyPuck
        run: |
          curl -sS -L --fail --retry 3 -A "ova-medicion (uso personal, no comercial)" -o /tmp/all_teams.csv \
            https://moneypuck.com/moneypuck/playerData/careers/gameByGame/all_teams.csv 2>&1 | tee /tmp/descarga.txt || true
          ls -la /tmp/all_teams.csv || true
          head -c 3000 /tmp/all_teams.csv | head -2 > /tmp/cabecera.txt || true
      - name: Medir
        run: node scripts/medicion/xg_nhl.js /tmp/all_teams.csv datos-nhl.json resultado_xg_nhl.md 2>&1 | tee salida_xg_nhl.txt
      - name: Guardar informe
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/res && cp -f resultado_xg_nhl.md salida_xg_nhl.txt /tmp/cabecera.txt /tmp/descarga.txt /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q -b resultados-xg && git config user.name "escaner-ova" && git config user.email "escaner-ova@users.noreply.github.com"
          git add -A && git commit -q -m "resultado xg nhl" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resultados-xg
