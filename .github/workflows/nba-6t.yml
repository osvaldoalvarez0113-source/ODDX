name: NBA 6 temporadas

on:
  workflow_dispatch:
  push:
    branches: [nba-6t]

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TEMPS_NBA: "2020,2021,2022,2023,2024,2025"
      NBA_SKMIN: "2019"
      VOLCAR_PARTIDOS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr el backtest de NBA (6 temporadas)
        run: node scripts/correr_deportes.js nba 2>&1 | tee resultado_nba_6t.txt
      - name: Guardar el resultado en la rama resultados-nba-6t
        if: always()
        run: |
          mkdir -p /tmp/res
          cp -f resultado_nba_6t.txt resultado_nba.json filas_nba.json /tmp/res/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan resultados-nba-6t
          git rm -rf . >/dev/null 2>&1 || true
          cp -f /tmp/res/* . 2>/dev/null || true
          git add -A
          git commit -m "Resultado NBA 6 temporadas" || true
          git push -f origin resultados-nba-6t
