/* 3. ordenar por PUNTOS y no por EV, con listón de ruido por mercado */
add('Ordenar por puntos de ventaja',
`  lista.sort(function(a,b){ return b.v.ev-a.v.ev; });
  var buenos=lista.filter(function(m){ return m.v.ev>0 && m.v.ventaja>=2; });`,
`  /* Se ordenaba por EV, y el EV por dolar es la ventaja DIVIDIDA entre el
     precio: los mismos 7 puntos dan +13% sobre un contrato de 52 centavos y
     +8.7% sobre uno de 80. O sea que el contrato barato ganaba siempre esa
     carrera aunque la ventaja fuera identica, y eso no es una senal, es la
     aritmetica del denominador. Ahora manda la ventaja en puntos, que es
     cuanto te separas del mercado. El EV sigue impreso en cada linea.
     UMBRAL es el liston de cada mercado segun lo que dio SU propia medicion:
     el ganador y el handicap estan calibrados (0.55 de Brier, multiplicador
     medido) y ahi 2 puntos significan algo; el total, las carreras por equipo
     y F5 andan en correlacion 0.10-0.16, y con esa precision una ventaja de 3
     o 4 puntos no se distingue de la formula redondeando. Los ponches nunca se
     han medido contra nada. Lo que no llega a su liston NO se bota — se marca
     y cae al final, porque la decision es suya. */
  var UMBRAL={ok:2, flojo:8, nada:10};
  var ruidoso=function(m){ return m.v.ventaja < (UMBRAL[m.med]||8); };
  lista.sort(function(a,b){
    var ra=ruidoso(a)?1:0, rb=ruidoso(b)?1:0;
    if(ra!==rb) return ra-rb;
    return b.v.ventaja-a.v.ventaja;
  });
  var buenos=lista.filter(function(m){ return m.v.ev>0 && m.v.ventaja>=2; });`);

`  if(rank>1) o+='<div class="flag">Están ordenadas por EV, que es cuánto esperas ganar por cada dólar. '+

`  if(hayRuido) o+='<div class="flag">Las marcadas <b>dentro del ruido</b> tienen menos ventaja que el '+

      o+='<div class="aviso">⚠️ <b>'+lados[L]+' de estas proposiciones son '+L+'</b> del mismo juego. '+

         'equivocas, fallan las '+lados[L]+'. Escoge una y con un solo stake.</div>';
    });
  }`);

`  caja.querySelectorAll('.fila .txt').forEach(function(t){

    var out={era:era, ip:ip, so:so, gs:gs,
      w:+(st.wins||0), l:+(st.losses||0),
      fip: ip>=10 ? (13*hr+3*(bb+hbp)-2*so)/ip+3.15 : null,
      k9:  ip>0 ? so*9/ip : null,

/* 14. el aviso de muestra corta, en el Veredicto */
add('Aviso de muestra corta (función)',
`function ajuste(nombre,crudo,usado){`,
`/* El modelo YA jala el ERA hacia la liga segun los innings — un novato de 2.54
   en 10 innings entra al calculo con ~3.77, no con 2.54. Lo que faltaba era
   enseñarlo DONDE SE DECIDE. El aviso viejo vivia en la pestaña de Numeros y
   solo salia si el movimiento pasaba de 0.75, asi que en el Veredicto no se
   veia nada y parecia que el novato entraba con su numero bueno. */
function avisoMuestra(nA,seA,cA,uA,nH,seH,cH,uH){
  var f=[];
  [[nA,seA,cA,uA],[nH,seH,cH,uH]].forEach(function(t){
    var se=t[1], cr=t[2], us=t[3];
    if(!se||cr==null||us==null||!isFinite(cr)||!isFinite(us)) return;
    if(se.ip>=30 && Math.abs(cr-us)<0.60) return;
    f.push({n:t[0], ip:se.ip, gs:se.gs, cr:cr, us:us, h9:se.h9, whip:se.whip});
  });
  if(!f.length) return '';
  var o='<div class="aviso"><b>⚠️ Muestra corta en el montículo</b><br>';
  f.forEach(function(p){
    o+='<b>'+esc(p.n)+'</b> lleva '+num(p.ip,1)+' innings'+(p.gs?' en '+p.gs+' aperturas':'')+
       '. Su ERA dice '+num(p.cr)+', pero al cálculo entra con <b>'+num(p.us)+'</b>: se jaló hacia el '+
       'promedio de la liga porque con esos innings ese número todavía no significa nada.';
    if(p.h9!=null&&isFinite(p.h9)){
      o+=' Le conectan '+num(p.h9,1)+' hits por 9'+
         (p.whip!=null&&isFinite(p.whip)?' y su WHIP es '+num(p.whip):'')+'.';
      if(p.h9>=9.5) o+=' <b>Le están pegando.</b> Lo que lo salva son los corredores que deja en base, '+
         'y eso no se sostiene: el ERA le va a subir.';
    }
    o+='<br>';
  });
  o+='Y ojo con la otra mitad: al abridor de enfrente, si lleva 80 o 100 innings, no se le mueve casi '+
