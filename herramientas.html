<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<title>OVA · Herramientas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OVA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
 --bg:#0A0908; --bg1:#13110D; --bg2:#1B1812; --bg3:#25211A; --line:#2A241B; --line2:#43381F;
 --txt:#F7F2E7; --mut:#CBBFA5; --mut2:#A09472; --acc:#C9A24A; --acc2:#E6C874; --accTx:#1A1305;
 --good:#6FD39A; --bad:#F08A78; --warn:#F0CE6B;
 --body:-apple-system,system-ui,'Inter','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0A0908}
body{min-height:100dvh;background:var(--bg);color:var(--txt);font-family:var(--body);-webkit-font-smoothing:antialiased;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
header a{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);color:var(--txt);text-decoration:none;font-size:20px;background:var(--bg1)}
header h1{font-size:20px;font-weight:800;letter-spacing:.01em}
header p{font-size:12px;color:var(--mut2);margin-top:1px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:0 0 auto;padding:9px 14px;border-radius:100px;border:1px solid var(--line2);background:var(--bg1);color:var(--mut);font:600 13.5px var(--body);cursor:pointer;min-height:40px}
#tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--accTx)}
#vista{display:flex;flex-direction:column;gap:12px;animation:ent .35s ease}
@keyframes ent{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#vista{animation:none}}
.caja,.kpi,.vacio,.tab{background:var(--bg1);border:1px solid var(--line);border-radius:16px}
.caja{padding:14px}
.caja h3{font-size:15px;margin-bottom:6px}
.nota{font-size:12.5px;color:var(--mut);line-height:1.5;margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis.dos{grid-template-columns:repeat(2,1fr)}
.kpi{padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:11px;color:var(--mut2);margin-top:3px;line-height:1.3}
.kpi.g b{color:var(--good)} .kpi.p b{color:var(--bad)} .kpi.a b{color:var(--warn)}
.flag{padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);font-size:13px;line-height:1.5;color:var(--txt)}
.flag.verde{border-color:#2F7D52;background:#0F2A1B} .flag.ambar{border-color:#C99422;background:#2D2308} .flag.rojo{border-color:#C2362A;background:#34110D}
.vacio{padding:22px;text-align:center}.vacio b{display:block;font-size:16px;margin-bottom:6px}.vacio p{font-size:13px;color:var(--mut);line-height:1.5}
.tab{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;font-size:13.5px}
.tab th{font-size:11px;color:var(--mut2);font-weight:600;text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab td{padding:10px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tab tr:last-child td{border-bottom:0}
.tab td.n{text-align:right}.tab td.mejor{color:var(--good);font-weight:800}
.curva{width:100%;height:auto;display:block;margin:6px 0}
.curva .cero{stroke:var(--line2);stroke-dasharray:4 4}
.curva .linea{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.curva .sube{stroke:var(--good)}.curva .baja{stroke:var(--bad)}
.curva .area.sube{fill:rgba(111,211,154,.14)}.curva .area.baja{fill:rgba(240,138,120,.14)}
.curva .punto.sube{fill:var(--good)}.curva .punto.baja{fill:var(--bad)}
.pie2{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut2);flex-wrap:wrap}
.caja .pie2 button{padding:9px 14px;border-radius:100px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);font:600 13px var(--body);cursor:pointer;min-height:40px}
.caja textarea{width:100%;box-sizing:border-box;margin-top:8px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);font:12px monospace;padding:8px}
input{width:100%;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);font:500 16px var(--body)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.fila{display:flex;gap:8px;margin:8px 0}.fila.tres input{padding:11px 8px}
.btn{width:100%;margin-top:6px;padding:13px;border-radius:12px;border:0;background:var(--acc);color:var(--accTx);font:700 15px var(--body);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;border:1px solid var(--acc);color:var(--acc2)}
.ghost.chico{padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--mut);font:600 12.5px var(--body);cursor:pointer;white-space:nowrap}
.msg{font-size:12.5px;color:var(--bad);min-height:0;margin-top:6px}
.mov{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:0}
.mov .t span{color:var(--mut2);font-size:12.5px}
.mov .acc{display:flex;gap:8px}.mov .acc input{padding:8px 10px;font-size:15px}
.cab,.casa{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:8px;align-items:center}
.cab{font-size:11px;color:var(--mut2);padding:0 2px 6px}.casa{padding:5px 0}.casa b{font-size:14px}
.casa input{padding:10px 8px}
.campo{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.campo span{font-size:11.5px;color:var(--mut2);line-height:1.3}
.res{display:flex;flex-direction:column;gap:10px}
.lis{margin:6px 0 6px 20px;font-size:13px;color:var(--mut);line-height:1.6}
@media (max-width:360px){.kpi b{font-size:17px}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:9px 13px;border-radius:100px;border:1px solid var(--line2);background:var(--bg1);color:var(--mut);font:600 13.5px var(--body);cursor:pointer;min-height:40px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--accTx)}
.chips button:disabled{opacity:.35}
.autoC{display:flex;flex-direction:column;gap:12px}
.navP{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:6px}
.navP b{font-size:14px;text-align:center;flex:1}
.navP button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);font:700 20px var(--body);cursor:pointer}
.navP button:disabled{opacity:.3}
.duelo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.duelo .lado{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:12px 8px;text-align:center}
.duelo .lado.gana{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.duelo span{display:block;font-size:12.5px;color:var(--mut)}
.duelo b{display:block;font-size:30px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.duelo small{font-size:12px;color:var(--mut2)}
.linA{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:13.5px}
.linA span{color:var(--mut)}.linA b{font-variant-numeric:tabular-nums;white-space:nowrap}
.g{color:var(--good)!important}.p{color:var(--bad)!important}
.tab tr.sel td{background:var(--bg3)}
.diaA{font-size:12px;font-weight:700;color:var(--acc2);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.jA{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.jAtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.eqs{flex:1;min-width:0}
.eqA{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mut);padding:1px 0}
.eqA span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqA b{font-variant-numeric:tabular-nums}
.eqA.gano{color:var(--txt);font-weight:700}
.estA{font-size:11.5px;color:var(--mut2);white-space:nowrap;padding-top:2px}
.pksA{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.pkA{font-size:12.5px;color:var(--mut);background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.pkA.si{border-color:#2F7D52;color:var(--good)}.pkA.no{border-color:#7a2a20;color:var(--bad)}
.ligA{display:block;font-size:11px;color:var(--mut2);margin-top:6px}
.avA summary{font-weight:700;font-size:14px;cursor:pointer}
.avA > div{margin-top:10px;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <a href="hub.html" aria-label="Volver al inicio">&#8249;</a>
  <div><h1>Herramientas</h1><p>Marcador · banca · casas · avisos</p></div>
 </header>
 <div id="tabs" role="tablist"></div>
 <main id="vista"></main>
</div>
<script src="banca.js"></script>
<script src="autoregistro.js"></script>
<script src="herramientas.js"></script>
<script src="ovaextra.js"></script>
</body>
</html>
