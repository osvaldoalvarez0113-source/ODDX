<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtest Bullpen Reciente — OVA</title>
<style>
  :root{
    --bg:#0b0d10; --card:#15181c; --line:#262b31; --gold:#d4af37;
    --text:#f0ede4; --muted:#9aa1ab; --good:#4caf7d; --bad:#e05656;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; padding:16px; max-width:720px; margin:0 auto;}
  h1{font-size:1.3rem; color:var(--gold); margin:8px 0 4px;}
  p.sub{color:var(--muted); font-size:0.85rem; margin:0 0 18px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
  label{display:block; font-size:0.85rem; color:var(--muted); margin-bottom:6px;}
  select, input[type=date]{width:100%; background:#0e1114; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:0.95rem; margin-bottom:12px;}
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  button{width:100%; background:var(--gold); color:#111; border:none; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer;}
  button:disabled{opacity:0.5;}
  .bar{height:8px; background:#0e1114; border-radius:6px; overflow:hidden; margin:10px 0;}
  .bar > div{height:100%; background:var(--gold); width:0%; transition:width 0.2s;}
  .log{font-size:0.78rem; color:var(--muted); max-height:120px; overflow-y:auto; white-space:pre-wrap; font-family:monospace; margin-top:8px;}
  table{width:100%; border-collapse:collapse; font-size:0.85rem; margin-top:6px;}
  th, td{padding:8px 6px; text-align:right; border-bottom:1px solid var(--line);}
  th:first-child, td:first-child{text-align:left;}
  th{color:var(--muted); font-weight:600; font-size:0.75rem; text-transform:uppercase;}
  .veredicto{font-size:0.9rem; margin-top:14px; padding:12px; border-radius:10px; background:#0e1114; border:1px solid var(--line);}
  .veredicto b{color:var(--gold);}
  .hidden{display:none;}
</style>
</head>
<body>

<h1>⚾ Backtest: Bullpen Reciente vs Temporada</h1>
<p class="sub">Mide si el ERA del bullpen en los últimos 3-5 días predice mejor el rendimiento real del bullpen en el juego, comparado con el ERA de bullpen de toda la temporada.</p>

<div class="card">
  <label>Temporada</label>
  <select id="season">
    <option value="2026">2026</option>
    <option value="2025">2025</option>
  </select>

  <label>Rango de fechas (deja por defecto para toda la temporada regular)</label>
  <div class="row">
    <div><input type="date" id="startDate"></div>
    <div><input type="date" id="endDate"></div>
  </div>

  <label>Modo</label>
  <select id="mode">
    <option value="full">Completo (todos los juegos, más lento)</option>
    <option value="sample">Rápido (1 de cada 3 fechas, para probar)</option>
  </select>

  <button id="run">Correr backtest</button>
  <div class="bar"><div id="barFill"></div></div>
  <div id="status" style="font-size:0.85rem;color:var(--muted);"></div>
  <div class="log" id="log"></div>
</div>

<div class="card hidden" id="results">
  <table>
    <thead>
      <tr><th>Predictor</th><th>n</th><th>r (correlación)</th><th>sesgo (ERA)</th></tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
  <div class="veredicto" id="veredicto"></div>
</div>

<script>
const $ = id => document.getElementById(id);

// --- utilidades de innings formato ESPN (X.1 = 1/3, X.2 = 2/3) ---
function ipToOuts(ipStr){
  const s = String(ipStr);
  const [whole, frac] = s.split('.');
  const w = parseInt(whole||'0',10) || 0;
  const f = frac ? parseInt(frac,10) : 0; // 0,1,2
  return w*3 + (f===1?1:f===2?2:0);
}
function outsToIP(outs){ return outs/3; }

function pearson(xs, ys){
  const n = xs.length;
  if(n < 3) return null;
  const mx = xs.reduce((a,b)=>a+b,0)/n;
  const my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, dx2=0, dy2=0;
  for(let i=0;i<n;i++){
    const dx = xs[i]-mx, dy = ys[i]-my;
    num += dx*dy; dx2 += dx*dx; dy2 += dy*dy;
  }
  const den = Math.sqrt(dx2*dy2);
  return den === 0 ? null : num/den;
}

function log(msg){
  const el = $('log');
  el.textContent += msg + "\n";
  el.scrollTop = el.scrollHeight;
}

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status+' en '+url);
  return r.json();
}

// concurrencia limitada
async function pool(items, limit, worker){
  const results = new Array(items.length);
  let idx = 0;
  async function next(){
    while(idx < items.length){
      const i = idx++;
      try{ results[i] = await worker(items[i], i); }
      catch(e){ results[i] = null; }
    }
  }
  await Promise.all(new Array(limit).fill(0).map(next));
  return results;
}

async function runBacktest(){
  $('run').disabled = true;
  $('results').classList.add('hidden');
  $('log').textContent = '';
  $('barFill').style.width = '0%';

  const season = $('season').value;
  const mode = $('mode').value;
  let startDate = $('startDate').value || (season+'-03-15');
  let endDate = $('endDate').value || (season+'-10-01');

  $('status').textContent = 'Descargando calendario...';
  const sched = await fetchJSON(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&season=${season}&gameType=R&startDate=${startDate}&endDate=${endDate}`);

  // agrupar gamePks por fecha, solo juegos finalizados
  let dateGroups = (sched.dates || []).map(d => ({
    date: d.date,
    gamePks: (d.games||[]).filter(g => g.status && g.status.abstractGameState === 'Final').map(g => g.gamePk)
  })).filter(d => d.gamePks.length > 0);

  dateGroups.sort((a,b) => a.date.localeCompare(b.date));

  if(mode === 'sample'){
    dateGroups = dateGroups.filter((_, i) => i % 3 === 0);
  }

  const totalGames = dateGroups.reduce((s,d)=>s+d.gamePks.length,0);
  log(`Fechas: ${dateGroups.length} · Juegos: ${totalGames}`);

  // logs de bullpen por equipo: teamId -> [{date, ip, er}]
  const teamLog = {};
  // acumulado de temporada: teamId -> {ip, er}
  const seasonAcc = {};

  function addToLog(teamId, dateStr, ip, er){
    if(!teamLog[teamId]) teamLog[teamId] = [];
    teamLog[teamId].push({date: dateStr, ip, er});
    if(!seasonAcc[teamId]) seasonAcc[teamId] = {ip:0, er:0};
    seasonAcc[teamId].ip += ip;
    seasonAcc[teamId].er += er;
  }

  function recentERA(teamId, beforeDateStr, windowDays){
    const log = teamLog[teamId];
    if(!log) return null;
    const before = new Date(beforeDateStr+'T00:00:00Z');
    const cutoff = new Date(before.getTime() - windowDays*24*3600*1000);
    let ip=0, er=0;
    for(const entry of log){
      const d = new Date(entry.date+'T00:00:00Z');
      if(d >= cutoff && d < before){ ip += entry.ip; er += entry.er; }
    }
    return {ip, er};
  }

  function seasonERA(teamId){
    const acc = seasonAcc[teamId];
    if(!acc || acc.ip <= 0) return null;
    return (acc.er*9)/acc.ip;
  }

  // muestras acumuladas
  const samples = { r3: {x:[], y:[]}, r5: {x:[], y:[]}, season: {x:[], y:[]} };

  let processed = 0;
  let gameErrors = 0;

  for(const group of dateGroups){
    const boxscores = await pool(group.gamePks, 6, async (gamePk) => {
      const box = await fetchJSON(`https://statsapi.mlb.com/api/v1/game/${gamePk}/boxscore`);
      return {gamePk, box};
    });

    // primero: calcular predictores ANTES de agregar los datos de hoy al log
    const todaysEntries = [];

    for(const item of boxscores){
      if(!item || !item.box){ gameErrors++; continue; }
      const box = item.box;
      const teams = box.teams;
      if(!teams || !teams.home || !teams.away){ gameErrors++; continue; }

      for(const side of ['home','away']){
        const teamData = teams[side];
        const teamId = teamData.team && teamData.team.id;
        const pitcherIds = teamData.pitchers || [];
        if(!teamId || pitcherIds.length < 2) continue; // sin relevo ese día, se descarta

        // bullpen = todos los pitchers menos el primero (abridor)
        let ip=0, er=0;
        for(let i=1;i<pitcherIds.length;i++){
          const pid = pitcherIds[i];
          const pdata = teamData.players && teamData.players['ID'+pid];
          if(!pdata || !pdata.stats || !pdata.stats.pitching) continue;
          const stat = pdata.stats.pitching;
          const outs = ipToOuts(stat.inningsPitched || '0.0');
          ip += outsToIP(outs);
          er += (stat.earnedRuns || 0);
        }
        if(ip < 0.1) continue; // bullpen no lanzó de verdad

        const actualERA = (er*9)/ip;
        const gameDate = group.date;

        const r5 = recentERA(teamId, gameDate, 5);
        const r3 = recentERA(teamId, gameDate, 3);
        const sERA = seasonERA(teamId);

        if(r3 && r3.ip >= 2){
          samples.r3.x.push((r3.er*9)/r3.ip);
          samples.r3.y.push(actualERA);
        }
        if(r5 && r5.ip >= 3){
          samples.r5.x.push((r5.er*9)/r5.ip);
          samples.r5.y.push(actualERA);
        }
        if(sERA !== null){
          samples.season.x.push(sERA);
          samples.season.y.push(actualERA);
        }

        todaysEntries.push({teamId, date: gameDate, ip, er});
      }
    }

    // ahora sí, agregar los datos de hoy a los logs para el futuro
    for(const e of todaysEntries) addToLog(e.teamId, e.date, e.ip, e.er);

    processed += group.gamePks.length;
    const pct = Math.round(100*processed/totalGames);
    $('barFill').style.width = pct+'%';
    $('status').textContent = `${processed}/${totalGames} juegos · ${group.date}`;
  }

  log(`Listo. Errores de descarga: ${gameErrors}`);

  // resultados
  const rows = [
    {label:'Reciente 3 días', key:'r3'},
    {label:'Reciente 5 días', key:'r5'},
    {label:'Temporada completa', key:'season'},
  ];

  const tbody = $('resultsBody');
  tbody.innerHTML = '';
  let best = null;

  for(const row of rows){
    const s = samples[row.key];
    const n = s.x.length;
    const r = pearson(s.x, s.y);
    const bias = n>0 ? (s.x.reduce((a,b)=>a+b,0)/n - s.y.reduce((a,b)=>a+b,0)/n) : null;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${row.label}</td><td>${n}</td><td>${r!==null? r.toFixed(3) : '—'}</td><td>${bias!==null? (bias>=0?'+':'')+bias.toFixed(2) : '—'}</td>`;
    tbody.appendChild(tr);
    if(r !== null && (best===null || Math.abs(r) > Math.abs(best.r))){
      best = {label: row.label, r, n};
    }
  }

  const ver = $('veredicto');
  if(best){
    ver.innerHTML = `<b>Mejor predictor: ${best.label}</b> (r=${best.r.toFixed(3)}, n=${best.n}).<br>
    Referencia: tus otros mercados (total, carreras por equipo, F5) dieron r entre 0.10 y 0.16 — así que compara contra ese techo antes de decidir si vale la pena meter esto a la fórmula.`;
  } else {
    ver.textContent = 'No hubo suficientes muestras para calcular correlación. Prueba con un rango de fechas más amplio.';
  }

  $('results').classList.remove('hidden');
  $('status').textContent = 'Backtest completo.';
  $('run').disabled = false;
}

$('run').addEventListener('click', () => {
  runBacktest().catch(e => {
    log('ERROR: ' + e.message);
    $('status').textContent = 'Falló — revisa el log.';
    $('run').disabled = false;
  });
});
</script>
</body>
</html>
