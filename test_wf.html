<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba: worldfootball.net CORS</title>
<style>
body{font-family:system-ui,sans-serif;background:#070B12;color:#F1F5FB;padding:20px;line-height:1.6}
button{background:#3B82F6;color:#020509;border:0;border-radius:8px;padding:14px 20px;
 font-size:16px;font-weight:700;width:100%;margin:10px 0;cursor:pointer}
pre{background:#131D2C;padding:12px;border-radius:8px;overflow-x:auto;font-size:11.5px;
 white-space:pre-wrap;max-height:65vh;overflow-y:auto}
.ok{color:#34D399}.bad{color:#F87171}
</style>
</head>
<body>
<h2>Prueba: ¿worldfootball.net deja llamadas desde el navegador?</h2>
<button id="ir">Probar ahora</button>
<pre id="log">Esperando...</pre>
<script>
var log=document.getElementById('log');
function w(t,cls){ log.innerHTML+='\n'+(cls?'<span class="'+cls+'">':'')+t+(cls?'</span>':''); }

document.getElementById('ir').addEventListener('click',function(){
  log.textContent='Probando...';
  fetch('https://www.worldfootball.net/competition/co91/england-premier-league/team-statistics-overview/')
    .then(function(r){
      w('HTTP '+r.status, r.ok?'ok':'bad');
      return r.text();
    })
    .then(function(t){
      w('Llegaron '+t.length+' caracteres. Primeros 200:','ok');
      w(t.slice(0,200));
      w('\n✓✓ FUNCIONA. Se puede automatizar de verdad.','ok');
    })
    .catch(function(e){
      w('✗ BLOQUEADO (CORS): '+e.message,'bad');
      w('\nEsta fuente tampoco deja llamadas directas desde el navegador.','bad');
    });
});
</script>
</body>
</html>
