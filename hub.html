<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVA — Elige tu deporte</title>
<style>
:root{
 --bg:#070B12;--bg1:#0D1420;--bg2:#131D2C;--bg3:#1B2838;
 --line:#1C2838;--line2:#2A3E56;
 --txt:#F1F5FB;--mut:#9DB2C8;--mut2:#6D8299;
 --acc:#3B82F6;--acc2:#60A5FA;--accTx:#020509;
 --hot:#FBBF24;--hotTx:#1A1305;
 --good:#34D399;
 --r:12px;--r2:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);
 font-family:system-ui,-apple-system,sans-serif;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.brand{font-size:15px;letter-spacing:5px;color:var(--mut2);font-weight:700;margin-bottom:6px}
h1{font-size:26px;margin:0 0 34px;font-weight:800;text-align:center}
.grid{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.card{position:relative;background:var(--bg1);border:1px solid var(--line2);border-radius:var(--r2);
 padding:22px 20px;display:flex;align-items:center;gap:18px;text-decoration:none;color:var(--txt);
 overflow:hidden;transition:transform .15s ease, border-color .2s ease;
 box-shadow:0 1px 3px rgba(0,0,0,.4),0 20px 40px -18px rgba(0,0,0,.7)}
.card:active{transform:scale(.97)}
.card.on{border-color:var(--line2)}
.card.off{opacity:.55;pointer-events:none}
.glow{position:absolute;top:-40%;right:-20%;width:70%;height:180%;border-radius:50%;
 pointer-events:none;filter:blur(10px);opacity:.5}
.mlb .glow{background:radial-gradient(circle,rgba(59,130,246,.35),transparent 70%)}
.fut .glow{background:radial-gradient(circle,rgba(52,211,153,.3),transparent 70%)}
.nba .glow{background:radial-gradient(circle,rgba(251,191,36,.25),transparent 70%)}
.ico{font-size:34px;flex:0 0 auto;position:relative;z-index:1}
.txt{position:relative;z-index:1;flex:1}
.txt b{display:block;font-size:18px;font-weight:800;margin-bottom:2px}
.txt span{font-size:12.5px;color:var(--mut)}
.badge{position:relative;z-index:1;font-size:10.5px;font-weight:700;color:var(--mut2);
 background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:4px 10px;
 white-space:nowrap}
.arrow{position:relative;z-index:1;color:var(--mut2);font-size:18px}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ico{animation:flota 3.2s ease-in-out infinite}
.fut .ico{animation-delay:.3s}
.nba .ico{animation-delay:.6s}
@media (prefers-reduced-motion:reduce){.ico{animation:none}}
</style>
<!--OVA45:HEAD:BEGIN-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OVA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style id="ova-skins">
/* ===== OVA · temas v44 =====
   El tema por defecto (Noche) NO lleva atributo data-skin y queda como antes, salvo
   los retoques marcados 0 y 0b (un desborde real y tres textos con poco contraste).
   Cada tema nuevo define TODOS sus colores como variables; las reglas de la seccion 1
   solo se activan cuando hay data-skin. */
:root{
 --x-chip:#04140C;
 --x-herobg:linear-gradient(180deg,var(--bg2),var(--bg1));
 --x-fixed:none;
}
html[data-app=fut] .forma span{color:var(--x-chip)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--x-fixed)}


/* ---------- 0. arreglo de desborde horizontal (todos los temas, tambien Noche) ----------
   El brillo de arriba de la tarjeta abierta medía 160% del ancho y se salia de la pantalla
   (medido: la pagina pasaba de 390 a 485 px de ancho al abrir un juego). Ahora se queda adentro. */
html[data-app=mlb] .game.open .body::before{left:0;width:100%;transform:none}


/* ---------- 0b. legibilidad de Noche (tres textos que median bajo 4.5 en la auditoria) ---------- */
html[data-app=mlb]:not([data-skin]) .tb.on{background:#2D6CDF}
html[data-app=mlb]:not([data-skin]) .out.no{color:#7C92AA}
html[data-app=mlb]:not([data-skin]) .teq.on{color:var(--acc2)}

/* ---------- 1. consumir las variables (solo con tema activo) ---------- */
html[data-app=mlb][data-skin] .topbar{background:var(--x-topbg)}
html[data-app=mlb][data-skin] .navbar{background:var(--x-navbg)}
html[data-app=fut][data-skin] header{background:var(--x-fhead)}
html[data-app=fut][data-skin] .tabbar{background:var(--x-navbg)}
html[data-app=fut][data-skin] body{font-family:var(--body)}
html[data-app=mlb][data-skin] .game,html[data-app=fut][data-skin] .game{box-shadow:var(--x-shadow)}
html[data-app=mlb][data-skin] .status.err,html[data-app=mlb][data-skin] .aviso,html[data-app=mlb][data-skin] .pick.alerta,html[data-app=mlb][data-skin] .row.hcrow .par.pr{background:var(--x-errbg);border-color:var(--x-errbd)}
html[data-app=mlb][data-skin] .aviso b{color:var(--x-errb)}
html[data-app=fut][data-skin] .aviso{background:var(--x-warnbg)}
html[data-app=mlb][data-skin] .medido.ok,html[data-app=mlb][data-skin] .pk .res.g{background:var(--x-okbg);color:var(--x-oktx)}
html[data-app=mlb][data-skin] .medido.flojo,html[data-app=mlb][data-skin] .pk .res.p{background:var(--x-flbg);color:var(--x-fltx)}
html[data-app=mlb][data-skin] .out.si,html[data-app=mlb][data-skin] .pick.big .q{color:var(--x-oktx)}
html[data-app=mlb][data-skin] .row.hcrow .par.pv{background:var(--x-pvbg);border-color:var(--x-pvbd)}
html[data-app=mlb][data-skin] .teq.on{background:var(--x-teqon)}
html[data-app=mlb][data-skin] .pick.ia{background:var(--x-iabg);border-color:var(--x-iabd)}
html[data-app=mlb][data-skin] .pick.big,html[data-app=fut][data-skin] .pick{background:var(--x-goodbg)}
html[data-app=mlb][data-skin] .pick.big{border-color:var(--x-goodbd)}
html[data-app=mlb][data-skin] .game.open .body::before{background:radial-gradient(ellipse at top,var(--x-glow),transparent 60%)}
html[data-app=mlb][data-skin] .game.open .head{box-shadow:0 0 40px -8px var(--x-headglow) inset}
html[data-app=mlb][data-skin] .bar .lead,html[data-app=fut][data-skin] .bar .h{background:var(--x-lead)}
html[data-app=mlb][data-skin] .bar .lead{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 22px -4px var(--x-leadglow)}
html[data-app=mlb][data-skin] .fila.alto .track i{background:var(--x-lead)}
html[data-app=mlb][data-skin] .tb.on{color:var(--x-tabtx)}
html[data-app=fut][data-skin] .bar .a{color:var(--x-atx)}
html[data-app=mlb][data-skin] .bug .qr i,html[data-app=mlb][data-skin] .bug .in em{color:var(--x-onhead)}
html[data-app=mlb][data-skin] .bug .dia .base.on{fill:var(--x-onhead);stroke:var(--x-onhead)}
html[data-app=mlb][data-skin] .tabs,html[data-app=fut][data-skin] .body .tabs{background:var(--x-stbg)}
html[data-app=mlb][data-skin] .cabp{background:var(--x-cabbg)}
html[data-app=mlb][data-skin] .game,html[data-app=fut][data-skin] .game,html[data-app=mlb][data-skin] .ajustes,html[data-app=mlb][data-skin] .pk,html[data-app=fut][data-skin] .cuotasbox,html[data-app=mlb][data-skin] .vacio{-webkit-backdrop-filter:var(--x-blur);backdrop-filter:var(--x-blur)}

/* ---------- 2. hero de probabilidad (todos los temas) ---------- */
.ovaHero{position:relative;margin:8px 0 12px;padding:14px 10px 12px;border-radius:var(--r2);
 background:var(--x-herobg);border:1px solid var(--line2);overflow:hidden}
.ovaHero .row3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px}
.ovaHero .side{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.ovaHero .side .esc{width:46px;height:46px}
.ovaHero .side img.cr{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.ovaHero .side .ab{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.6px;color:var(--mut);
 max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovaHero .side .pc{font-family:var(--cond);font-weight:800;font-size:clamp(20px,6.6vw,26px);line-height:1;white-space:nowrap;color:var(--txt);
 font-variant-numeric:tabular-nums}
.ovaHero .side.fav .pc{color:var(--hot)}
.ovaHero .gz{position:relative;width:124px;height:72px}
.ovaHero .gz svg{width:100%;height:auto}
.ovaHero svg{display:block;overflow:visible}
.ovaHero .tr{fill:none;stroke:var(--line2);stroke-width:10}
.ovaHero .sg{fill:none;stroke-width:10;transition:stroke-dasharray 1s cubic-bezier(.16,1,.3,1),stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)}
.ovaHero .sg.fv{stroke:var(--hot)}
.ovaHero .sg.ot{stroke:var(--mut2)}
.ovaHero .sg.dr{stroke:var(--mut2)}
.ovaHero .sg.aw{stroke:var(--acc)}
.ovaHero .cx{position:absolute;left:0;right:0;bottom:2px;text-align:center;line-height:1.1}
.ovaHero .cx small{display:block;font-size:10px;color:var(--mut);letter-spacing:.2px}
.ovaHero .cx b{font-family:var(--cond);font-size:19px;font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums}
.ovaHero .cap{margin-top:8px;text-align:center;font-size:12px;color:var(--mut);line-height:1.4}
.ovaHero .cap b{color:var(--txt);font-weight:600}
.ovaHero.fut .gz{width:112px;height:112px}
.ovaHero.fut .cx{bottom:auto;top:50%;transform:translateY(-50%)}
.ovaHero.fut .cx b{font-size:17px}
@media (prefers-reduced-motion:reduce){.ovaHero .sg{transition:none}}
html[data-app=mlb] .tab[data-t="v"] .ovaHero ~ .bar{display:none}
html[data-app=fut] .pane .ovaHero ~ .bar{display:none}

/* ---------- 3. selector de tema ---------- */
.ovaSkins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.ovaSk{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;text-align:left;
 background:transparent;border:2px solid var(--line2);border-radius:14px;overflow:hidden;
 color:var(--txt);font-family:var(--body,system-ui);cursor:pointer;min-height:0}
.ovaSk[aria-pressed="true"]{border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.ovaSk .pv{display:block;height:64px;padding:9px 10px;position:relative}
.ovaSk .pv i{display:block;height:8px;border-radius:4px;margin-bottom:6px}
.ovaSk .pv i:nth-child(1){width:62%}
.ovaSk .pv i:nth-child(2){width:38%;opacity:.85}
.ovaSk .pv em{position:absolute;right:10px;bottom:9px;width:22px;height:22px;border-radius:50%}
.ovaSk .tx{display:block;padding:8px 10px 9px;background:var(--bg2)}
.ovaSk .tx b{display:block;font-size:13.5px;font-weight:700;color:var(--txt)}
.ovaSk .tx span{display:block;font-size:11px;color:var(--mut);margin-top:1px;line-height:1.3}
.ovaSheet{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;background:rgba(0,0,0,.55)}
.ovaSheet.on{display:flex}
.ovaSheet .card{width:100%;max-height:82vh;overflow:auto;background:var(--bg1);border-top:1px solid var(--line2);
 border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.ovaSheet .card h2{margin:2px 0 2px;font-size:18px;font-family:var(--cond)}
.ovaSheet .card p{margin:0 0 4px;font-size:12px;color:var(--mut)}
.ovaApar{padding-top:14px}
.ovaApar h2{font-size:19px;margin:0 0 2px;font-weight:600;font-family:var(--cond)}
.ovaApar p{margin:0;font-size:12.5px;color:var(--mut)}

/* ---------- 4. pantalla Combo (MLB) ---------- */
.ovaCombo h2{font-size:19px;margin:4px 0 4px;font-weight:600;font-family:var(--cond)}
.ovaCombo .leg{background:var(--bg2);border-radius:var(--r);padding:10px;margin:8px 0;display:grid;
 grid-template-columns:1fr 1fr;gap:7px}
.ovaCombo .leg .t{grid-column:1/-1;font-size:11.5px;color:var(--mut);font-weight:600}
.ovaCombo .leg select,.ovaCombo .leg input{width:100%}
.ovaCombo .pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ovaCombo .pay label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.ovaCombo .pay input{width:100%}
.ovaCombo .res{margin-top:12px}
.ovaCombo .big{font-family:var(--cond);font-size:36px;font-weight:800;line-height:1;color:var(--hot);
 font-variant-numeric:tabular-nums}
.ovaCombo .cmpg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.ovaCombo .cmpg div{background:var(--bg2);border-radius:var(--r);padding:10px 8px;text-align:center}
.ovaCombo .cmpg b{display:block;font-family:var(--cond);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.ovaCombo .cmpg span{display:block;font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.3}
.ovaCombo .cmpg .good b{color:var(--good)}
.ovaCombo .cmpg .bad b{color:var(--bad)}
.ovaDO table{margin-top:4px}

/* ============ TEMA: ORO NEGRO ============ */
html[data-skin=oro]{
 color-scheme:dark;
 --bg:#0A0908;--bg1:#13110D;--bg2:#1B1812;--bg3:#25211A;
 --line:#2A241B;--line2:#43381F;
 --txt:#F7F2E7;--mut:#CBBFA5;--mut2:#A09472;
 --acc:#C9A24A;--acc2:#E6C874;--accTx:#1A1305;
 --hot:#F0CE6B;--hotTx:#1A1305;
 --good:#6FD39A;--bad:#F08A78;--info:#C9A24A;--ia:#7DD3E0;
 --cond:'Playfair Display',Georgia,'Times New Roman',serif;
 --body:'Inter',system-ui,-apple-system,sans-serif;--mono:'Inter',system-ui,sans-serif;
 --r:6px;--r2:12px;
 --x-topbg:rgba(10,9,8,.94);--x-navbg:rgba(10,9,8,.96);--x-fhead:#0A0908;
 --x-errbg:#2A1614;--x-errbd:#5A2B25;--x-errb:#F5B5A9;
 --x-okbg:#15251A;--x-oktx:#8FE0AE;--x-flbg:#2B1815;--x-fltx:#F1A99B;
 --x-pvbg:#14241A;--x-pvbd:#2D5138;--x-teqon:#2A2314;
 --x-iabg:#10222A;--x-iabd:#1F4652;
 --x-glow:rgba(201,162,74,.10);--x-headglow:rgba(201,162,74,.30);
 --x-lead:linear-gradient(90deg,#B8893A,#F0CE6B);--x-leadglow:rgba(240,206,107,.45);
 --x-shadow:0 0 0 1px rgba(201,162,74,.10),0 26px 50px -24px rgba(0,0,0,.95);
 --x-tabtx:#1A1305;--x-atx:#1A1305;
 --x-goodbg:linear-gradient(135deg,rgba(111,211,154,.14),rgba(111,211,154,.03));--x-goodbd:rgba(111,211,154,.35);
 --x-warnbg:rgba(240,206,107,.08);
 --x-herobg:radial-gradient(120% 90% at 50% 0%,rgba(201,162,74,.16),transparent 62%),linear-gradient(180deg,var(--bg2),var(--bg1));
 --x-stbg:var(--bg1);--x-cabbg:var(--bg2);--x-blur:none;--x-onhead:#F0CE6B;
 --x-fixed:radial-gradient(90% 55% at 50% -12%,rgba(201,162,74,.12),transparent 62%);
}
html[data-skin=oro] .brand,html[data-skin=oro] header h1{letter-spacing:6px;font-weight:700}
html[data-skin=oro] h3{border-bottom:1px solid rgba(201,162,74,.55)}
html[data-skin=oro] .kpi b,html[data-skin=oro] .bar span,html[data-skin=oro] .match,html[data-skin=oro] .pct,
html[data-skin=oro] .ovaHero .pc,html[data-skin=oro] .ovaHero .cx b{font-variant-numeric:lining-nums tabular-nums}
html[data-skin=oro] .match{font-weight:700}
html[data-skin=oro] button:not(.ghost):not(.teq):not(.tb):not(.tbar-btn):not(.ovaSk):not(.diaBtn):not(.btnChico):not(.fab):not([data-p]),
html[data-skin=oro] .btnAncho:not(.sec){background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--accTx)}
html[data-skin=oro] .tb.on,html[data-skin=oro] .diaBtn.on{background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--accTx)}
html[data-skin=oro] .game.open{border-color:var(--acc)}
html[data-skin=oro] .pick{border-left-color:var(--acc)}
html[data-skin=oro] .ovaHero{border-color:rgba(201,162,74,.4)}

/* ============ TEMA: NEON ============ */
html[data-skin=neon]{
 color-scheme:dark;
 --bg:#07060F;--bg1:#0E0B1F;--bg2:#161231;--bg3:#1F1A44;
 --line:#241E4A;--line2:#3D3280;
 --txt:#F5F3FF;--mut:#BDB6EC;--mut2:#8E86C8;
 --acc:#19E3FF;--acc2:#6BF0FF;--accTx:#00141A;
 --hot:#FF4FD0;--hotTx:#1D0018;
 --good:#3DFFB4;--bad:#FF6B86;--info:#19E3FF;--ia:#19E3FF;
 --cond:'Rajdhani','Arial Narrow',system-ui,sans-serif;
 --body:'Inter',system-ui,-apple-system,sans-serif;--mono:'Rajdhani','Inter',system-ui,sans-serif;
 --r:10px;--r2:16px;
 --x-topbg:rgba(7,6,15,.88);--x-navbg:rgba(9,7,22,.92);--x-fhead:#07060F;
 --x-errbg:#2B0F22;--x-errbd:#6B1F55;--x-errb:#FFB0C6;
 --x-okbg:#0B2A22;--x-oktx:#6FFFCB;--x-flbg:#2E1030;--x-fltx:#FFA1D6;
 --x-pvbg:#0B2A22;--x-pvbd:#1C7A5C;--x-teqon:#0B2A38;
 --x-iabg:#08262E;--x-iabd:#0F6F80;
 --x-glow:rgba(25,227,255,.13);--x-headglow:rgba(255,79,208,.40);
 --x-lead:linear-gradient(90deg,#B4149A,#FF4FD0);--x-leadglow:rgba(255,79,208,.6);
 --x-shadow:0 0 0 1px rgba(25,227,255,.10),0 0 34px -12px rgba(25,227,255,.35),0 24px 48px -22px rgba(0,0,0,.95);
 --x-tabtx:#00141A;--x-atx:#00141A;
 --x-goodbg:linear-gradient(135deg,rgba(61,255,180,.14),rgba(61,255,180,.03));--x-goodbd:rgba(61,255,180,.4);
 --x-warnbg:rgba(255,79,208,.10);
 --x-herobg:radial-gradient(120% 100% at 50% 0%,rgba(255,79,208,.20),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg1));
 --x-stbg:var(--bg1);--x-cabbg:var(--bg2);--x-blur:none;--x-onhead:#FF7FE0;
 --x-fixed:linear-gradient(rgba(25,227,255,.045) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(25,227,255,.045) 1px,transparent 1px) 0 0/34px 34px,radial-gradient(80% 50% at 85% 0%,rgba(255,79,208,.16),transparent 60%),radial-gradient(70% 45% at 0% 100%,rgba(25,227,255,.12),transparent 60%);
}
html[data-skin=neon] .brand,html[data-skin=neon] header h1{text-shadow:0 0 18px rgba(25,227,255,.7);letter-spacing:5px}
html[data-skin=neon] .match{font-weight:700;font-size:24px}
html[data-skin=neon] .kpi b{font-size:28px}
html[data-skin=neon] .bar span{font-size:19px}
html[data-skin=neon] .game.open{border-color:var(--acc);box-shadow:0 0 30px -8px rgba(25,227,255,.55),0 24px 48px -22px rgba(0,0,0,.95)}
html[data-skin=neon] .tb.on,html[data-skin=neon] .diaBtn.on{box-shadow:0 0 16px -2px rgba(25,227,255,.7)}
html[data-skin=neon] .ovaHero .sg.fv{filter:drop-shadow(0 0 6px rgba(255,79,208,.9))}
html[data-skin=neon] .ovaHero{border-color:rgba(25,227,255,.35)}
html[data-skin=neon] h3{border-bottom-color:rgba(25,227,255,.35)}
html[data-skin=neon] .pick{border-left-color:var(--hot)}

/* ============ TEMA: DIA DE JUEGO (claro, se lee al sol) ============ */
html[data-skin=dia]{
 color-scheme:light;
 --x-chip:#FFFFFF;
 --bg:#EAF0F7;--bg1:#FFFFFF;--bg2:#F0F4FA;--bg3:#E2E9F3;
 --line:#E0E7F1;--line2:#C3D0E1;
 --txt:#0E1A2C;--mut:#3F5068;--mut2:#56677F;
 --acc:#1D4ED8;--acc2:#3B6BF0;--accTx:#FFFFFF;
 --hot:#9A4406;--hotTx:#FFFFFF;
 --good:#0B7A52;--bad:#C0362C;--info:#1D4ED8;--ia:#0E7490;
 --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;

<script>
(function(){

 var F={

 };
 window.__ovaFont=function(id){
  if(!F[id]||document.getElementById('ovaFont-'+id)) return;
  var l=document.createElement('link');
  l.id='ovaFont-'+id; l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?'+F[id]+'&display=swap';

 };

  if(s&&F[s]){ d.setAttribute('data-skin',s); window.__ovaFont(s); }

<script>
/* OVA · administrador de temas (v44). Se guarda en localStorage 'ova_skin' y lo comparten
   las paginas del mismo sitio (MLB, futbol). Noche = sin atributo = como siempre. */
(function(){
 if(window.OVASkins) return;
 var SK=[
  {id:'noche',n:'Noche de estadio',d:'Azul medianoche y ámbar',bg:'#070B12',card:'#0D1420',acc:'#3B82F6',hot:'#FBBF24'},
  {id:'oro',n:'Oro negro',d:'Negro cálido, dorado, serif',bg:'#0A0908',card:'#1B1812',acc:'#C9A24A',hot:'#F0CE6B'},
  {id:'neon',n:'Neón',d:'Cian y magenta sobre violeta',bg:'linear-gradient(135deg,#0E0B1F,#1F1A44)',card:'#161231',acc:'#19E3FF',hot:'#FF4FD0'},
  {id:'dia',n:'Día de juego',d:'Claro, se lee con sol',bg:'#EAF0F7',card:'#FFFFFF',acc:'#1D4ED8',hot:'#B45309'},
  {id:'campo',n:'Campo',d:'Verde césped y tiza',bg:'linear-gradient(135deg,#05130A,#10301D)',card:'#10301D',acc:'#3DDC84',hot:'#F2EA6B'},
  {id:'cristal',n:'Cristal',d:'Vidrio esmerilado, aurora',bg:'linear-gradient(135deg,#3B3F9E,#0A0C1C 55%,#0F6F66)',card:'rgba(255,255,255,.18)',acc:'#8E96FF',hot:'#FFC27A'}
 ];
 function meta(){
  var m=document.querySelector('meta[name=theme-color]');
  if(!m){ m=document.createElement('meta'); m.name='theme-color'; document.head.appendChild(m); }
  return m;
 }
 function get(){ try{ return localStorage.getItem('ova_skin')||'noche'; }catch(e){ return 'noche'; } }
 function find(id){ for(var i=0;i<SK.length;i++) if(SK[i].id===id) return SK[i]; return SK[0]; }
 function marcar(){
  var cur=get();
  var bs=document.querySelectorAll('.ovaSk');
  for(var i=0;i<bs.length;i++) bs[i].setAttribute('aria-pressed', bs[i].getAttribute('data-sk')===cur?'true':'false');
 }
 function apply(id){
  var s=find(id), d=document.documentElement;
  if(s.id==='noche') d.removeAttribute('data-skin');
  else { d.setAttribute('data-skin',s.id); if(window.__ovaFont) window.__ovaFont(s.id); }
  try{ localStorage.setItem('ova_skin',s.id); }catch(e){}
  var c=s.bg; if(c.indexOf('#')!==0) c={neon:'#0E0B1F',campo:'#05130A',cristal:'#0A0C1C'}[s.id]||'#070B12';
  meta().setAttribute('content',c);
  marcar();
 }
 function mount(box){
  if(!box) return;
  var g=document.createElement('div'); g.className='ovaSkins';
  var h='';
  for(var i=0;i<SK.length;i++){
   var s=SK[i];
   h+='<button type="button" class="ovaSk" data-sk="'+s.id+'" aria-pressed="false">'+
    '<span class="pv" style="background:'+s.bg+'"><i style="background:'+s.acc+'"></i><i style="background:'+s.hot+'"></i>'+
    '<em style="background:'+s.card+';border:2px solid '+s.acc+'"></em></span>'+
    '<span class="tx"><b>'+s.n+'</b><span>'+s.d+'</span></span></button>';
  }
  g.innerHTML=h;
  g.addEventListener('click',function(e){
   var b=e.target.closest?e.target.closest('.ovaSk'):null;
   if(b) apply(b.getAttribute('data-sk'));
  });
  box.appendChild(g);
  marcar();
 }
 window.OVASkins={list:SK,apply:apply,get:get,mount:mount,marcar:marcar};
 apply(get());
})();

</script>
<script>
/* OVA Hub · temas v44 */
(function(){
 function init(){
  var g=document.querySelector('.grid'); if(!g||document.querySelector('.ovaApar')||!window.OVASkins) return;
  var box=document.createElement('div'); box.className='ovaApar';
  box.style.cssText='width:100%;max-width:420px;margin-top:30px';
  box.innerHTML='<h2>Apariencia</h2><p>Toca un tema para verlo al instante. Vale para MLB y fútbol también.</p>';
  g.parentNode.insertBefore(box,g.nextSibling);
  OVASkins.mount(box);
 }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();

</script>
