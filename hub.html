<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVA — Elige tu deporte</title>
<style>
:root{
 --bg:#070B12;--bg1:#0D1420;--bg2:#131D2C;--bg3:#1B2838;
 --line:#1C2838;--line2:#2A3E56;
 --txt:#F1F5FB;--mut:#9DB2C8;--mut2:#6D8299;
 --acc:#3B82F6;--acc2:#60A5FA;--accTx:#020509;
 --hot:#FBBF24;--hotTx:#1A1305;
 --good:#34D399;
 --r:12px;--r2:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);
 font-family:system-ui,-apple-system,sans-serif;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.brand{font-size:15px;letter-spacing:5px;color:var(--mut2);font-weight:700;margin-bottom:6px}
h1{font-size:26px;margin:0 0 34px;font-weight:800;text-align:center}
.grid{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.card{position:relative;background:var(--bg1);border:1px solid var(--line2);border-radius:var(--r2);
 padding:22px 20px;display:flex;align-items:center;gap:18px;text-decoration:none;color:var(--txt);
 overflow:hidden;transition:transform .15s ease, border-color .2s ease;
 box-shadow:0 1px 3px rgba(0,0,0,.4),0 20px 40px -18px rgba(0,0,0,.7)}
.card:active{transform:scale(.97)}
.card.on{border-color:var(--line2)}
.card.off{opacity:.55;pointer-events:none}
.glow{position:absolute;top:-40%;right:-20%;width:70%;height:180%;border-radius:50%;
 pointer-events:none;filter:blur(10px);opacity:.5}
.mlb .glow{background:radial-gradient(circle,rgba(59,130,246,.35),transparent 70%)}
.fut .glow{background:radial-gradient(circle,rgba(52,211,153,.3),transparent 70%)}
.nba .glow{background:radial-gradient(circle,rgba(251,191,36,.25),transparent 70%)}
.ico{font-size:34px;flex:0 0 auto;position:relative;z-index:1}
.txt{position:relative;z-index:1;flex:1}
.txt b{display:block;font-size:18px;font-weight:800;margin-bottom:2px}
.txt span{font-size:12.5px;color:var(--mut)}
.badge{position:relative;z-index:1;font-size:10.5px;font-weight:700;color:var(--mut2);
 background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:4px 10px;
 white-space:nowrap}
.arrow{position:relative;z-index:1;color:var(--mut2);font-size:18px}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ico{animation:flota 3.2s ease-in-out infinite}
.fut .ico{animation-delay:.3s}
.nba .ico{animation-delay:.6s}
@media (prefers-reduced-motion:reduce){.ico{animation:none}}
</style>
</head>
<body>
<div class="brand">O V A</div>
<h1>¿Qué deporte hoy?</h1>
<div class="grid">
 <a class="card mlb on" href="index.html">
  <div class="glow"></div>
  <div class="ico">⚾</div>
  <div class="txt"><b>MLB</b><span>Modelo completo — ganador, total, hándicap y más</span></div>
  <div class="arrow">›</div>
 </a>
 <a class="card fut on" href="futbol.html">
  <div class="glow"></div>
  <div class="ico">⚽</div>
  <div class="txt"><b>Fútbol</b><span>Top 5 ligas + Champions League</span></div>
  <div class="arrow">›</div>
 </a>
 <div class="card nba off">
  <div class="glow"></div>
  <div class="ico">🏀</div>
  <div class="txt"><b>NBA</b><span>En construcción</span></div>
  <div class="badge">Próximamente</div>
 </div>
</div>
</body>
</html>
