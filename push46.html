Object.keys(PACKS).forEach(function(k){ PACKS[k].head=PACKS[k].head.split('/*__CSS__*/').join(CSS); });
var $=function(i){return document.getElementById(i);};
var LOG=$('log');
function say(t,c){ var s=document.createElement('span'); if(c) s.className=c; s.textContent=t+'\n'; LOG.appendChild(s); }
function limpiar(){ LOG.textContent=''; }
try{ var t0=localStorage.getItem('ova_gh_token'); if(t0) $('tok').value=t0; }catch(e){}
function b64dec(b64){ var bin=atob(b64.replace(/\s/g,'')), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder('utf-8').decode(u); }
function b64enc(str){ var u=new TextEncoder().encode(str), s='', N=0x8000; for(var i=0;i<u.length;i+=N) s+=String.fromCharCode.apply(null,u.subarray(i,i+N)); return btoa(s); }
function gh(path,opt){
  opt=opt||{}; var h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+$('tok').value.trim()};
  if(opt.body) h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+$('repo').value.trim()+'/contents/'+path+(opt.q||''),{method:opt.method||'GET',headers:h,body:opt.body,cache:'no-store'}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok) throw new Error('GitHub dijo '+r.status+(j&&j.message?' — '+j.message:'')); return j; });
  });
}
function bajar(path){ return gh(path,{q:'?t='+Date.now()}).then(function(j){ if(!j.content) throw new Error(path+': GitHub no devolvió el contenido (¿archivo muy grande?)'); return {sha:j.sha,texto:b64dec(j.content)}; }); }
function pngOk(b64){ var s=atob(b64.slice(0,16)); return s.charCodeAt(0)===137&&s.slice(1,4)==='PNG'; }
function revisarEstaticos(){
  STATIC.forEach(function(s){
    if(s.text){ try{ var m=JSON.parse(s.text); if(!m.icons||!m.start_url) throw 0; }catch(e){ throw new Error(s.path+': no es un manifiesto válido'); } }
    else if(!pngOk(s.b64)) throw new Error(s.path+': el icono no es un PNG válido');
  });

}
function subirEstatico(s){
  return gh(s.path,{q:'?t='+Date.now()}).then(function(j){ return j.sha; },function(e){ if(/404/.test(e.message)) return null; throw e; }).then(function(sha){
    var body={message:'v45: archivos para instalar OVA como app',content:s.b64||b64enc(s.text)}; if(sha) body.sha=sha;
    return gh(s.path,{method:'PUT',body:JSON.stringify(body)});
  });
}
var JOBS=[
 {id:'fmlb',app:'mlb',marca:['function detalle(','function pintar(','function actualizarRanking(','function regLeer('],nombre:'MLB'}
];
function preparar(job){
  var path=$(job.id).value.trim();
  say('· '+job.nombre+' ('+path+'): bajando…');
  return bajar(path).then(function(f){
    job.path=path; job.sha=f.sha; job.orig=f.texto;
    var falta=job.marca.filter(function(m){ return f.texto.indexOf(m)<0; });
    if(falta.length) throw new Error(path+' no parece el archivo de '+job.nombre+' (le falta '+falta[0]+'). No toqué nada.');
    job.nuevo=OVAPatch.aplicar(f.texto,PACKS[job.app]);
    var p=OVAPatch.verificar(job.nuevo,job.marca);
    if(p.length) throw new Error(job.nombre+': la revisión falló → '+p.join(' | '));
    if(job.nuevo.length<=OVAPatch.quitar(f.texto).length) throw new Error(job.nombre+': el resultado no creció; algo raro.');
    var unico=[['rel="manifest"','manifest'],['rel="apple-touch-icon"','icono'],['apple-mobile-web-app-status-bar-style','barra de estado'],['apple-mobile-web-app-capable','modo app']];
    unico.forEach(function(u){ var n=job.nuevo.split(u[0]).length-1; if(n!==1) throw new Error(job.nombre+': la etiqueta de '+u[1]+' aparece '+n+' veces (debe ser 1)'); });
    say('  ✓ '+job.nombre+' revisado: '+f.texto.length.toLocaleString()+' → '+job.nuevo.length.toLocaleString()+' caracteres, todos los scripts compilan','ok');
  });
}
function subir(job,texto,msg){
  return gh(job.path,{method:'PUT',body:JSON.stringify({message:msg,content:b64enc(texto),sha:job.sha})}).then(function(r){ job.sha=r.content&&r.content.sha; });
}
$('go').onclick=function(){
  var b=$('go'); if(!$('tok').value.trim()){ limpiar(); say('Falta el token.','mal'); return; }
  try{ localStorage.setItem('ova_gh_token',$('tok').value.trim()); }catch(e){}
  b.disabled=true; limpiar(); say('Paso 1 de 2: bajar y revisar (todavía no se sube nada)');
  var MSG={mlb:'v46: picks que se cierran solos (MLB)'};
  var cad=Promise.resolve();
  JOBS.forEach(function(j){ cad=cad.then(function(){ return preparar(j); }); });
  cad.then(function(){ revisarEstaticos(); }).then(function(){
    say('\nPaso 2 de 2: todo salió bien, subiendo…');
    try{ JOBS.forEach(function(j){ if(j.orig.indexOf('<!--OVA')<0 || !localStorage.getItem('ova_bak46_'+j.id)) localStorage.setItem('ova_bak46_'+j.id,j.orig); }); }catch(e){ say('  (no pude guardar la copia de respaldo en el teléfono; GitHub igual guarda el historial)','av'); }
    var up=Promise.resolve();
    STATIC.forEach(function(s){ up=up.then(function(){ return subirEstatico(s); }).then(function(){ say('  ✓ '+s.path+' subido','ok'); }); });
    JOBS.forEach(function(j){ up=up.then(function(){ return subir(j,j.nuevo,MSG[j.app]); }).then(function(){ say('  ✓ '+j.path+' subido','ok'); }); });
    return up;
  }).then(function(){
    say('\n✔ Listo. Espera 1 o 2 minutos a que GitHub Pages lo publique y abre:\n  …/ODDX/index.html?v=46\n\nAbre MLB → Mis picks. Si tienes picks abiertos, se cierran solos; también está el botón «Cerrar picks solos».','ok');
  }).catch(function(e){ say('\n✗ '+e.message,'mal'); say('No se subió nada que estuviera mal.','av'); }).then(function(){ b.disabled=false; });
};
$('undo').onclick=function(){
  var b=$('undo'); b.disabled=true; limpiar(); say('Volviendo a la versión anterior…');
  var hechos=JOBS.map(function(j){ return {j:j,bak:(function(){ try{ return localStorage.getItem('ova_bak46_'+j.id); }catch(e){ return null; } })()}; });
  if(hechos.some(function(h){ return !h.bak; })){ say('No tengo la copia guardada en este teléfono. Usa el historial de GitHub (Commits → Revert).','mal'); b.disabled=false; return; }
  var chain=Promise.resolve();
  hechos.forEach(function(h){ chain=chain.then(function(){ h.j.path=$(h.j.id).value.trim(); return gh(h.j.path,{q:'?t='+Date.now()}).then(function(f){ h.j.sha=f.sha; return subir(h.j,h.bak,'Volver a la versión anterior al parche'); }).then(function(){ say('  ✓ '+h.j.path+' restaurado','ok'); }); }); });
  chain.then(function(){ say('\n✔ MLB volvió a la versión anterior.','ok'); }).catch(function(e){ say('✗ '+e.message,'mal'); }).then(function(){ b.disabled=false; });
};
