<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspector OVA 6 — nav</title>
<style>
body{font-family:system-ui,sans-serif;background:#070B12;color:#F1F5FB;padding:20px;line-height:1.5}
button{background:#3B82F6;color:#020509;border:0;border-radius:8px;padding:14px 20px;
 font-size:16px;font-weight:700;width:100%;margin:10px 0;cursor:pointer}
pre{background:#131D2C;padding:10px;border-radius:8px;overflow-x:auto;font-size:10.5px;
 white-space:pre-wrap;max-height:75vh;overflow-y:auto}
</style>
</head>
<body>
<h2>Inspector 6 — barra de navegación</h2>
<button id="ir">Buscar</button>
<pre id="log">Esperando...</pre>
<script>
var log=document.getElementById('log');
function w(t){ log.textContent+='\n'+t; }

document.getElementById('ir').addEventListener('click',function(){
  log.textContent='Bajando...';
  fetch('https://api.github.com/repos/osvaldoalvarez0113-source/ODDX/contents/index.html',
    {headers:{'Accept':'application/vnd.github.raw+json'}})
  .then(function(r){ return r.text(); })
  .then(function(html){
    w('Archivo: '+html.length+' caracteres.\n');

    function bloque(nombre, buscar, antes, despues, ocurrencia){
      ocurrencia = ocurrencia||0;
      var i=-1, pos=-1;
      for(var k=0;k<=ocurrencia;k++){ i=html.indexOf(buscar,pos+1); if(i===-1)break; pos=i; }
      if(i===-1){ w('\n=== '+nombre+' === NO ENCONTRADO'); return; }
      w('\n=== '+nombre+' ===');
      w(html.slice(Math.max(0,i-(antes||0)), i+(despues||900)));
    }

    // HTML de la barra inferior (busca "Juegos" que es el primer boton)
    bloque('HTML barra inferior (Juegos)', '>Juegos<', 400, 700);

    // JS que cambia de pestaña - busca "Ajustes" en un addEventListener o data-tab
    bloque('data-tab o nav click handler', 'data-tab', 100, 800);

    // Busca la funcion que muestra/oculta secciones principales
    bloque('funcion mostrarSeccion o similar', 'function mostrarSeccion(', 0, 700);
    bloque('funcion cambiarTab o similar', 'function cambiarTab(', 0, 700);

    // Busca el contenedor de "Ajustes" para ver su estructura como referencia
    bloque('seccion Ajustes (id)', 'id="ajustes"', 200, 500);
  }).catch(function(e){ w('Error: '+e.message); });
});
</script>
</body>
</html>
