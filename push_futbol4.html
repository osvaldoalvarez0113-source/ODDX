var CONTENIDO = "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>F\u00fatbol \u2014 OVA</title>\n<style>\n:root{\n --bg:#070B12;--bg1:#0D1420;--bg2:#131D2C;--bg3:#1B2838;\n --line:#1C2838;--line2:#2A3E56;\n --txt:#F1F5FB;--mut:#9DB2C8;--mut2:#6D8299;\n --acc:#3B82F6;--acc2:#60A5FA;--accTx:#020509;\n --hot:#FBBF24;--hotTx:#1A1305;\n --good:#34D399;--bad:#F87171;\n --r:10px;--r2:18px;\n --cond:system-ui,sans-serif;\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);\n padding-bottom:40px}\nheader{padding:16px 14px 8px;position:sticky;top:0;background:var(--bg);z-index:9;\n border-bottom:1px solid var(--line)}\nheader .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}\nheader h1{font-size:20px;margin:0;font-weight:800;letter-spacing:2px}\nselect#ligaSel{background:var(--bg2);border:1px solid var(--line2);color:var(--txt);\n border-radius:20px;padding:7px 12px;font-size:12.5px;flex:1;min-width:130px;-webkit-appearance:none}\n.tabs{display:flex;gap:6px}\n.tb{flex:1;background:var(--bg2);color:var(--mut);border:0;border-radius:9px;padding:9px 8px;\n font-size:12.5px;font-weight:700;cursor:pointer}\n.tb.on{background:var(--acc);color:var(--accTx)}\nmain{padding:0 14px}\n.vista{display:none}\n.vista.on{display:block}\n.estado{font-size:12.5px;color:var(--mut);margin:12px 2px}\n.estado.ok{color:var(--good)}\n.estado.bad{color:var(--bad)}\n\n.game{background:var(--bg1);border:1px solid var(--line2);border-radius:var(--r2);\n margin:12px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.4),0 20px 40px -18px rgba(0,0,0,.7)}\n.head{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer}\n.crestpair{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}\n.eq{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;min-width:0}\n.eq img{width:24px;height:24px;object-fit:contain;background:#fff;border-radius:5px;flex:0 0 auto}\n.eq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.hora{font-size:11.5px;color:var(--mut);background:var(--bg2);border:1px solid var(--line2);\n border-radius:20px;padding:5px 10px;flex:0 0 auto;white-space:nowrap}\n.chev{color:var(--mut2);font-size:18px;flex:0 0 auto;transition:transform .2s}\n.game.open .chev{transform:rotate(180deg)}\n.body{display:none;padding:0 14px 16px}\n.game.open .body{display:block}\n\n.egol{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:4px 0}\n.egol b{color:var(--txt)}\n.bar{height:38px;display:flex;border-radius:12px;overflow:hidden;background:var(--bg2);\n margin:12px 0;border:1px solid var(--line2)}\n.bar span{display:flex;align-items:center;justify-content:center;font-family:var(--cond);\n font-size:13.5px;font-weight:800;transition:flex-grow .5s}\n.bar .h{background:linear-gradient(90deg,#D89626,var(--hot));color:var(--hotTx)}\n.bar .d{background:var(--bg3);color:var(--mut)}\n.bar .a{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}\n\n.pick{border-left:3px solid var(--good);background:linear-gradient(135deg,rgba(52,211,153,.16),rgba(52,211,153,.04));\n border-radius:0 var(--r) var(--r) 0;padding:11px 13px;margin:10px 0;font-size:13px}\n.pick b{display:block;color:var(--good);font-size:14.5px;margin-bottom:2px}\n.pick.no{border-left-color:var(--line2);background:var(--bg2)}\n.pick.no b{color:var(--mut)}\n\n.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}\n.kpi div{background:var(--bg2);border-radius:var(--r);padding:10px;text-align:center}\n.kpi b{display:block;font-size:17px;font-weight:800;font-family:var(--cond)}\n.kpi small{color:var(--mut);font-size:10.5px}\n\nh3{font-size:11.5px;color:var(--mut);margin:16px 0 7px;font-weight:700;text-transform:uppercase;\n letter-spacing:.5px}\n.marcadores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}\n.marcadores div{background:var(--bg2);border-radius:var(--r);padding:8px 4px;text-align:center}\n.marcadores b{display:block;font-family:var(--cond);font-size:15px;font-weight:800}\n.marcadores small{color:var(--mut);font-size:10px}\n.lineas{display:flex;flex-direction:column;gap:6px}\n.linea{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);\n border-radius:var(--r);padding:8px 11px;font-size:12.5px}\n.linea b{font-family:var(--cond)}\n.nota{font-size:10.5px;color:var(--mut2);line-height:1.5;margin-top:12px}\n\n/* tabla de posiciones mini */\n.tabpos{width:100%;border-collapse:collapse;font-size:11.5px}\n.tabpos td{padding:6px 4px;border-bottom:1px solid var(--line)}\n.tabpos tr.destacada td{color:var(--hot);font-weight:700}\n.tabpos .num{color:var(--mut);width:20px}\n\n/* estadio */\n.estadio{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:var(--r);\n padding:10px 12px;font-size:12.5px;margin:6px 0}\n.estadio b{color:var(--txt)}\n\n/* forma (ultimos partidos) */\n.forma{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 12px}\n.forma span{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;\n font-size:10.5px;font-weight:800;color:#fff}\n.forma .V{background:var(--good)}\n.forma .E{background:var(--mut2)}\n.forma .D{background:var(--bad)}\n\n/* h2h */\n.h2h{display:flex;justify-content:space-around;text-align:center;background:var(--bg2);border-radius:var(--r);\n padding:10px;margin:6px 0}\n.h2h div b{display:block;font-size:18px;font-weight:800}\n.h2h div small{color:var(--mut);font-size:10px}\n\n/* noticias */\n.noticia{font-size:12px;color:var(--mut);padding:7px 0;border-bottom:1px solid var(--line)}\n.noticia:last-child{border-bottom:0}\n\n/* cuotas manuales */\n.cuotasbox{background:var(--bg2);border-radius:var(--r);padding:12px;margin:6px 0}\n.cuotasbox .fila{display:flex;gap:8px;margin-bottom:8px}\n.cuotasbox input{flex:1;background:var(--bg1);border:1px solid var(--line2);color:var(--txt);\n border-radius:8px;padding:9px;font-size:13px;text-align:center}\n.cuotasbox label{font-size:10.5px;color:var(--mut);display:block;margin-bottom:3px}\n.cuotasbox button{width:100%;background:var(--acc);color:var(--accTx);border:0;border-radius:8px;\n padding:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px}\n.veredictoCuota{margin-top:10px;font-size:12.5px}\n.veredictoCuota .si{color:var(--good);font-weight:700}\n.veredictoCuota .no{color:var(--mut)}\n\n.observ{background:var(--bg2);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--mut);\n margin:5px 0}\n.observ b{color:var(--txt)}\n\n/* ranking al gane */\n.fila-rank{display:flex;align-items:center;gap:10px;background:var(--bg1);border:1px solid var(--line2);\n border-radius:var(--r);padding:11px;margin:8px 0}\n.fila-rank .pos{color:var(--mut);font-size:12px;width:18px;flex:0 0 auto}\n.fila-rank img{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:5px}\n.fila-rank .nom{flex:1;font-size:13px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.fila-rank .pct{font-family:var(--cond);font-weight:800;font-size:15px;color:var(--hot)}\n</style>\n</head>\n<body>\n<header>\n <div class=\"top\">\n  <h1>\u26bd F\u00daTBOL</h1>\n  <select id=\"ligaSel\">\n   <option value=\"pl\">Premier League</option>\n   <option value=\"laliga\">La Liga</option>\n   <option value=\"seriea\">Serie A</option>\n   <option value=\"bundesliga\">Bundesliga</option>\n   <option value=\"ligue1\">Ligue 1</option>\n   <option value=\"cl\">Champions League</option>\n  </select>\n </div>\n <div class=\"tabs\">\n  <button class=\"tb on\" data-vista=\"juegos\">Juegos</button>\n  <button class=\"tb\" data-vista=\"algane\">Al gane</button>\n </div>\n</header>\n<main>\n <div class=\"estado\" id=\"estado\">Cargando...</div>\n\n <div class=\"vista on\" id=\"vistaJuegos\">\n  <div id=\"juegos\"></div>\n </div>\n\n <div class=\"vista\" id=\"vistaAlgane\">\n  <div id=\"algane\"></div>\n </div>\n</main>\n\n<script>\nvar EQUIPOS = null;\nvar PARTIDOS = null;\nvar LIGA_ACTUAL = null;\nvar CACHE_PERFIL = {};\n\nvar LIGAS = {\n  pl:  {nombre:'Premier League', url:'https://www.worldfootball.net/competition/co91/england-premier-league/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co91/england-premier-league/results-and-standings/'},\n  laliga: {nombre:'La Liga', url:'https://www.worldfootball.net/competition/co97/spain-primera-division/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co97/spain-primera-division/results-and-standings/'},\n  seriea: {nombre:'Serie A', url:'https://www.worldfootball.net/competition/co111/italy-serie-a/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co111/italy-serie-a/results-and-standings/'},\n  bundesliga: {nombre:'Bundesliga', url:'https://www.worldfootball.net/competition/co12/germany-bundesliga/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co12/germany-bundesliga/results-and-standings/'},\n  ligue1: {nombre:'Ligue 1', url:'https://www.worldfootball.net/competition/co71/france-ligue-1/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co71/france-ligue-1/results-and-standings/'},\n  cl: {nombre:'Champions League', url:'https://www.worldfootball.net/competition/co19/uefa-champions-league/results-and-standings/', urlPartidos:'https://www.worldfootball.net/competition/co19/uefa-champions-league/results-and-standings/'}\n};\n\n// ---------- tabla de posiciones ----------\nfunction extraerTabla(html){\n  var doc = new DOMParser().parseFromString(html, 'text/html');\n  var tablas = doc.querySelectorAll('table');\n  var mejor = null, mejorCuenta = 0;\n  tablas.forEach(function(t){\n    var cuenta = 0;\n    t.querySelectorAll('tr').forEach(function(f){ if(/\\d+\\s*:\\s*\\d+/.test(f.textContent)) cuenta++; });\n    if(cuenta > mejorCuenta){ mejorCuenta = cuenta; mejor = t; }\n  });\n  if(!mejor) return [];\n  var equipos = [];\n  mejor.querySelectorAll('tr').forEach(function(fila){\n    var celdas = fila.querySelectorAll('td');\n    if(celdas.length < 5) return;\n    var textoFila = Array.from(celdas).map(function(c){ return c.textContent.trim(); });\n    var links = fila.querySelectorAll('a');\n    var nombre = null, mejorLargo = 0, href = null;\n    links.forEach(function(a){\n      var t = a.textContent.trim();\n      if(t.length > mejorLargo && !/^\\d+$/.test(t)){ mejorLargo = t.length; nombre = t; href = a.getAttribute('href'); }\n    });\n    if(!nombre) return;\n    var marcador = null, idxMarcador = -1;\n    for(var i=0;i<textoFila.length;i++){\n      if(/^\\d+\\s*:\\s*\\d+$/.test(textoFila[i])){ marcador = textoFila[i]; idxMarcador = i; break; }\n    }\n    if(!marcador) return;\n    var partes = marcador.split(':').map(function(s){ return +s.trim(); });\n    var pj = null;\n    if(idxMarcador>=4){ var c=textoFila[idxMarcador-4]; if(/^\\d+$/.test(c)) pj = +c; }\n    if(!pj) return;\n    if(equipos.some(function(e){ return e.nombre===nombre; })) return;\n    equipos.push({nombre:nombre, pj:pj, gf:partes[0], gc:partes[1], href:href, pos:equipos.length+1});\n  });\n  return equipos;\n}\n\n// ---------- partidos por jugar ----------\nfunction extraerPartidos(html){\n  var doc = new DOMParser().parseFromString(html, 'text/html');\n  var enlaces = doc.querySelectorAll('a[href*=\"match-report\"]');\n  var vistos = {}, partidos = [];\n  enlaces.forEach(function(a){\n    var href = a.getAttribute('href');\n    if(vistos[href]) return;\n    vistos[href] = true;\n    var cont = a, escudos = [], intentos = 0;\n    while(cont && intentos < 6){\n      escudos = cont.querySelectorAll ? cont.querySelectorAll('img[src*=\"emblem\"]') : [];\n      if(escudos.length >= 2) break;\n      cont = cont.parentElement; intentos++;\n    }\n    if(!cont || escudos.length < 2) return;\n    var nombreLocal = escudos[0].getAttribute('alt') || escudos[0].getAttribute('title');\n    var nombreVisita = escudos[1].getAttribute('alt') || escudos[1].getAttribute('title');\n    if(!nombreLocal || !nombreVisita) return;\n    var texto = cont.textContent.replace(/\\s+/g,' ');\n    if(/Ended/i.test(texto)) return;\n    var horaM = texto.match(/\\b([01]?\\d|2[0-3]):([0-5]\\d)\\b/);\n    var hora = horaM ? horaM[0] : '';\n    var clave = nombreLocal+'|'+nombreVisita;\n    if(partidos.some(function(p){ return p.clave===clave; })) return;\n    partidos.push({\n      clave: clave, local: nombreLocal, visita: nombreVisita,\n      escudoLocal: escudos[0].src, escudoVisita: escudos[1].src,\n      hrefLocal: escudos[0].closest('a') ? escudos[0].closest('a').getAttribute('href') : null,\n      hrefVisita: escudos[1].closest('a') ? escudos[1].closest('a').getAttribute('href') : null,\n      hora: hora\n    });\n  });\n  return partidos.slice(0,15);\n}\n\n// ---------- perfil de un equipo (forma, estadio, goleador, noticias) ----------\nfunction extraerPerfil(html, nombrePropio){\n  var doc = new DOMParser().parseFromString(html, 'text/html');\n  var perfil = {estadio:null, capacidad:null, forma:[], goleador:null, noticias:[]};\n\n  // estadio / capacidad: texto plano del bloque \"Profile\"\n  var textoCompleto = doc.body.textContent;\n  var mEst = textoCompleto.match(/Stadium\\s*\\n?\\s*([^\\n]{3,60}?)\\s*\\n?\\s*Capacity/);\n  if(mEst) perfil.estadio = mEst[1].trim();\n  var mCap = textoCompleto.match(/Capacity\\s*\\n?\\s*([\\d.,]{3,10})/);\n  if(mCap) perfil.capacidad = mCap[1].trim();\n\n  // forma: bloques con 2 escudos + marcador + \"Ended\"\n  var enlaces = doc.querySelectorAll('a[href*=\"match-report\"]');\n  var vistos = {};\n  enlaces.forEach(function(a){\n    if(perfil.forma.length>=5) return;\n    var href = a.getAttribute('href');\n    if(vistos[href]) return; vistos[href]=true;\n    var cont = a, escudos = [], intentos=0;\n    while(cont && intentos<6){\n      escudos = cont.querySelectorAll ? cont.querySelectorAll('img[src*=\"emblem\"]') : [];\n      if(escudos.length>=2) break;\n      cont = cont.parentElement; intentos++;\n    }\n    if(!cont || escudos.length<2) return;\n    var texto = cont.textContent.replace(/\\s+/g,' ');\n    if(!/Ended/i.test(texto)) return;\n    var nums = texto.match(/\\b\\d+\\b/g);\n    if(!nums || nums.length<2) return;\n    var nomA = escudos[0].getAttribute('alt')||'';\n    var nomB = escudos[1].getAttribute('alt')||'';\n    // los primeros dos numeros grandes cerca del inicio suelen ser el marcador\n    var golA=null, golB=null;\n    for(var i=0;i<nums.length-1;i++){\n      if(+nums[i]<=15 && +nums[i+1]<=15){ golA=+nums[i]; golB=+nums[i+1]; break; }\n    }\n    if(golA===null) return;\n    var esLocal = nomA.indexOf(nombrePropio)>-1 || nombrePropio.indexOf(nomA)>-1;\n    var esVisita = nomB.indexOf(nombrePropio)>-1 || nombrePropio.indexOf(nomB)>-1;\n    if(!esLocal && !esVisita) return;\n    var propios = esLocal?golA:golB, rival = esLocal?golB:golA;\n    var res = propios>rival?'V':(propios===rival?'E':'D');\n    perfil.forma.push({res:res, rival: esLocal?nomB:nomA, marcador: propios+'-'+rival});\n  });\n\n  // goleador: primer enlace a /person/ dentro de una tabla con \"Topscorer\" cerca\n  var linkJugador = doc.querySelector('a[href*=\"/person/\"]');\n  if(linkJugador){\n    var fila = linkJugador.closest('tr');\n    if(fila){\n      var txt = fila.textContent.replace(/\\s+/g,' ').trim();\n      var m = txt.match(/([A-Z\u00c0-\u00dd][\\w\u00c0-\u00ff.'-]+(?:\\s+[A-Z\u00c0-\u00dda-z\u00e0-\u00ff.'-]+){0,3})/);\n      perfil.goleador = linkJugador.textContent.trim();\n    }\n  }\n\n  // noticias: enlaces a /news/\n  var vistosN = {};\n  doc.querySelectorAll('a[href*=\"/news/\"]').forEach(function(a){\n    if(perfil.noticias.length>=3) return;\n    var t = a.textContent.trim();\n    if(!t || t.length<12 || vistosN[t]) return;\n    vistosN[t]=true;\n    perfil.noticias.push(t);\n  });\n\n  return perfil;\n}\n\nfunction cargarPerfil(nombreEquipo, href){\n  if(CACHE_PERFIL[nombreEquipo]) return Promise.resolve(CACHE_PERFIL[nombreEquipo]);\n  if(!href) return Promise.resolve(null);\n  var url = href.indexOf('http')===0 ? href : 'https://www.worldfootball.net'+href;\n  return fetch(url+'?v='+Date.now()).then(function(r){ return r.text(); })\n    .then(function(html){\n      var p = extraerPerfil(html, nombreEquipo);\n      CACHE_PERFIL[nombreEquipo] = p;\n      return p;\n    }).catch(function(){ return null; });\n}\n\nfunction poissonProb(k,lambda){\n  var l=Math.exp(-lambda), num=1;\n  for(var i=1;i<=k;i++){ num*=lambda/i; }\n  return l*num;\n}\n\nfunction buscarEquipo(nombre){\n  if(!EQUIPOS) return null;\n  var e = EQUIPOS.find(function(x){ return x.nombre===nombre; });\n  if(e) return e;\n  return EQUIPOS.find(function(x){ return x.nombre.indexOf(nombre)>-1 || nombre.indexOf(x.nombre)>-1; }) || null;\n}\n\nfunction calcular(eL, eV){\n  var totalGF=0, totalPJ=0;\n  EQUIPOS.forEach(function(e){ totalGF+=e.gf; totalPJ+=e.pj; });\n  var ligaProm = totalGF / totalPJ;\n  var K = 6;\n  function gfAj(e){ return (e.gf + K*ligaProm) / (e.pj + K); }\n  function gcAj(e){ return (e.gc + K*ligaProm) / (e.pj + K); }\n  var HOME_ADV = 1.35;\n  var atkL = gfAj(eL)/ligaProm, defL = gcAj(eL)/ligaProm;\n  var atkV = gfAj(eV)/ligaProm, defV = gcAj(eV)/ligaProm;\n  var lamL = ligaProm*atkL*defV*HOME_ADV;\n  var lamV = ligaProm*atkV*defL/HOME_ADV;\n  var MAXG=8, pL=0,pD=0,pV=0,pBtts=0;\n  var overLin={1.5:0,2.5:0,3.5:0};\n  var marcadores=[];\n  for(var i=0;i<=MAXG;i++) for(var j=0;j<=MAXG;j++){\n    var p=poissonProb(i,lamL)*poissonProb(j,lamV);\n    if(i>j) pL+=p; else if(i===j) pD+=p; else pV+=p;\n    [1.5,2.5,3.5].forEach(function(lin){ if(i+j>lin) overLin[lin]+=p; });\n    if(i>=1&&j>=1) pBtts+=p;\n    marcadores.push({i:i,j:j,p:p});\n  }\n  var suma=pL+pD+pV; pL/=suma; pD/=suma; pV/=suma;\n  marcadores.sort(function(a,b){ return b.p-a.p; });\n  return {lamL:lamL, lamV:lamV, pL:pL, pD:pD, pV:pV, overLin:overLin, pBtts:pBtts, marcadores:marcadores};\n}\n\nfunction impProb(americana){\n  americana = +americana;\n  if(!americana) return null;\n  if(americana>0) return 100/(americana+100);\n  return -americana/(-americana+100);\n}\n\nfunction tablaPosicionesHtml(eL, eV){\n  var copia = EQUIPOS.slice().sort(function(a,b){ return b.pj===a.pj ? (b.gf-b.gc)-(a.gf-a.gc) : 0; });\n  // usar posicion real ya calculada al extraer\n  var ordenada = EQUIPOS.slice(0, EQUIPOS.length);\n  var html = '<table class=\"tabpos\">';\n  ordenada.forEach(function(e){\n    var destacada = (e.nombre===eL.nombre || e.nombre===eV.nombre);\n    html += '<tr'+(destacada?' class=\"destacada\"':'')+'><td class=\"num\">'+e.pos+'</td><td>'+e.nombre+\n      '</td><td>'+e.pj+'</td><td>'+e.gf+':'+e.gc+'</td></tr>';\n  });\n  html += '</table>';\n  return html;\n}\n\nfunction bloqueBase(eL, eV, nombreLmostrar, nombreVmostrar){\n  var r = calcular(eL, eV);\n  var favorito, favTxt;\n  var mejor = Math.max(r.pL, r.pD, r.pV);\n  if(mejor===r.pL){ favorito=nombreLmostrar; favTxt=(r.pL*100).toFixed(1)+'%'; }\n  else if(mejor===r.pV){ favorito=nombreVmostrar; favTxt=(r.pV*100).toFixed(1)+'%'; }\n  else { favorito=null; }\n\n  var pickHtml;\n  if(favorito && mejor>=0.45){\n    pickHtml = '<div class=\"pick\"><b>Favorito: '+favorito+'</b>'+favTxt+' de probabilidad \u2014 '+\n      (r.overLin[2.5]>=0.55?'tendencia a m\u00e1s de 2.5 goles':'partido m\u00e1s cerrado en goles')+'.</div>';\n  } else {\n    pickHtml = '<div class=\"pick no\"><b>Muy parejo</b>Ning\u00fan equipo pasa del 45% \u2014 no hay favorito claro.</div>';\n  }\n  var mHtml='';\n  r.marcadores.slice(0,6).forEach(function(m){\n    mHtml += '<div><b>'+m.i+'-'+m.j+'</b><small>'+(m.p*100).toFixed(1)+'%</small></div>';\n  });\n  var lHtml='';\n  [1.5,2.5,3.5].forEach(function(lin){\n    lHtml += '<div class=\"linea\"><span>M\u00e1s de '+lin+' goles</span><b>'+(r.overLin[lin]*100).toFixed(1)+'%</b></div>';\n  });\n\n  return {r:r, html:'' +\n    '<div class=\"egol\"><span>'+nombreLmostrar+'</span><b>'+r.lamL.toFixed(2)+' goles esp.</b></div>'+\n    '<div class=\"egol\"><span>'+nombreVmostrar+'</span><b>'+r.lamV.toFixed(2)+' goles esp.</b></div>'+\n    '<div class=\"bar\">'+\n      '<span class=\"h\" style=\"flex-grow:'+Math.max(r.pL,0.06)+'\">'+(r.pL*100).toFixed(1)+'%</span>'+\n      '<span class=\"d\" style=\"flex-grow:'+Math.max(r.pD,0.06)+'\">'+(r.pD*100).toFixed(1)+'%</span>'+\n      '<span class=\"a\" style=\"flex-grow:'+Math.max(r.pV,0.06)+'\">'+(r.pV*100).toFixed(1)+'%</span>'+\n    '</div>'+\n    pickHtml+\n    '<div class=\"kpi\">'+\n      '<div><b>'+(r.overLin[2.5]*100).toFixed(1)+'%</b><small>M\u00e1s de 2.5</small></div>'+\n      '<div><b>'+((1-r.overLin[2.5])*100).toFixed(1)+'%</b><small>Menos de 2.5</small></div>'+\n      '<div><b>'+(r.pBtts*100).toFixed(1)+'%</b><small>Ambos anotan</small></div>'+\n    '</div>'+\n    '<h3>Marcadores m\u00e1s probables</h3><div class=\"marcadores\">'+mHtml+'</div>'+\n    '<h3>Otras l\u00edneas de goles</h3><div class=\"lineas\">'+lHtml+'</div>'};\n}\n\nfunction pintarGameBody(bodyEl, p, eL, eV){\n  var base = bloqueBase(eL, eV, p.local, p.visita);\n  var idGanador = 'cuo'+Math.random().toString(36).slice(2);\n\n  bodyEl.innerHTML = base.html +\n    '<h3>Tabla de posiciones</h3>' + tablaPosicionesHtml(eL, eV) +\n    '<h3>Forma y estadio</h3>' +\n    '<div id=\"'+idGanador+'perfilL\" class=\"nota\">Cargando forma de '+p.local+'...</div>' +\n    '<div id=\"'+idGanador+'perfilV\" class=\"nota\">Cargando forma de '+p.visita+'...</div>' +\n    '<h3>Cara a cara</h3><div id=\"'+idGanador+'h2h\" class=\"nota\">Buscando enfrentamientos directos...</div>' +\n    '<h3>\u00daltimas noticias</h3><div id=\"'+idGanador+'noticias\" class=\"nota\">Buscando noticias...</div>' +\n    '<h3>\u00bfTienes una cuota? Mira si hay valor</h3>' +\n    '<div class=\"cuotasbox\">' +\n      '<div class=\"fila\">' +\n        '<div style=\"flex:1\"><label>Cuota '+p.local+'</label><input type=\"number\" id=\"'+idGanador+'oddL\" placeholder=\"-150\"></div>' +\n        '<div style=\"flex:1\"><label>Cuota empate</label><input type=\"number\" id=\"'+idGanador+'oddD\" placeholder=\"+230\"></div>' +\n        '<div style=\"flex:1\"><label>Cuota '+p.visita+'</label><input type=\"number\" id=\"'+idGanador+'oddV\" placeholder=\"+400\"></div>' +\n      '</div>' +\n      '<button id=\"'+idGanador+'btn\">Calcular valor</button>' +\n      '<div class=\"veredictoCuota\" id=\"'+idGanador+'ver\"></div>' +\n    '</div>' +\n    '<div class=\"nota\">Modelo Poisson con encogimiento estad\u00edstico. Datos en vivo de worldfootball.net.</div>';\n\n  document.getElementById(idGanador+'btn').addEventListener('click', function(){\n    var oL=document.getElementById(idGanador+'oddL').value;\n    var oD=document.getElementById(idGanador+'oddD').value;\n    var oV=document.getElementById(idGanador+'oddV').value;\n    var out = document.getElementById(idGanador+'ver');\n    var filas = [\n      {nom:p.local, odd:oL, modelo:base.r.pL},\n      {nom:'Empate', odd:oD, modelo:base.r.pD},\n      {nom:p.visita, odd:oV, modelo:base.r.pV}\n    ];\n    var html = '';\n    filas.forEach(function(f){\n      var imp = impProb(f.odd);\n      if(imp===null){ return; }\n      var diff = (f.modelo - imp)*100;\n      var hayValor = diff >= 3;\n      html += '<div style=\"margin:6px 0\">'+f.nom+': modelo '+(f.modelo*100).toFixed(1)+'% vs cuota implica '+(imp*100).toFixed(1)+'% \u2014 '+\n        (hayValor ? '<span class=\"si\">hay valor (+'+diff.toFixed(1)+' pts)</span>' : '<span class=\"no\">sin valor ('+diff.toFixed(1)+' pts)</span>')+\n        '</div>';\n    });\n    out.innerHTML = html || 'Mete al menos una cuota.';\n  });\n\n  // cargar perfiles (forma, estadio, noticias) en segundo plano\n  cargarPerfil(p.local, p.hrefLocal).then(function(perf){\n    var el = document.getElementById(idGanador+'perfilL');\n    if(!el) return;\n    if(!perf){ el.textContent = 'No se pudo cargar la forma de '+p.local+'.'; return; }\n    var formaHtml = perf.forma.map(function(f){ return '<span class=\"'+f.res+'\">'+f.res+'</span>'; }).join('');\n    el.innerHTML = '<b>'+p.local+'</b>' +\n      (perf.estadio ? '<div class=\"estadio\">\ud83c\udfdf\ufe0f <b>'+perf.estadio+'</b>'+(perf.capacidad?' \u00b7 '+perf.capacidad+' asientos':'')+'</div>' : '') +\n      (perf.goleador ? '<div class=\"observ\">Goleador del equipo: <b>'+perf.goleador+'</b></div>' : '') +\n      (perf.forma.length ? '<div class=\"forma\">'+formaHtml+'</div>' : '<div class=\"nota\">Sin partidos recientes disponibles.</div>');\n    if(perf.noticias.length){\n      var nEl = document.getElementById(idGanador+'noticias');\n      if(nEl) nEl.innerHTML = perf.noticias.map(function(n){ return '<div class=\"noticia\">'+n+'</div>'; }).join('');\n    }\n  });\n  cargarPerfil(p.visita, p.hrefVisita).then(function(perf){\n    var el = document.getElementById(idGanador+'perfilV');\n    if(!el) return;\n    if(!perf){ el.textContent = 'No se pudo cargar la forma de '+p.visita+'.'; return; }\n    var formaHtml = perf.forma.map(function(f){ return '<span class=\"'+f.res+'\">'+f.res+'</span>'; }).join('');\n    el.innerHTML = '<b>'+p.visita+'</b>' +\n      (perf.estadio ? '<div class=\"estadio\">\ud83c\udfdf\ufe0f <b>'+perf.estadio+'</b>'+(perf.capacidad?' \u00b7 '+perf.capacidad+' asientos':'')+'</div>' : '') +\n      (perf.goleador ? '<div class=\"observ\">Goleador del equipo: <b>'+perf.goleador+'</b></div>' : '') +\n      (perf.forma.length ? '<div class=\"forma\">'+formaHtml+'</div>' : '<div class=\"nota\">Sin partidos recientes disponibles.</div>');\n  });\n\n  // cara a cara: se busca dentro del historial ya cargado de ambos equipos (aproximado, temporada actual)\n  Promise.all([cargarPerfil(p.local, p.hrefLocal), cargarPerfil(p.visita, p.hrefVisita)]).then(function(res){\n    var h2hEl = document.getElementById(idGanador+'h2h');\n    if(!h2hEl) return;\n    var vsEncontrado = null;\n    if(res[0]) vsEncontrado = res[0].forma.find(function(f){ return f.rival===p.visita || p.visita.indexOf(f.rival)>-1; });\n    if(!vsEncontrado){\n      h2hEl.innerHTML = 'No se encontr\u00f3 un enfrentamiento reciente entre estos dos equipos en los \u00faltimos partidos disponibles.';\n    } else {\n      h2hEl.innerHTML = '\u00daltimo enfrentamiento (esta temporada): '+p.local+' '+vsEncontrado.marcador+' '+p.visita+' \u2014 '+\n        (vsEncontrado.res==='V'?'gan\u00f3 '+p.local:(vsEncontrado.res==='D'?'gan\u00f3 '+p.visita:'empataron'))+'.';\n    }\n  });\n}\n\nfunction pintarJuegos(partidos){\n  var cont = document.getElementById('juegos');\n  if(!partidos.length){\n    cont.innerHTML = '<div class=\"estado bad\">No se encontraron partidos por jugar en esta vista.</div>';\n    return;\n  }\n  cont.innerHTML = partidos.map(function(p, idx){\n    return '' +\n    '<div class=\"game\" data-idx=\"'+idx+'\">'+\n      '<div class=\"head\">'+\n        '<div class=\"crestpair\">'+\n          '<div class=\"eq\"><img src=\"'+p.escudoLocal+'\"><span>'+p.local+'</span></div>'+\n          '<div class=\"eq\"><img src=\"'+p.escudoVisita+'\"><span>'+p.visita+'</span></div>'+\n        '</div>'+\n        (p.hora?'<div class=\"hora\">'+p.hora+'</div>':'')+\n        '<div class=\"chev\">\u25be</div>'+\n      '</div>'+\n      '<div class=\"body\"></div>'+\n    '</div>';\n  }).join('');\n\n  cont.querySelectorAll('.game').forEach(function(gameEl, idx){\n    gameEl.querySelector('.head').addEventListener('click', function(){\n      var abierto = gameEl.classList.contains('open');\n      cont.querySelectorAll('.game.open').forEach(function(g){ g.classList.remove('open'); });\n      if(abierto) return;\n      gameEl.classList.add('open');\n      var body = gameEl.querySelector('.body');\n      if(!body.dataset.pintado){\n        var p = partidos[idx];\n        var eL = buscarEquipo(p.local), eV = buscarEquipo(p.visita);\n        if(!eL || !eV){\n          body.innerHTML = '<div class=\"nota\">No se pudieron cruzar los nombres de este partido con la tabla de posiciones.</div>';\n        } else {\n          pintarGameBody(body, p, eL, eV);\n        }\n        body.dataset.pintado = '1';\n      }\n    });\n  });\n}\n\nfunction pintarAlGane(partidos){\n  var cont = document.getElementById('algane');\n  var filas = [];\n  partidos.forEach(function(p){\n    var eL = buscarEquipo(p.local), eV = buscarEquipo(p.visita);\n    if(!eL || !eV) return;\n    var r = calcular(eL, eV);\n    var mejor = Math.max(r.pL, r.pV);\n    var esLocal = mejor===r.pL;\n    filas.push({\n      nombre: esLocal?p.local:p.visita, rival: esLocal?p.visita:p.local,\n      escudo: esLocal?p.escudoLocal:p.escudoVisita, pct: mejor, hora:p.hora\n    });\n  });\n  filas.sort(function(a,b){ return b.pct-a.pct; });\n  if(!filas.length){ cont.innerHTML = '<div class=\"estado bad\">No hay partidos para calcular el ranking.</div>'; return; }\n  cont.innerHTML = filas.map(function(f,i){\n    return '<div class=\"fila-rank\"><div class=\"pos\">'+(i+1)+'</div><img src=\"'+f.escudo+'\">'+\n      '<div class=\"nom\">'+f.nombre+' vs '+f.rival+'</div><div class=\"pct\">'+(f.pct*100).toFixed(1)+'%</div></div>';\n  }).join('');\n}\n\nfunction cargarLiga(clave){\n  LIGA_ACTUAL = clave;\n  CACHE_PERFIL = {};\n  var liga = LIGAS[clave];\n  var estado = document.getElementById('estado');\n  estado.className = 'estado';\n  estado.textContent = 'Bajando '+liga.nombre+' en vivo...';\n  document.getElementById('juegos').innerHTML = '';\n  document.getElementById('algane').innerHTML = '';\n\n  Promise.all([\n    fetch(liga.url+'?v='+Date.now()).then(function(r){ return r.text(); }),\n    fetch(liga.urlPartidos+'?v='+Date.now()).then(function(r){ return r.text(); })\n  ]).then(function(res){\n    EQUIPOS = extraerTabla(res[0]);\n    PARTIDOS = extraerPartidos(res[1]);\n    if(!EQUIPOS.length){ throw new Error('no se pudo leer la tabla de posiciones'); }\n    pintarJuegos(PARTIDOS);\n    pintarAlGane(PARTIDOS);\n    var ahora = new Date().toLocaleString('es', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});\n    estado.textContent = '\u2713 '+liga.nombre+' \u2014 '+EQUIPOS.length+' equipos, '+PARTIDOS.length+' partidos \u2014 en vivo ('+ahora+').';\n    estado.className = 'estado ok';\n  }).catch(function(e){\n    estado.textContent = '\u2717 No se pudo cargar '+liga.nombre+': '+e.message;\n    estado.className = 'estado bad';\n  });\n}\n\ndocument.querySelectorAll('.tb').forEach(function(btn){\n  btn.addEventListener('click', function(){\n    document.querySelectorAll('.tb').forEach(function(b){ b.classList.remove('on'); });\n    btn.classList.add('on');\n    document.querySelectorAll('.vista').forEach(function(v){ v.classList.remove('on'); });\n    document.getElementById('vista'+(btn.dataset.vista==='juegos'?'Juegos':'Algane')).classList.add('on');\n  });\n});\n\ncargarLiga(document.getElementById('ligaSel').value);\ndocument.getElementById('ligaSel').addEventListener('change', function(){\n  cargarLiga(this.value);\n});\n<\/script>\n</body>\n</html>\n";
