adius:20px;padding:5px 10px;flex:0 0 auto;white-space:nowrap}\n.chev{color:var(--mut2);font-size:18px;flex:0 0 auto;transition:transform .2s}\n.game.open .chev{transform:rotate(180deg)}\n\n.body{display:none;padding:0 14px 16px}\n.game.open .body{display:block}\n\n.egol{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:4px 0}\n.egol b{color:var(--txt)}\n.bar{height:38px;display:flex;border-radius:12px;overflow:hidden;background:var(--bg2);\n margin:12px 0;border:1px solid var(--line2)}\n.bar span{display:flex;align-items:center;justify-content:center;font-family:var(--cond);\n font-size:13.5px;font-weight:800;transition:flex-grow .5s}\n.bar .h{background:linear-gradient(90deg,#D89626,var(--hot));color:var(--hotTx)}\n.bar .d{background:var(--bg3);color:var(--mut)}\n.bar .a{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}\n\n.pick{border-left:3px solid var(--good);background:linear-gradient(135deg,rgba(52,211,153,.16),rgba(52,211,153,.04));\n border-radius:0 var(--r) var(--r) 0;padding:11px 13px;margin:10px 0;font-size:13px}\n.pick b{display:block;color:var(--good);font-size:14.5px;margin-bottom:2px}\n.pick.no{border-left-color:var(--line2);background:var(--bg2)}\n.pick.no b{color:var(--mut)}\n\n.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}\n.kpi div{background:var(--bg2);border-radius:var(--r);padding:10px;text-align:center}\n.kpi b{display:block;font-size:17px;font-weight:800;font-family:var(--cond)}\n.kpi small{color:var(--mut);font-size:10.5px}\n\nh3{font-size:11.5px;color:var(--mut);margin:14px 0 7px;font-weight:700;text-transform:uppercase;\n letter-spacing:.5px}\n.marcadores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}\n.marcadores div{background:var(--bg2);border-radius:var(--r);padding:8px 4px;text-align:center}\n.marcadores b{display:block;font-family:var(--cond);font-size:15px;font-weight:800}\n.marcadores small{color:var(--mut);font-size:10px}\n.lineas{display:flex;flex-direction:column;gap:6px}\n.linea{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);\n border-radius:var(--r);padding:8px 11px;font-size:12.5px}\n.linea b{font-family:var(--cond)}\n.nota{font-size:10.5px;color:var(--mut2);line-height:1.5;margin-top:12px}\n\n.manual{background:var(--bg1);border:1px dashed var(--line2);border-radius:var(--r2);\n padding:14px;margin:18px 0;font-size:13px}\n.manual summary{cursor:pointer;color:var(--mut);font-weight:700;font-size:12.5px}\n.manual select{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);\n border-radius:var(--r);padding:11px;font-size:14px;margin:8px 0;-webkit-appearance:none}\n.manual button{background:var(--acc);color:var(--accTx);border:0;border-radius:var(--r);\n padding:12px;font-size:14.5px;font-weight:700;width:100%;cursor:pointer;margin-top:6px}\n</style>\n</head>\n<body>\n<header>\n <h1>\u26bd F\u00daTBOL</h1>\n <select id=\"ligaSel\">\n  <option value=\"pl\">Premier League</option>\n  <option value=\"laliga\">La Liga</option>\n  <option value=\"seriea\">Serie A</option>\n  <option value=\"bundesliga\">Bundesliga</option>\n  <option value=\"ligue1\">Ligue 1</option>\n  <option value=\"cl\">Champions League</option>\n </select>\n</header>\n<main>\n <div class=\"estado\" id=\"estado\">Cargando...</div>\n <div id=\"juegos\"></div>\n\n <details class=\"manual\">\n  <summary>\u00bfNo ves el partido que buscas? Comp\u00e1ralo t\u00fa mismo</summary>\n  <select id=\"local\"></select>\n  <select id=\"visita\"></select>\n  <button id=\"irManual\">Calcular</button>\n  <div id=\"resultadoManual\"></div>\n </details>\n</main>\n\n<script>\nvar EQUIPOS = null;\nvar LIGA_ACTUAL = null;\n\nvar LIGAS = {\n  pl:  {nombre:'Premier League', url:'https://www.worldfootball.net/competition/co91/england-premier-league/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co91/england-premier-league/results-and-standings/'},\n  laliga: {nombre:'La Liga', url:'https://www.worldfootball.net/competition/co97/spain-primera-division/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co97/spain-primera-division/results-and-standings/'},\n  seriea: {nombre:'Serie A', url:'https://www.worldfootball.net/competition/co111/italy-serie-a/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co111/italy-serie-a/results-and-standings/'},\n  bundesliga: {nombre:'Bundesliga', url:'https://www.worldfootball.net/competition/co12/germany-bundesliga/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co12/germany-bundesliga/results-and-standings/'},\n  ligue1: {nombre:'Ligue 1', url:'https://www.worldfootball.net/competition/co71/france-ligue-1/team-statistics-overview/', urlPartidos:'https://www.worldfootball.net/competition/co71/france-ligue-1/results-and-standings/'},\n  cl: {nombre:'Champions League', url:'https://www.worldfootball.net/competition/co19/uefa-champions-league/results-and-standings/', urlPartidos:'https://www.worldfootball.net/competition/co19/uefa-champions-league/results-and-standings/'}\n};\n\n// ---------- extraer tabla de posiciones (para el modelo) ----------\nfunction extraerTabla(html){\n  var doc = new DOMParser().parseFromString(html, 'text/html');\n  var tablas = doc.querySelectorAll('table');\n  var mejor = null, mejorCuenta = 0;\n  tablas.forEach(function(t){\n    var cuenta = 0;\n    t.querySelectorAll('tr').forEach(function(f){\n      if(/\\d+\\s*:\\s*\\d+/.test(f.textContent)) cuenta++;\n    });\n    if(cuenta > mejorCuenta){ mejorCuenta = cuenta; mejor = t; }\n  });\n  if(!mejor) return [];\n  var equipos = [];\n  mejor.querySelectorAll('tr').forEach(function(fila){\n    var celdas = fila.querySelectorAll('td');\n    if(celdas.length < 5) return;\n    var textoFila = Array.from(celdas).map(function(c){ return c.textContent.trim(); });\n    var links = fila.querySelectorAll('a');\n    var nombre = null, mejorLargo = 0;\n    links.forEach(function(a){\n      var t = a.textContent.trim();\n      if(t.length > mejorLargo && !/^\\d+$/.test(t)){ mejorLargo = t.length; nombre = t; }\n    });\n    if(!nombre) return;\n    var marcador = null, idxMarcador = -1;\n    for(var i=0;i<textoFila.length;i++){\n      if(/^\\d+\\s*:\\s*\\d+$/.test(textoFila[i])){ marcador = textoFila[i]; idxMarcador = i; break; }\n    }\n    if(!marcador) return;\n    var partes = marcador.split(':').map(function(s){ return +s.trim(); });\n    var pj = null;\n    if(idxMarcador>=4){\n      var candidato = textoFila[idxMarcador-4];\n      if(/^\\d+$/.test(candidato)) pj = +candidato;\n    }\n    if(!pj) return;\n    if(equipos.some(function(e){ return e.nombre===nombre; })) return;\n    equipos.push({nombre:nombre, pj:pj, gf:partes[0], gc:partes[1]});\n  });\n  return equipos;\n}\n\n// ---------- extraer partidos por jugar (para la lista de juegos) ----------\nfunction extraerPartidos(html){\n  var doc = new DOMParser().parseFromString(html, 'text/html');\n  var enlaces = doc.querySelectorAll('a[href*=\"match-report\"]');\n  var vistos = {}, partidos = [];\n  enlaces.forEach(function(a){\n    var href = a.getAttribute('href');\n    if(vistos[href]) return;\n    vistos[href] = true;\n\n    // subir hasta encontrar un contenedor con 2 escudos\n    var cont = a, escudos = [], intentos = 0;\n    while(cont && intentos < 6){\n      escudos = cont.querySelectorAll ? cont.querySelectorAll('img[src*=\"emblem\"]') : [];\n      if(escudos.length >= 2) break;\n      cont = cont.parentElement;\n      intentos++;\n    }\n    if(!cont || escudos.length < 2) return;\n\n    var nombreLocal = escudos[0].getAttribute('alt') || escudos[0].getAttribute('title');\n    var nombreVisita = escudos[1].getAttribute('alt') || escudos[1].getAttribute('title');\n    if(!nombreLocal || !nombreVisita) return;\n\n    var texto = cont.textContent.replace(/\\s+/g,' ');\n    if(/Ended/i.test(texto)) return; // ya jugado, no nos sirve para la lista\n    var horaM = texto.match(/\\b([01]?\\d|2[0-3]):([0-5]\\d)\\b/);\n    var hora = horaM ? horaM[0] : '';\n\n    var clave = nombreLocal+'|'+nombreVisita;\n    if(partidos.some(function(p){ return p.clave===clave; })) return;\n    partidos.push({\n      clave: clave,\n      local: nombreLocal, visita: nombreVisita,\n      escudoLocal: escudos[0].src, escudoVisita: escudos[1].src,\n      hora: hora\n    });\n  });\n  return partidos.slice(0,15);\n}\n\nfunction poissonProb(k,lambda){\n  var l=Math.exp(-lambda), num=1;\n  for(var i=1;i<=k;i++){ num*=lambda/i; }\n  return l*num;\n}\n\nfunction buscarEquipo(nombre){\n  if(!EQUIPOS) return null;\n  var e = EQUIPOS.find(function(x){ return x.nombre===nombre; });\n  if(e) return e;\n  // intento flexible: contiene\n  return EQUIPOS.find(function(x){ return x.nombre.indexOf(nombre)>-1 || nombre.indexOf(x.nombre)>-1; }) || null;\n}\n\nfunction calcular(eL, eV){\n  var totalGF=0, totalPJ=0;\n  EQUIPOS.forEach(function(e){ totalGF+=e.gf; totalPJ+=e.pj; });\n  var ligaProm = totalGF / totalPJ;\n  var K = 6;\n  function gfAj(e){ return (e.gf + K*ligaProm) / (e.pj + K); }\n  function gcAj(e){ return (e.gc + K*ligaProm) / (e.pj + K); }\n  var HOME_ADV = 1.35;\n  var atkL = gfAj(eL)/ligaProm, defL = gcAj(eL)/ligaProm;\n  var atkV = gfAj(eV)/ligaProm, defV = gcAj(eV)/ligaProm;\n  var lamL = ligaProm*atkL*defV*HOME_ADV;\n  var lamV = ligaProm*atkV*defL/HOME_ADV;\n\n  var MAXG=8, pL=0,pD=0,pV=0,pBtts=0;\n  var overLin={1.5:0,2.5:0,3.5:0};\n  var marcadores=[];\n  for(var i=0;i<=MAXG;i++) for(var j=0;j<=MAXG;j++){\n    var p=poissonProb(i,lamL)*poissonProb(j,lamV);\n    if(i>j) pL+=p; else if(i===j) pD+=p; else pV+=p;\n    [1.5,2.5,3.5].forEach(function(lin){ if(i+j>lin) overLin[lin]+=p; });\n    if(i>=1&&j>=1) pBtts+=p;\n    marcadores.push({i:i,j:j,p:p});\n  }\n  var suma=pL+pD+pV; pL/=suma; pD/=suma; pV/=suma;\n  marcadores.sort(function(a,b){ return b.p-a.p; });\n  return {lamL:lamL, lamV:lamV, pL:pL, pD:pD, pV:pV, overLin:overLin, pBtts:pBtts, marcadores:marcadores};\n}\n\nfunction bloqueResultado(eL, eV, nombreLmostrar, nombreVmostrar){\n  var r = calcular(eL, eV);\n  var favorito, favTxt, favClase;\n  var mejor = Math.max(r.pL, r.pD, r.pV);\n  if(mejor===r.pL){ favorito=nombreLmostrar; favTxt=(r.pL*100).toFixed(1)+'%'; }\n  else if(mejor===r.pV){ favorito=nombreVmostrar; favTxt=(r.pV*100).toFixed(1)+'%'; }\n  else { favorito=null; }\n\n  var pickHtml;\n  if(favorito && mejor>=0.45){\n    pickHtml = '<div class=\"pick\"><b>Favorito: '+favorito+'</b>'+favTxt+' de probabilidad \u2014 '+\n      (r.overLin[2.5]>=0.55?'partido con tendencia a m\u00e1s de 2.5 goles':'partido m\u00e1s cerrado en goles')+'.</div>';\n  } else {\n    pickHtml = '<div class=\"pick no\"><b>Muy parejo</b>Ning\u00fan equipo pasa del 45% \u2014 no hay favorito claro.</div>';\n  }\n\n  var mHtml='';\n  r.marcadores.slice(0,6).forEach(function(m){\n    mHtml += '<div><b>'+m.i+'-'+m.j+'</b><small>'+(m.p*100).toFixed(1)+'%</small></div>';\n  });\n\n  var lHtml='';\n  [1.5,2.5,3.5].forEach(function(lin){\n    lHtml += '<div class=\"linea\"><span>M\u00e1s de '+lin+' goles</span><b>'+(r.overLin[lin]*100).toFixed(1)+'%</b></div>';\n  });\n\n  return '' +\n    '<div class=\"egol\"><span>'+nombreLmostrar+'</span><b>'+r.lamL.toFixed(2)+' goles esp.</b></div>'+\n    '<div class=\"egol\"><span>'+nombreVmostrar+'</span><b>'+r.lamV.toFixed(2)+' goles esp.</b></div>'+\n    '<div class=\"bar\">'+\n      '<span class=\"h\" style=\"flex-grow:'+Math.max(r.pL,0.06)+'\">'+(r.pL*100).toFixed(1)+'%</span>'+\n      '<span class=\"d\" style=\"flex-grow:'+Math.max(r.pD,0.06)+'\">'+(r.pD*100).toFixed(1)+'%</span>'+\n      '<span class=\"a\" style=\"flex-grow:'+Math.max(r.pV,0.06)+'\">'+(r.pV*100).toFixed(1)+'%</span>'+\n    '</div>'+\n    pickHtml+\n    '<div class=\"kpi\">'+\n      '<div><b>'+(r.overLin[2.5]*100).toFixed(1)+'%</b><small>M\u00e1s de 2.5</small></div>'+\n      '<div><b>'+((1-r.overLin[2.5])*100).toFixed(1)+'%</b><small>Menos de 2.5</small></div>'+\n      '<div><b>'+(r.pBtts*100).toFixed(1)+'%</b><small>Ambos anotan</small></div>'+\n    '</div>'+\n    '<h3>Marcadores m\u00e1s probables</h3><div class=\"marcadores\">'+mHtml+'</div>'+\n    '<h3>Otras l\u00edneas de goles</h3><div class=\"lineas\">'+lHtml+'</div>'+\n    '<div class=\"nota\">Modelo Poisson con encogimiento estad\u00edstico. Datos en vivo de worldfootball.net.</div>';\n}\n\nfunction pintarJuegos(partidos){\n  var cont = document.getElementById('juegos');\n  if(!partidos.length){\n    cont.innerHTML = '<div class=\"estado bad\">No se encontraron partidos por jugar en esta vista. Usa el comparador manual abajo.</div>';\n    return;\n  }\n  cont.innerHTML = partidos.map(function(p, idx){\n    return '' +\n    '<div class=\"game\" data-idx=\"'+idx+'\">'+\n      '<div class=\"head\">'+\n        '<div class=\"crestpair\">'+\n          '<div class=\"eq\"><img src=\"'+p.escudoLocal+'\"><span>'+p.local+'</span></div>'+\n          '<div class=\"eq\"><img src=\"'+p.escudoVisita+'\"><span>'+p.visita+'</span></div>'+\n        '</div>'+\n        (p.hora?'<div class=\"hora\">'+p.hora+'</div>':'')+\n        '<div class=\"chev\">\u25be</div>'+\n      '</div>'+\n      '<div class=\"body\"></div>'+\n    '</div>';\n  }).join('');\n\n  cont.querySelectorAll('.game').forEach(function(gameEl, idx){\n    gameEl.querySelector('.head').addEventListener('click', function(){\n      var abierto = gameEl.classList.contains('open');\n      cont.querySelectorAll('.game.open').forEach(function(g){ g.classList.remove('open'); });\n      if(abierto) return;\n      gameEl.classList.add('open');\n      var body = gameEl.querySelector('.body');\n      if(!body.dataset.pintado){\n        var p = partidos[idx];\n        var eL = buscarEquipo(p.local), eV = buscarEquipo(p.visita);\n        if(!eL || !eV){\n          body.innerHTML = '<div class=\"nota\">No se pudieron cruzar los nombres de este partido con la tabla de posiciones.</div>';\n        } else {\n          body.innerHTML = bloqueResultado(eL, eV, p.local, p.visita);\n        }\n        body.dataset.pintado = '1';\n      }\n    });\n  });\n}\n\nfunction llenarSelectManual(){\n  var sL=document.getElementById('local'), sV=document.getElementById('visita');\n  sL.innerHTML=''; sV.innerHTML='';\n  EQUIPOS.forEach(function(e,i){\n    var o1=document.createElement('option'); o1.value=i; o1.textContent=e.nombre;\n    var o2=document.createElement('option'); o2.value=i; o2.textContent=e.nombre;\n    sL.appendChild(o1); sV.appendChild(o2);\n  });\n  sV.selectedIndex = Math.min(1, EQUIPOS.length-1);\n}\n\ndocument.getElementById('irManual').addEventListener('click', function(){\n  if(!EQUIPOS) return;\n  var iL=+document.getElementById('local').value, iV=+document.getElementById('visita').value;\n  if(iL===iV){ alert('Elige dos equipos distintos.'); return; }\n  var eL=EQUIPOS[iL], eV=EQUIPOS[iV];\n  document.getElementById('resultadoManual').innerHTML = bloqueResultado(eL, eV, eL.nombre, eV.nombre);\n});\n\nfunction cargarLiga(clave){\n  LIGA_ACTUAL = clave;\n  var liga = LIGAS[clave];\n  var estado = document.getElementById('estado');\n  estado.className = 'estado';\n  estado.textContent = 'Bajando '+liga.nombre+' en vivo...';\n  document.getElementById('juegos').innerHTML = '';\n\n  Promise.all([\n    fetch(liga.url+'?v='+Date.now()).then(function(r){ return r.text(); }),\n    fetch(liga.urlPartidos+'?v='+Date.now()).then(function(r){ return r.text(); })\n  ]).then(function(res){\n    EQUIPOS = extraerTabla(res[0]);\n    var partidos = extraerPartidos(res[1]);\n    if(!EQUIPOS.length){ throw new Error('no se pudo leer la tabla de posiciones'); }\n    llenarSelectManual();\n    pintarJuegos(partidos);\n    var ahora = new Date().toLocaleString('es', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});\n    estado.textContent = '\u2713 '+liga.nombre+' \u2014 '+EQUIPOS.length+' equipos, '+partidos.length+' partidos \u2014 en vivo ('+ahora+').';\n    estado.className = 'estado ok';\n  }).catch(function(e){\n    estado.textContent = '\u2717 No se pudo cargar '+liga.nombre+': '+e.message;\n    estado.className = 'estado bad';\n  });\n}\n\ncargarLiga(document.getElementById('ligaSel').value);\ndocument.getElementById('ligaSel').addEventListener('change', function(){\n  cargarLiga(this.value);\n});\n<\/script>\n</body>\n</html>\n";

    return r.json();
  }).then(function(d){
    w('Archivo actual: '+(d.sha?('existe, '+d.sha.slice(0,7)):'no existe todavia')+'.','ok');
    w('Subiendo version nueva ('+CONTENIDO.length+' caracteres)...');
    var body={ message:'futbol.html con tarjetas de juegos estilo MLB', content:b64enc(CONTENIDO) };
    if(d.sha) body.sha=d.sha;
    return fetch(API,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},HDR),body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error('GitHub rechazo (HTTP '+r.status+'): '+t.slice(0,200)); });
    return r.json();
  }).then(function(){
    w('\n\u2713 Subido. Dale 1-2 minutos y abre futbol.html.','ok');
    document.getElementById('ir').disabled=false;
  }).catch(function(e){
    w('\n\u2717 Error: '+e.message,'bad');
    document.getElementById('ir').disabled=false;
  });
});
</script>
</body>
