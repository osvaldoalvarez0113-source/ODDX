<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<title>OVA · Récord</title>
<!-- Página PÚBLICA a propósito (sin acceso.js): solo muestra juegos YA jugados y calificados, nunca lo que viene.
     Los datos salen de record.json (rama «liga»), que arma el robot scripts/liga.js. Cada pronóstico se guardó en GitHub
     antes del juego: el historial de la rama «liga» (enlace abajo) muestra la fecha y hora de cada versión. -->
<style>
:root{--bg:#0A0908;--bg1:#13110D;--line:#2A2418;--tx:#F1E9D6;--mut:#A09472;--acc:#C9A24A;--good:#6FD39A;--bad:#F08A78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,Inter,sans-serif;padding:20px 14px 60px;max-width:720px;margin:auto}
h1{font-size:24px;margin:0 0 2px;color:var(--acc);letter-spacing:.02em}.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
.tot{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.c{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:12px}.c b{display:block;font-size:22px}.c span{color:var(--mut);font-size:12.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.seg button{background:var(--bg1);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.seg button.on{border-color:var(--acc);color:var(--acc)}
.j{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:13.5px}
.j small{color:var(--mut);display:block;font-size:12px}.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
a{color:var(--acc)}.nota{color:var(--mut);font-size:12.5px;margin-top:18px}
</style>
</head>
<body>
<h1>OVA · Récord</h1>
<p class="sub" id="sub">Cargando…</p>
<div class="tot" id="tot"></div>
<div class="seg" id="seg"></div>
<div id="lista"></div>
<p class="nota">Cada pronóstico se guardó <b>antes</b> de empezar el juego y no se puede cambiar después: el historial público de GitHub
muestra la fecha y la hora de cada versión (<a id="hist" href="#">ver historial</a>). Aquí solo salen juegos ya jugados.</p>
<script>
(function(){
  var URL='https://raw.githubusercontent.com/osvaldoalvarez0113-source/ODDX/liga/record.json';
  var DEP={nba:'🏀 NBA',nhl:'🏒 NHL',nfl:'🏈 NFL',mlb:'⚾ MLB',futbol:'⚽ Fútbol',tenis:'🎾 Tenis'};
  var datos=null, filtro='todos';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fecha(t){ return new Date(t).toLocaleString('es',{timeZone:'America/Chicago',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }
  function pintar(){
    var d=datos, tot=document.getElementById('tot'), seg=document.getElementById('seg'), li=document.getElementById('lista');
    var ks=Object.keys(d.deportes||{}), J=0, A=0; ks.forEach(function(k){ J+=d.deportes[k].juegos; A+=d.deportes[k].aciertos; });
    document.getElementById('sub').textContent=J?('Actualizado '+fecha(Date.parse(d.generado))+' (hora de Chicago)'):'Todavía no hay juegos calificados.';
    document.getElementById('hist').href=d.historial;
    tot.innerHTML=(J?'<div class="c"><b>'+(100*A/J).toFixed(1)+'%</b><span>Total · '+A+' de '+J+'</span></div>':'')+ks.map(function(k){ var x=d.deportes[k];
      return '<div class="c"><b>'+(100*x.aciertos/x.juegos).toFixed(1)+'%</b><span>'+(DEP[k]||esc(x.nombre))+' · '+x.aciertos+' de '+x.juegos+'</span></div>'; }).join('');
    seg.innerHTML=['todos'].concat(ks).map(function(k){ return '<button data-k="'+k+'" class="'+(filtro===k?'on':'')+'">'+(k==='todos'?'Todos':(DEP[k]||k))+'</button>'; }).join('');
    Array.prototype.forEach.call(seg.querySelectorAll('button'),function(b){ b.onclick=function(){ filtro=b.getAttribute('data-k'); pintar(); }; });
    li.innerHTML=(d.juegos||[]).filter(function(j){ return filtro==='todos'||j.dep===filtro; }).slice(0,200).map(function(j){
      var quien=j.pick==='L'?j.local:(j.pick==='A'?j.visita:'Empate'), ok=j.pick===j.res;
      return '<div class="j"><div><b>'+esc(quien)+'</b> '+Math.round(j.p*100)+'%<small>'+(DEP[j.dep]||j.dep)+' · '+esc(j.local)+' vs '+esc(j.visita)+' · '+fecha(j.ts)+
        (j.gl!=null?' · '+j.gl+'-'+j.gv:'')+'</small><small>Guardado '+(j.guardado?fecha(j.guardado):'—')+' · '+esc((d.nombres&&d.nombres[j.tit])||j.tit)+'</small></div>'+
        '<div class="'+(ok?'ok':'no')+'">'+(ok?'✓':'✗')+'</div></div>';
    }).join('');
  }
  fetch(URL+'?t='+Date.now()).then(function(r){ return r.ok?r.json():null; }).then(function(j){
    if(!j){ document.getElementById('sub').textContent='No se pudo leer el récord.'; return; }
    datos=j; pintar();
  }).catch(function(){ document.getElementById('sub').textContent='Sin conexión.'; });
})();
</script>
</body>
</html>
