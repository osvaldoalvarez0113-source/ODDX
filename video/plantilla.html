<!DOCTYPE html>
<!-- Plantilla del video de picks de OVA (scripts/video.js la llena con window.DATA y la graba cuadro por cuadro). --><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#07070a;overflow:hidden;font-family:'Montserrat','Inter',sans-serif;color:#f4efe3}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 900px at 50% 18%,#2a2110 0%,#0b0a08 55%,#050505 100%)}
.grain{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(212,175,55,.035) 0 2px,transparent 2px 28px)}
.scene{position:absolute;inset:0;display:none}
.gold{color:#e6c35c}
.logo{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:.06em}
.pill{display:inline-block;padding:14px 34px;border:2px solid rgba(230,195,92,.55);border-radius:60px;font-weight:700;font-size:36px;letter-spacing:.12em;color:#e6c35c;background:rgba(230,195,92,.07)}
.card{position:absolute;left:70px;right:70px;top:430px;height:1060px;border-radius:56px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:2px solid rgba(230,195,92,.35);box-shadow:0 40px 120px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden}
.team{position:absolute;width:300px;text-align:center;top:200px}
.disc{width:220px;height:220px;border-radius:50%;margin:0 auto 26px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:76px;letter-spacing:.02em;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.tname{font-weight:800;font-size:44px;line-height:1.1}
.tsub{font-weight:600;font-size:28px;color:#a59c88;margin-top:8px;letter-spacing:.1em}
.vs{position:absolute;left:0;right:0;top:290px;text-align:center;font-weight:800;font-size:44px;color:#6f6759}
.bar{position:absolute;left:70px;right:70px;top:720px;height:34px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden}
.fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#9b7a22,#e6c35c,#fff1b8)}
.pct{position:absolute;left:0;right:0;top:790px;text-align:center;font-weight:900;font-size:150px;line-height:1}
.pk{position:absolute;left:0;right:0;top:960px;text-align:center;font-weight:700;font-size:34px;color:#c9bfa8;letter-spacing:.06em}
.head{position:absolute;left:0;right:0;top:250px;text-align:center}
.when{position:absolute;left:0;right:0;top:80px;text-align:center;font-weight:700;font-size:32px;letter-spacing:.14em;color:#a59c88}
.row{position:absolute;left:90px;right:90px;height:170px;border-radius:36px;background:rgba(255,255,255,.05);border:2px solid rgba(230,195,92,.22);display:flex;align-items:center;padding:0 44px}
.row .d{font-weight:900;font-size:50px;width:260px}
.row .r{font-weight:700;font-size:38px;color:#c9bfa8;flex:1}
.row .p{font-weight:900;font-size:64px;color:#e6c35c}
.foot{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:30px;color:#8a826f;font-weight:600;letter-spacing:.05em}
#fade{position:absolute;inset:0;background:#000;pointer-events:none}
</style></head><body>
<div id="bg"></div><div class="grain"></div>
<div class="scene" id="s-intro">
  <div class="logo" id="ilogo" style="top:640px;font-size:280px">OVA</div>
  <div style="position:absolute;left:0;right:0;top:960px;text-align:center"><span class="pill" id="ipill">PICKS DEL DÍA</span></div>
  <div id="idate" style="position:absolute;left:0;right:0;top:1090px;text-align:center;font-weight:700;font-size:46px;color:#c9bfa8"></div>
  <div id="iline" style="position:absolute;left:50%;top:900px;height:4px;width:0;background:linear-gradient(90deg,transparent,#e6c35c,transparent);transform:translateX(-50%)"></div>
</div>
<div class="scene" id="s-pick">
  <div class="head"><span class="pill" id="pnum"></span></div>
  <div class="card" id="pcard">
    <div class="when" id="pwhen"></div>
    <div class="team" id="ta" style="left:60px"><div class="disc" id="da"></div><div class="tname" id="na"></div><div class="tsub">VISITA</div></div>
    <div class="vs">@</div>
    <div class="team" id="th" style="right:60px"><div class="disc" id="dh"></div><div class="tname" id="nh"></div><div class="tsub">LOCAL</div></div>
    <div class="bar"><div class="fill" id="pfill" style="width:0"></div></div>
    <div class="pct gold" id="ppct">0%</div>
    <div class="pk" id="ppk"></div>
  </div>
  <div class="foot">Probabilidad de la liga de modelos OVA</div>
</div>
<div class="scene" id="s-rec">
  <div class="head" style="top:300px"><span class="pill">CÓMO VA LA LIGA</span></div>
  <div style="position:absolute;left:0;right:0;top:430px;text-align:center;font-weight:800;font-size:58px">Aciertos del modelo</div>
  <div id="rows"></div>
  <div class="foot">Juegos ya jugados · lo califica el robot solo</div>
</div>
<div class="scene" id="s-out">
  <div class="logo gold" id="ologo" style="top:700px;font-size:240px">OVA</div>
  <div id="otxt" style="position:absolute;left:0;right:0;top:990px;text-align:center;font-weight:700;font-size:48px;color:#c9bfa8;line-height:1.35">El modelo que<br>se mide solo</div>
</div>
<div id="fade"></div>
<script>/*DATOS*/

const D=window.DATA||{picks:[],rec:[],fecha:''};const PICKS=D.picks, REC=D.rec;
const cl=(x)=>Math.max(0,Math.min(1,x)), eo=(x)=>1-Math.pow(1-cl(x),3), eb=(x)=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.scene').forEach(s=>s.style.display=s.id===id?'block':'none')}
function fade(t,dur){const a=cl(1-t/0.25), b=cl((t-(dur-0.25))/0.25); $('fade').style.opacity=Math.max(a,b)}
window.render=function(sc,i,t,dur){
 fade(t,dur);
 if(sc==='intro'){show('s-intro');
  $('ilogo').style.transform='scale('+(0.6+0.4*eb(t/0.9))+')';$('ilogo').style.opacity=cl(t/0.5);
  $('ilogo').style.textShadow='0 0 '+(40+30*Math.sin(t*3))+'px rgba(230,195,92,.45)';
  $('ilogo').style.color='#e6c35c';
  $('iline').style.width=(700*eo((t-0.5)/0.8))+'px';
  $('ipill').style.opacity=cl((t-0.8)/0.4);$('ipill').style.transform='translateY('+(30*(1-eo((t-0.8)/0.5)))+'px)';$('ipill').style.display='inline-block';
  $('idate').textContent=D.fecha;$('idate').style.opacity=cl((t-1.1)/0.4);}
 if(sc==='pick'){show('s-pick');const P=PICKS[i];
  $('pnum').textContent='PICK '+(i+1)+' DE '+PICKS.length;$('pwhen').textContent=P.liga;
  [['a','da','na'],['h','dh','nh']].forEach(([k,d,n])=>{const T=P[k];$(d).textContent=T[0];$(d).style.background=T[2];$(d).style.color=T[3];$(n).textContent=T[1];
    const win=P.lado===k;$(d).style.outline=win?'6px solid #e6c35c':'none';$(d).style.outlineOffset='8px';$(d).parentNode.style.opacity=win?1:(0.45+0.55*cl(1-(t-1.2)/0.5));});
  $('pcard').style.transform='translateY('+(260*(1-eo(t/0.7)))+'px) scale('+(0.94+0.06*eo(t/0.7))+')';$('pcard').style.opacity=cl(t/0.35);
  const f=eo((t-0.6)/1.1);$('pfill').style.width=(P.p*f)+'%';$('ppct').textContent=Math.round(P.p*f)+'%';
  $('ppk').textContent='Gana '+(P.lado==='h'?P.h[1]:P.a[1]);$('ppk').style.opacity=cl((t-1.4)/0.4);}
 if(sc==='rec'){show('s-rec');let h='';REC.forEach((r,k)=>{const tt=t-0.35-k*0.22,o=cl(tt/0.35),x=120*(1-eo(tt/0.5));const pv=Math.round(r[2]*eo((tt-0.2)/0.9));
   h+='<div class="row" style="top:'+(560+k*210)+'px;opacity:'+o+';transform:translateX('+x+'px)"><div class="d">'+r[0]+'</div><div class="r">'+r[1]+'</div><div class="p">'+pv+'%</div></div>';});$('rows').innerHTML=h;}
 if(sc==='out'){show('s-out');$('ologo').style.transform='scale('+(0.85+0.15*eb(t/0.8))+')';$('ologo').style.opacity=cl(t/0.4);$('ologo').style.textShadow='0 0 60px rgba(230,195,92,.5)';$('otxt').style.opacity=cl((t-0.5)/0.5);}
};
</script></body></html>
