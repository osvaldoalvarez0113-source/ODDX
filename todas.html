<!DOCTYPE html>
<html lang="es" data-app="todas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<title>OVA · Lo mejor de hoy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OVA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0A0908;--bg1:#13110D;--line2:#43381F;--txt:#F7F2E7;--mut:#CBBFA5;--hot:#F0CE6B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(env(safe-area-inset-bottom,0px) + 24px)}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.top a{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);color:var(--txt);text-decoration:none;font-size:22px;background:var(--bg1)}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.02em}
.top button{margin-left:auto;border:1px solid var(--line2);background:var(--bg1);color:var(--txt);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700}
.gnTit{margin:0 2px 10px;font-size:13px;line-height:1.4;color:var(--mut)}
.gnDia{margin:16px 0 6px;font-size:13px;font-weight:800;color:var(--mut)}
.gnNota{margin:14px 0;font-size:12.5px;line-height:1.5;color:var(--mut)}.gnNota b{color:var(--txt)}
</style>
</head>
<body>
<div class="top"><a href="hub.html" aria-label="Inicio">‹</a><h1>🎯 Lo mejor de hoy</h1><button type="button" id="t5Act">↻</button></div>
<div id="t5Caja"></div>
<script src="top5.js"></script>
<script>
(function(){
 var c=document.getElementById('t5Caja'), T=window.OVATop5; if(!T||!T.pintar) return;
 T.pintar(c);
 document.getElementById('t5Act').addEventListener('click',function(){ T.pintar(c,true); });
 document.addEventListener('visibilitychange',function(){ if(!document.hidden) T.pintar(c); });
})();
</script>
</body>
</html>
